<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebHub 관리자</title>
  <meta name="theme-color" content="#050505" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20width%3D%271746%27%20height%3D%271745%27%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20xmlns%3Axlink%3D%27http%3A//www.w3.org/1999/xlink%27%20xml%3Aspace%3D%27preserve%27%20overflow%3D%27hidden%27%3E%3Cdefs%3E%3CclipPath%20id%3D%27clip0%27%3E%3Crect%20x%3D%271327%27%20y%3D%27365%27%20width%3D%271746%27%20height%3D%271745%27/%3E%3C/clipPath%3E%3C/defs%3E%3Cg%20clip-path%3D%27url(%2523clip0)%27%20transform%3D%27translate(-1327%20-365)%27%3E%3Cpath%20d%3D%27M2311.86%201126.81C2291.45%201126.1%202270.58%201128.5%202249.85%201134.37%202139.26%201165.66%202074.17%201283.56%202104.49%201397.72%202165.11%201626.04%202393.55%201760.4%202614.74%201697.83%202808.27%201643.07%202932.12%201455.68%202919.44%201256.73L2914.05%201223.69%202911.9%201230.96%202911.08%201256.02C2900.38%201338.81%202843.04%201411%202760.1%201434.47%202649.5%201465.76%202535.28%201398.58%202504.97%201284.42%202480.35%201191.66%202400.32%201129.92%202311.86%201126.81ZM2004.92%20762.177C1728%20772.703%201498.32%20998.253%201480.1%201289.86%201470.39%201445.38%201584.65%201579.59%201735.31%201589.62%201885.97%201599.65%202015.98%201481.7%202025.7%201326.18%202035.42%201170.66%202165.43%201052.71%202316.09%201062.74%202410.26%201069.01%202490.2%201123.78%202534.55%201201.96L2541.96%201215.66C2546.43%201224.15%202552.28%201237.53%202562.41%201252.11L2568.21%201259%202567.3%201248.26C2532.46%20988.233%202324.54%20780.535%202060.89%20762.983%202042.06%20761.729%202023.38%20761.475%202004.92%20762.177ZM1327%20365%203073%20365%203073%202110%201327%202110Z%27%20fill%3D%27%23161B22%27%20fill-rule%3D%27evenodd%27/%3E%3C/g%3E%3C/svg%3E" />

  <style>
    /* --- CSS Variables (v5.1.5 Design System) --- */
    :root {
      /* Dark Theme Base */
      --bg-dark: #050505;
      --glass-surface: rgba(20, 20, 25, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.04);
      
      /* Theme Colors */
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.3);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.25);
      
      /* Text */
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      
      /* Layout & Shape */
      --radius-md: 24px;
      --font-base: 'Pretendard', 'Google Sans Flex', 'Noto Sans KR', sans-serif;
      --font-logo: 'Cal Sans', sans-serif;
      
      color-scheme: dark;
    }

    html[data-theme="light"] {
      --bg-dark: #f2f4f7;
      --glass-surface: #ffffff;
      --glass-border: #e2e8f0;
      --glass-highlight: rgba(0, 0, 0, 0.03);
      --primary: #2563eb;
      --primary-glow: rgba(37, 99, 235, 0.15);
      --text-main: #1e293b;
      --text-sub: #64748b;
      color-scheme: light;
    }

    /* --- Base Styles --- */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    html, body {
      height: 100%; margin: 0; padding: 0;
      overflow: hidden; /* 스크롤 방지 */
      /* 입력창 외 텍스트 선택 및 터치 스크롤 방지 */
      user-select: none; -webkit-user-select: none;
      touch-action: none; 
    }

    body {
      font-family: var(--font-base);
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top left, rgba(20, 30, 40, 0.2), transparent 50%),
                  radial-gradient(circle at bottom right, rgba(20, 30, 40, 0.15), transparent 50%);
      transition: background 0.3s;
    }
    html[data-theme="light"] body { background: radial-gradient(circle at top left, rgba(0,0,0,0.02), transparent 50%); }

    /* --- Background Animation --- */
    .blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; filter: blur(90px); opacity: 0.4; }
    .blob { position: absolute; border-radius: 50%; animation: float 25s infinite ease-in-out alternate; }
    .b1 { top: 10%; left: 10%; width: 50vw; height: 50vw; background: rgba(59, 130, 246, 0.15); }
    .b2 { bottom: 10%; right: 10%; width: 60vw; height: 60vw; background: rgba(34, 211, 238, 0.1); animation-delay: -5s; }
    @keyframes float { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(20px, -20px) scale(1.05); } }

    /* --- Card Container --- */
    main {
      width: 100%; max-width: 420px; padding: 20px;
      position: relative; z-index: 10;
    }

    .glass-card {
      background: var(--glass-surface);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid transparent;
      background-image: linear-gradient(var(--glass-surface), var(--glass-surface)), 
                        linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.02));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      
      border-radius: var(--radius-md);
      box-shadow: 0 20px 50px -10px rgba(0,0,0,0.25);
      padding: 40px 32px;
      text-align: center;
      
      opacity: 0; transform: scale(0.9) translateY(20px);
      animation: cardEnter 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }
    html[data-theme="light"] .glass-card {
        background-image: linear-gradient(var(--glass-surface), var(--glass-surface)), 
                        linear-gradient(145deg, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }
    @keyframes cardEnter { 100% { opacity: 1; transform: scale(1) translateY(0); } }

    /* --- Animation Stagger --- */
    .stagger-item { opacity: 0; transform: translateY(10px); animation: contentFadeUp 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    @keyframes contentFadeUp { 100% { opacity: 1; transform: translateY(0); } }

    /* --- Icon & Text --- */
    .icon-wrapper {
      width: 68px; height: 68px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(59, 130, 246, 0.1); color: var(--primary);
      border-radius: 50%; border: 1px solid rgba(59, 130, 246, 0.2);
      position: relative;
    }
    /* Icon Pulse Animation */
    .icon-wrapper::after {
        content: ''; position: absolute; inset: -4px; border-radius: 50%;
        border: 1px solid var(--primary); opacity: 0.3;
        animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .icon-wrapper svg { width: 32px; height: 32px; filter: drop-shadow(0 0 8px var(--primary-glow)); }

    @keyframes pulseRing {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.4); opacity: 0; }
    }

    .admin-title {
      font-family: var(--font-logo);
      font-size: 32px; 
      font-weight: 400; /* Boldness reduced */
      color: var(--text-main); margin: 0 0 12px;
      letter-spacing: 0.5px;
    }
    
    .admin-desc {
      font-size: 16px; line-height: 1.6;
      color: var(--text-sub); margin: 0 0 32px;
      font-weight: 400; word-break: keep-all;
    }

    /* --- Form & Inputs --- */
    #access-form { display: flex; flex-direction: column; gap: 12px; }

    .input-group { position: relative; }
    .input-glass {
      width: 100%; height: 52px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      color: var(--text-main);
      font-family: var(--font-base); font-size: 16px; font-weight: 500;
      text-align: center; outline: none; padding: 0 20px;
      transition: all 0.2s;
      /* 입력창 내부는 텍스트 선택 및 입력 허용 */
      user-select: text; -webkit-user-select: text;
      touch-action: manipulation;
    }
    html[data-theme="light"] .input-glass { background: #f8fafc; border-color: #cbd5e1; color: #1e293b; }
    
    .input-glass::placeholder { color: var(--text-sub); opacity: 0.5; font-weight: 400; }
    .input-glass:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
      background: var(--glass-surface);
    }

    .error-message {
      font-size: 14px; color: var(--danger);
      font-weight: 500; min-height: 20px; margin: 4px 0 0;
      opacity: 0; transform: translateY(-5px); transition: all 0.2s;
    }
    .error-message.show { opacity: 1; transform: translateY(0); animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    
    @keyframes shake { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }

    /* Button Group */
    .button-group {
      display: flex; gap: 10px; margin-top: 8px;
    }

    .btn {
      flex: 1; height: 52px;
      border-radius: 16px;
      font-size: 16px; font-weight: 600;
      cursor: pointer; border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex; align-items: center; justify-content: center;
    }
    .btn:active { transform: scale(0.96); }

    .btn-submit {
      background: var(--primary); color: white;
      box-shadow: 0 4px 12px var(--primary-glow);
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--primary-glow); }

    .btn-back {
      background: rgba(255, 255, 255, 0.03); 
      color: var(--text-sub);
      border-color: var(--glass-border);
    }
    html[data-theme="light"] .btn-back { background: #f1f5f9; border-color: #cbd5e1; color: #64748b; }
    .btn-back:hover { 
      background: rgba(255, 255, 255, 0.08); color: var(--text-main);
      transform: translateY(-2px);
    }

    /* --- Loader Overlay --- */
    .loader-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(5, 5, 5, 0.7);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    html[data-theme="light"] .loader-overlay { background: rgba(255, 255, 255, 0.7); }
    .loader-overlay.show { opacity: 1; pointer-events: auto; }

    .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
      margin-bottom: 24px; box-shadow: 0 0 20px var(--primary-glow);
    }
    html[data-theme="light"] .spinner { border-color: rgba(0,0,0,0.1); }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .loader-text { font-size: 15px; font-weight: 600; color: var(--text-main); letter-spacing: 1px; text-transform: uppercase; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }

  </style>

  <script>
    (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>

<body>

  <div class="blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
  </div>

  <main>
    <div class="glass-card">
      <div class="icon-wrapper stagger-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="admin-title stagger-item delay-1">WebHub Admin</h1>
      <p class="admin-desc stagger-item delay-2">
        관리자 페이지 접속을 위해<br>비밀번호를 입력해주세요.
      </p>
      
      <form id="access-form" class="stagger-item delay-3">
        <div class="input-group">
          <input type="password" id="password-input" class="input-glass" placeholder="비밀번호 입력" autocomplete="current-password" inputmode="numeric">
        </div>
        <p id="error-message" class="error-message"></p>
        
        <div class="button-group">
          <button type="button" id="btn-back" class="btn btn-back">돌아가기</button>
          <button type="submit" class="btn btn-submit">관리자 접속</button>
        </div>
      </form>
    </div>
  </main>

  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <span class="loader-text">Authenticating...</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('access-form');
      const input = document.getElementById('password-input');
      const errorMsg = document.getElementById('error-message');
      const loader = document.getElementById('loader');
      const btnBack = document.getElementById('btn-back');
      
      const CORRECT_PASS = '2580';
      const ADMIN_URL = 'https://xn--220b31d95hq8o.xn--3e0b707e/';

      // Back Button Logic
      btnBack.addEventListener('click', () => {
        btnBack.style.transform = 'scale(0.95)';
        setTimeout(() => {
            window.location.href = '/'; 
        }, 150);
      });

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = input.value;

        if (val === CORRECT_PASS) {
          // Success: Show Loader & Redirect
          input.blur(); 
          errorMsg.classList.remove('show');
          loader.classList.add('show');
          
          setTimeout(() => {
            window.location.href = ADMIN_URL;
          }, 1500); 
        } else {
          // Fail: Shake Animation
          errorMsg.textContent = '비밀번호가 올바르지 않습니다.';
          errorMsg.classList.add('show');
          input.value = '';
          input.focus();
          
          // Re-trigger shake animation if already shown
          if(errorMsg.style.animation) {
             errorMsg.style.animation = 'none';
             requestAnimationFrame(() => errorMsg.style.animation = '');
          }
        }
      });

      input.addEventListener('input', () => {
        if (errorMsg.classList.contains('show')) {
          errorMsg.classList.remove('show');
        }
      });
    });
  </script>
</body>
