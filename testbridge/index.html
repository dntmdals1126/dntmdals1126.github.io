<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebHub - Warning</title>
  <meta name="theme-color" content="#050505" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20width%3D%271746%27%20height%3D%271745%27%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20xmlns%3Axlink%3D%27http%3A//www.w3.org/1999/xlink%27%20xml%3Aspace%3D%27preserve%27%20overflow%3D%27hidden%27%3E%3Cdefs%3E%3CclipPath%20id%3D%27clip0%27%3E%3Crect%20x%3D%271327%27%20y%3D%27365%27%20width%3D%271746%27%20height%3D%271745%27/%3E%3C/clipPath%3E%3C/defs%3E%3Cg%20clip-path%3D%27url(%2523clip0)%27%20transform%3D%27translate(-1327%20-365)%27%3E%3Cpath%20d%3D%27M2311.86%201126.81C2291.45%201126.1%202270.58%201128.5%202249.85%201134.37%202139.26%201165.66%202074.17%201283.56%202104.49%201397.72%202165.11%201626.04%202393.55%201760.4%202614.74%201697.83%202808.27%201643.07%202932.12%201455.68%202919.44%201256.73L2914.05%201223.69%202911.9%201230.96%202911.08%201256.02C2900.38%201338.81%202843.04%201411%202760.1%201434.47%202649.5%201465.76%202535.28%201398.58%202504.97%201284.42%202480.35%201191.66%202400.32%201129.92%202311.86%201126.81ZM2004.92%20762.177C1728%20772.703%201498.32%20998.253%201480.1%201289.86%201470.39%201445.38%201584.65%201579.59%201735.31%201589.62%201885.97%201599.65%202015.98%201481.7%202025.7%201326.18%202035.42%201170.66%202165.43%201052.71%202316.09%201062.74%202410.26%201069.01%202490.2%201123.78%202534.55%201201.96L2541.96%201215.66C2546.43%201224.15%202552.28%201237.53%202562.41%201252.11L2568.21%201259%202567.3%201248.26C2532.46%20988.233%202324.54%20780.535%202060.89%20762.983%202042.06%20761.729%202023.38%20761.475%202004.92%20762.177ZM1327%20365%203073%20365%203073%202110%201327%202110Z%27%20fill%3D%27%23161B22%27%20fill-rule%3D%27evenodd%27/%3E%3C/g%3E%3C/svg%3E" />

  <style>
    /* --- CSS Variables (v5.1.5 Design System) --- */
    :root {
      /* Dark Theme Base */
      --bg-dark: #050505;
      --glass-surface: rgba(20, 20, 25, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-highlight: rgba(255, 255, 255, 0.04);
      
      /* Theme Colors */
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.3);
      --danger: #ef4444;
      --danger-glow: rgba(239, 68, 68, 0.25);
      --warning: #f59e0b;
      --warning-glow: rgba(245, 158, 11, 0.2);
      
      /* Text */
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      
      /* Layout & Shape */
      --radius-md: 28px;
      --font-base: 'Pretendard', 'Google Sans Flex', 'Noto Sans KR', sans-serif;
      --font-logo: 'Cal Sans', sans-serif;
      
      color-scheme: dark;
    }

    html[data-theme="light"] {
      --bg-dark: #f2f4f7;
      --glass-surface: #ffffff;
      --glass-border: #e2e8f0;
      --glass-highlight: rgba(0, 0, 0, 0.03);
      --primary: #2563eb;
      --primary-glow: rgba(37, 99, 235, 0.15);
      --danger: #dc2626;
      --danger-glow: rgba(220, 38, 38, 0.15);
      --text-main: #1e293b;
      --text-sub: #64748b;
      color-scheme: light;
    }

    /* --- Base Styles --- */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
    
    html, body {
      height: 100%; margin: 0; padding: 0;
      overflow: hidden;
    }

    body {
      font-family: var(--font-base);
      background: var(--bg-dark);
      color: var(--text-main);
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at top left, rgba(20, 30, 40, 0.2), transparent 50%),
                  radial-gradient(circle at bottom right, rgba(20, 30, 40, 0.15), transparent 50%);
      transition: background 0.3s;
    }
    
    html[data-theme="light"] body {
      background: radial-gradient(circle at top left, rgba(0,0,0,0.02), transparent 50%);
    }

    /* --- Background Animation --- */
    .blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; filter: blur(90px); opacity: 0.4; }
    .blob { position: absolute; border-radius: 50%; animation: float 25s infinite ease-in-out alternate; }
    .b1 { top: 10%; left: 10%; width: 50vw; height: 50vw; background: rgba(59, 130, 246, 0.15); }
    .b2 { bottom: 10%; right: 10%; width: 60vw; height: 60vw; background: rgba(245, 158, 11, 0.1); animation-delay: -5s; }
    @keyframes float { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(20px, -20px) scale(1.05); } }

    /* --- Card Container --- */
    main {
      width: 100%; max-width: 440px; padding: 20px;
      position: relative; z-index: 10;
    }

    .glass-card {
      background: var(--glass-surface);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      /* Refined Glass Border with Light Reflection */
      border: 1px solid transparent;
      background-image: linear-gradient(var(--glass-surface), var(--glass-surface)), 
                        linear-gradient(145deg, rgba(255,255,255,0.15), rgba(255,255,255,0.02));
      background-origin: border-box;
      background-clip: padding-box, border-box;
      
      border-radius: var(--radius-md);
      box-shadow: 0 20px 50px -10px rgba(0,0,0,0.25);
      padding: 40px 32px;
      text-align: center;
      /* Card Entry Animation */
      opacity: 0; transform: scale(0.9) translateY(20px);
      animation: cardEnter 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }
    html[data-theme="light"] .glass-card {
        background-image: linear-gradient(var(--glass-surface), var(--glass-surface)), 
                        linear-gradient(145deg, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
        box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    }

    @keyframes cardEnter {
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* --- Staggered Content Animation --- */
    .stagger-item {
        opacity: 0; transform: translateY(10px);
        animation: contentFadeUp 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }

    @keyframes contentFadeUp {
        100% { opacity: 1; transform: translateY(0); }
    }

    /* --- Typography & Icon --- */
    .icon-wrapper {
      width: 72px; height: 72px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(245, 158, 11, 0.1); color: var(--warning);
      border-radius: 50%; border: 1px solid rgba(245, 158, 11, 0.2);
      position: relative;
    }
    .icon-wrapper::after {
        content: ''; position: absolute; inset: -4px; border-radius: 50%;
        border: 1px solid var(--warning); opacity: 0.3;
        animation: pulseRing 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .icon-wrapper svg { width: 36px; height: 36px; filter: drop-shadow(0 0 8px var(--warning-glow)); }

    @keyframes pulseRing {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.4); opacity: 0; }
    }

    .warning-title {
      font-family: var(--font-logo);
      font-size: 36px; font-weight: 800;
      margin: 0 0 16px;
      /* Gradient Text */
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    
    .warning-text {
      font-size: 16px; line-height: 1.6;
      color: var(--text-sub); margin: 0 0 36px;
      font-weight: 400; word-break: keep-all;
    }
    .warning-text b { color: var(--text-main); font-weight: 600; }

    /* --- Buttons --- */
    .button-group {
      display: flex; gap: 14px;
      justify-content: center;
    }
    
    .btn {
      flex: 1; height: 54px;
      border-radius: 18px;
      font-size: 16px; font-weight: 700;
      cursor: pointer; border: 1px solid transparent;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    
    .btn:active { transform: scale(0.96); }

    .btn-yes {
      background: var(--primary); color: white;
      box-shadow: 0 8px 20px -4px var(--primary-glow);
    }
    .btn-yes::before {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
        opacity: 0.3;
    }
    .btn-yes:hover { transform: translateY(-3px); box-shadow: 0 12px 24px -4px var(--primary-glow); }

    .btn-no {
      background: rgba(255,255,255,0.03); 
      color: var(--text-sub);
      border-color: var(--glass-border);
    }
    html[data-theme="light"] .btn-no { background: #f1f5f9; border-color: #cbd5e1; }
    .btn-no:hover { 
      background: rgba(255,255,255,0.08); color: var(--text-main);
      transform: translateY(-3px);
    }

    /* --- Loader Overlay --- */
    .loader-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: rgba(5, 5, 5, 0.7);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.4s ease;
    }
    html[data-theme="light"] .loader-overlay { background: rgba(255, 255, 255, 0.7); }
    
    .loader-overlay.show { opacity: 1; pointer-events: auto; }

    .spinner {
      width: 50px; height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--primary);
      border-right-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
      margin-bottom: 24px;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    html[data-theme="light"] .spinner { border-color: rgba(0,0,0,0.1); }
    
    .loader-text {
      font-size: 15px; font-weight: 500; color: var(--text-main);
      opacity: 0.8; letter-spacing: 1px; text-transform: uppercase;
      animation: pulseText 1.5s infinite alternate;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulseText { from { opacity: 0.5; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

  </style>

  <script>
    (function() {
        const saved = localStorage.getItem('theme');
        if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>

<body>

  <div class="blobs">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
  </div>

  <main>
    <div class="glass-card">
      <div class="icon-wrapper stagger-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>
      <h1 class="warning-title stagger-item delay-1">WARNING</h1>
      <p class="warning-text stagger-item delay-2">
        이곳은 <b>코드 테스트용 페이지</b>입니다.<br>
        <br>
        기능이 정상적으로 작동하지 않거나<br>
        예상치 못한 오류가 발생할 수 있습니다.<br>
        <br>
        <b>그래도 접속하시겠습니까?</b>
      </p>
      
      <div class="button-group stagger-item delay-3">
        <button id="btn-no" class="btn btn-no">아니오</button>
        <button id="btn-yes" class="btn btn-yes">예, 접속합니다</button>
      </div>
    </div>
  </main>

  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <span class="loader-text">Loading...</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnYes = document.getElementById('btn-yes');
      const btnNo = document.getElementById('btn-no');
      const loader = document.getElementById('loader');

      // 아니오: 메인으로 이동
      btnNo.addEventListener('click', () => {
        // 버튼 클릭 피드백 후 이동
        btnNo.style.transform = 'scale(0.95)';
        setTimeout(() => {
            window.location.href = '/'; 
        }, 200);
      });

      // 예: 테스트 페이지로 이동 (로더 표시)
      btnYes.addEventListener('click', () => {
        loader.classList.add('show');
        setTimeout(() => {
          window.location.href = '/test/';
        }, 2500); // 로더 애니메이션 감상용 딜레이
      });
    });
  </script>
</body>
</html>
