<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도전! 골든벨 퀴즈</title>
  
  <!-- 꼬리바람(Tailwind CSS) CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 루시드 아이콘(Lucide Icons) CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- 프리텐다드(Pretendard) 폰트 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    }
    
    @keyframes popUp {
      0% { opacity: 0; transform: scale(0.95) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .animate-popUp { animation: popUp 0.3s cubic-bezier(0.16,1,0.3,1) forwards; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-float-delayed { animation: float 3s ease-in-out infinite 0.5s; }
  </style>
</head>
<body class="min-h-screen bg-[#0f172a] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-indigo-900 via-[#0f172a] to-black text-white flex flex-col selection:bg-pink-500 selection:text-white">

  <!-- 헤더 영역 -->
  <header class="bg-white/5 backdrop-blur-md p-5 px-8 shadow-2xl flex justify-between items-center border-b border-white/10 z-10 sticky top-0" id="header-container"></header>

  <main class="flex-1 p-6 lg:p-8 flex flex-col lg:flex-row gap-8 max-w-[1600px] mx-auto w-full">
    <!-- 왼쪽 퀴즈 보드 -->
    <section class="flex-[3] bg-white/5 backdrop-blur-sm rounded-[2rem] p-6 lg:p-8 shadow-2xl border border-white/10 flex flex-col">
      <div class="grid grid-cols-5 gap-4 lg:gap-5 h-full" id="board-container"></div>
    </section>

    <!-- 오른쪽 스코어 보드 -->
    <section class="flex-[1] bg-white/5 backdrop-blur-sm rounded-[2rem] p-6 lg:p-8 shadow-2xl border border-white/10 flex flex-col min-w-[320px]">
      <h2 class="text-2xl font-black text-center mb-8 flex items-center justify-center gap-3 text-white tracking-wider">
        <i data-lucide="trophy" class="text-yellow-400 w-7 h-7"></i> 팀별 스코어
      </h2>
      <div class="flex-1 flex flex-col gap-4" id="scoreboard-container"></div>
    </section>
  </main>

  <!-- 모달 창 영역 -->
  <div id="modal-container"></div>

  <!-- 자바스크립트 로직 -->
  <script>
    // 상태 (State) 데이터 정의
    const categories = ['문법', '단어', '독해', '기타'];
    const rows = [30, 20, 10];

    const state = {
      teams: [
        { id: 1, name: '1팀', score: 0 },
        { id: 2, name: '2팀', score: 0 },
        { id: 3, name: '3팀', score: 0 },
        { id: 4, name: '4팀', score: 0 },
        { id: 5, name: '5팀', score: 0 },
      ],
      questions: [
        { id: 'A', category: '문법', points: 30, question: '문법 30점 (A) - 문제를 여기에 입력하세요.', answer: '정답 A', isAnswered: false },
        { id: 'D', category: '단어', points: 30, question: '단어 30점 (D) - 문제를 여기에 입력하세요.', answer: '정답 D', isAnswered: false },
        { id: 'G', category: '독해', points: 30, question: '독해 30점 (G) - 문제를 여기에 입력하세요.', answer: '정답 G', isAnswered: false },
        { id: 'K', category: '기타', points: 30, question: '기타 30점 (K) - 문제를 여기에 입력하세요.', answer: '정답 K', isAnswered: false },
        
        { id: 'B', category: '문법', points: 20, question: '문법 20점 (B) - 문제를 여기에 입력하세요.', answer: '정답 B', isAnswered: false },
        { id: 'E', category: '단어', points: 20, question: '단어 20점 (E) - 문제를 여기에 입력하세요.', answer: '정답 E', isAnswered: false },
        { id: 'H', category: '독해', points: 20, question: '독해 20점 (H) - 문제를 여기에 입력하세요.', answer: '정답 H', isAnswered: false },
        { id: 'L', category: '기타', points: 20, question: '기타 20점 (L) - 문제를 여기에 입력하세요.', answer: '정답 L', isAnswered: false },
        
        { id: 'C', category: '문법', points: 10, question: '문법 10점 (C) - 문제를 여기에 입력하세요.', answer: '정답 C', isAnswered: false },
        { id: 'F', category: '단어', points: 10, question: '단어 10점 (F) - 문제를 여기에 입력하세요.', answer: '정답 F', isAnswered: false },
        { id: 'J', category: '독해', points: 10, question: '독해 10점 (J) - 문제를 여기에 입력하세요.', answer: '정답 J', isAnswered: false },
        { id: 'M', category: '기타', points: 10, question: '기타 10점 (M) - 문제를 여기에 입력하세요.', answer: '정답 M', isAnswered: false },
      ],
      mysteryCards: [
        { id: 1, title: '점수 스틸러!', desc: '원하는 팀의 점수 20점을 우리 팀으로 가져옵니다.', type: 'good' },
        { id: 2, title: '천사 강림', desc: '우리 팀을 제외한 모든 팀에게 10점씩 선물합니다.', type: 'neutral' },
        { id: 3, title: '더블 찬스', desc: '다음 문제의 점수가 2배가 됩니다! (맞춘 경우 선생님이 수동으로 점수 추가)', type: 'good' },
        { id: 4, title: '침묵의 시간', desc: '지정한 한 팀은 다음 문제의 정답을 외칠 수 없습니다.', type: 'bad' },
        { id: 5, title: '행운의 여신', desc: '문제 풀이 없이, 우리 팀 점수 무조건 +30점!', type: 'good' },
        { id: 6, title: '앗, 실수!', desc: '안타깝게도 우리 팀 점수 -10점 감점.', type: 'bad' },
      ],
      availableCards: [],
      isEditMode: false,
      selectedQuestion: null,
      showAnswer: false,
      drawnCard: null
    };
    
    // 카드 초기화
    state.availableCards = [...state.mysteryCards];

    // 유틸리티: HTML 특수문자 이스케이프
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // --- 액션(Actions) ---

    function toggleEditMode() {
      state.isEditMode = !state.isEditMode;
      renderApp();
    }

    function updateScore(teamId, amount) {
      const team = state.teams.find(t => t.id === teamId);
      if (team) {
        team.score += amount;
      }
      renderScoreboard();
    }

    function updateTeamName(teamId, newName) {
      const team = state.teams.find(t => t.id === teamId);
      if (team) {
        team.name = newName;
      }
    }

    function handleQuestionClick(qId) {
      const q = state.questions.find(q => q.id === qId);
      if (q.isAnswered && !state.isEditMode) return;
      
      state.selectedQuestion = q;
      state.showAnswer = false;
      renderModals();
    }

    function handleCorrectAnswer(teamId) {
      if (state.selectedQuestion) {
        updateScore(teamId, state.selectedQuestion.points);
        state.selectedQuestion.isAnswered = true;
        state.selectedQuestion = null;
        renderBoard();
        renderModals();
      }
    }

    function handlePassQuestion() {
      if (state.selectedQuestion) {
        state.selectedQuestion.isAnswered = true;
        state.selectedQuestion = null;
        renderBoard();
        renderModals();
      }
    }

    function updateQuestionField(id, field, value) {
      const q = state.questions.find(q => q.id === id);
      if (q) {
        q[field] = value;
      }
    }

    function closeQuestionModal() {
      state.selectedQuestion = null;
      renderBoard(); // 수정한 내용이 있을 수 있으니 보드 리렌더링
      renderModals();
    }

    function revealAnswer() {
      state.showAnswer = true;
      renderModals();
    }

    function drawMysteryCard() {
      if (state.availableCards.length === 0) {
        alert("모든 미스터리 카드를 소진했습니다!");
        return;
      }
      const randomIndex = Math.floor(Math.random() * state.availableCards.length);
      state.drawnCard = state.availableCards[randomIndex];
      state.availableCards.splice(randomIndex, 1);
      
      renderHeader();
      renderModals();
    }

    function closeMysteryCard() {
      state.drawnCard = null;
      renderModals();
    }

    // --- 렌더링(Rendering) 함수 ---

    function renderHeader() {
      const headerContainer = document.getElementById('header-container');
      headerContainer.innerHTML = `
        <h1 class="text-3xl lg:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-amber-400 tracking-tight flex items-center gap-3">
          <i data-lucide="star" class="text-yellow-400 fill-yellow-400 animate-float"></i>
          도전! 골든벨 퀴즈
          <i data-lucide="star" class="text-yellow-400 fill-yellow-400 animate-float-delayed"></i>
        </h1>
        <div class="flex gap-4">
          <button onclick="drawMysteryCard()" class="flex items-center gap-2 bg-gradient-to-r from-pink-600 to-purple-600 hover:from-pink-500 hover:to-purple-500 text-white px-5 py-2.5 rounded-full font-bold shadow-[0_4px_0_rgb(157,23,77)] active:shadow-[0_0px_0_rgb(157,23,77)] active:translate-y-1 transition-all border border-pink-400/30">
            <i data-lucide="wand-2" class="w-5 h-5"></i>
            미스터리 카드 뽑기 (${state.availableCards.length}/6)
          </button>
          <button onclick="toggleEditMode()" class="flex items-center gap-2 px-5 py-2.5 rounded-full font-bold shadow-[0_4px_0_rgba(0,0,0,0.3)] active:shadow-[0_0px_0_rgba(0,0,0,0.3)] active:translate-y-1 transition-all border border-white/10 ${state.isEditMode ? 'bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-400 hover:to-green-500' : 'bg-white/10 hover:bg-white/20 backdrop-blur-md'}">
            <i data-lucide="${state.isEditMode ? 'play' : 'edit'}" class="w-5 h-5"></i>
            ${state.isEditMode ? '게임 모드로 전환' : '문제 출제 모드'}
          </button>
        </div>
      `;
      lucide.createIcons();
    }

    function renderBoard() {
      const boardContainer = document.getElementById('board-container');
      let html = `
        <div class="bg-white/5 rounded-2xl flex items-center justify-center font-bold text-slate-400 backdrop-blur-sm border border-white/5">
          점수 \\ 과목
        </div>
      `;
      
      // 카테고리 헤더
      categories.forEach(cat => {
        html += `<div class="bg-gradient-to-b from-blue-500/20 to-indigo-600/20 rounded-2xl flex items-center justify-center text-2xl font-black text-blue-300 border border-blue-500/30 shadow-inner">${cat}</div>`;
      });

      // 점수별 행 렌더링
      rows.forEach(rowPoint => {
        // 왼쪽 점수 셀
        html += `<div class="bg-gradient-to-b from-pink-500/20 to-rose-600/20 rounded-2xl flex items-center justify-center text-3xl font-black text-pink-300 border border-pink-500/30 shadow-inner">${rowPoint}</div>`;
        
        categories.forEach(cat => {
          const q = state.questions.find(q => q.points === rowPoint && q.category === cat);
          if (!q) {
            html += `<div></div>`;
            return;
          }

          const isAnswered = q.isAnswered && !state.isEditMode;
          const buttonClass = isAnswered 
            ? 'bg-slate-800/40 text-slate-600 border border-white/5 shadow-none opacity-60 cursor-not-allowed'
            : 'bg-gradient-to-b from-amber-300 to-orange-500 text-orange-950 hover:from-amber-200 hover:to-orange-400 shadow-[0_8px_0_#9a3412] active:shadow-[0_0px_0_#9a3412] active:translate-y-2 border border-white/20 cursor-pointer';

          html += `
            <button onclick="handleQuestionClick('${q.id}')" ${isAnswered ? 'disabled' : ''} class="relative w-full aspect-[4/3] rounded-2xl flex flex-col items-center justify-center text-4xl md:text-5xl font-black transition-all duration-200 transform group ${buttonClass}">
              <span class="drop-shadow-sm">${q.id}</span>
              ${state.isEditMode ? '<span class="absolute bottom-3 text-xs font-bold mt-2 bg-black/40 text-white px-3 py-1.5 rounded-full tracking-wider">수정하기</span>' : ''}
            </button>
          `;
        });
      });

      boardContainer.innerHTML = html;
    }

    function renderScoreboard() {
      const scoreboardContainer = document.getElementById('scoreboard-container');
      const maxScore = state.teams.length > 0 ? Math.max(...state.teams.map(t => t.score)) : 0;
      const hasPositiveScore = maxScore > 0;

      let html = '';
      state.teams.forEach((team, index) => {
        const isFirst = hasPositiveScore && team.score === maxScore;
        const containerClass = isFirst 
          ? 'bg-gradient-to-br from-indigo-500/40 to-purple-600/40 border-indigo-400/50 shadow-[0_0_20px_rgba(99,102,241,0.2)]'
          : 'bg-white/5 hover:bg-white/10 border-white/10';
        const scoreClass = isFirst ? 'text-yellow-300 drop-shadow-[0_2px_10px_rgba(253,224,71,0.4)]' : 'text-slate-200';

        html += `
          <div class="transition-all p-5 rounded-2xl border flex flex-col gap-3 relative overflow-hidden group ${containerClass}">
            <div class="flex justify-between items-center z-10">
              <div class="flex items-center gap-3 w-1/2">
                <span class="text-slate-400 font-black text-lg w-6">${index + 1}</span>
                <input type="text" value="${escapeHtml(team.name)}" onchange="updateTeamName(${team.id}, this.value)" class="bg-transparent text-xl font-bold w-full outline-none border-b border-transparent focus:border-indigo-400 transition-colors" />
              </div>
              <div class="text-4xl font-black ${scoreClass}">${team.score}</div>
            </div>
            <div class="flex justify-end gap-2 mt-1 z-10 opacity-50 group-hover:opacity-100 transition-opacity">
               <button onclick="updateScore(${team.id}, -10)" class="bg-red-500/20 hover:bg-red-500/40 text-red-300 p-1.5 rounded-lg backdrop-blur-sm transition-colors"><i data-lucide="minus" class="w-4 h-4"></i></button>
               <button onclick="updateScore(${team.id}, 10)" class="bg-green-500/20 hover:bg-green-500/40 text-green-300 p-1.5 rounded-lg backdrop-blur-sm transition-colors"><i data-lucide="plus" class="w-4 h-4"></i></button>
            </div>
            ${isFirst ? `
              <div class="absolute -right-4 -top-4 text-yellow-400/10 z-0 rotate-12">
                 <i data-lucide="trophy" style="width: 100px; height: 100px;"></i>
              </div>
            ` : ''}
          </div>
        `;
      });
      
      scoreboardContainer.innerHTML = html;
      lucide.createIcons();
    }

    function renderModals() {
      const modalContainer = document.getElementById('modal-container');
      let html = '';

      // 문제 확인/수정 모달
      if (state.selectedQuestion) {
        const q = state.selectedQuestion;
        
        let contentHtml = '';
        if (state.isEditMode) {
          contentHtml = `
            <div class="flex flex-col gap-6 mb-4">
              <div>
                <label class="block text-slate-600 font-bold mb-3 text-lg">질문 (Q)</label>
                <textarea onchange="updateQuestionField('${q.id}', 'question', this.value)" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-5 text-xl font-medium focus:border-indigo-500 focus:bg-white outline-none transition-all resize-none shadow-inner" rows="4">${escapeHtml(q.question)}</textarea>
              </div>
              <div>
                <label class="block text-slate-600 font-bold mb-3 text-lg">정답 (A)</label>
                <input type="text" onchange="updateQuestionField('${q.id}', 'answer', this.value)" value="${escapeHtml(q.answer)}" class="w-full bg-slate-50 border-2 border-slate-200 rounded-2xl p-5 text-xl font-medium focus:border-indigo-500 focus:bg-white outline-none transition-all shadow-inner" />
              </div>
              <button onclick="closeQuestionModal()" class="mt-6 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold py-5 rounded-2xl text-xl hover:from-emerald-400 hover:to-teal-500 shadow-lg transition-all active:scale-[0.98]">수정 완료</button>
            </div>
          `;
        } else {
          // 게임 모드 뷰
          const answerArea = state.showAnswer 
            ? `<div class="bg-gradient-to-br from-green-50 to-emerald-100 border-4 border-emerald-400 text-emerald-900 rounded-3xl p-8 text-center text-4xl font-black shadow-lg animate-popUp">정답: ${escapeHtml(q.answer)}</div>`
            : `<button onclick="revealAnswer()" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-black py-6 rounded-3xl text-2xl flex items-center justify-center gap-3 transition-colors border-2 border-slate-200 shadow-sm active:scale-[0.98]"><i data-lucide="help-circle" class="w-8 h-8 text-slate-500"></i> 정답 확인하기</button>`;

          let teamsButtonsHtml = '';
          state.teams.forEach(team => {
            teamsButtonsHtml += `
              <button onclick="handleCorrectAnswer(${team.id})" class="bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-400 text-slate-700 hover:text-indigo-700 font-bold py-4 rounded-2xl transition-all flex flex-col items-center shadow-sm active:scale-[0.95]">
                <span class="text-lg">${escapeHtml(team.name)}</span>
                <span class="text-sm text-indigo-500 mt-1 font-black">+${q.points}</span>
              </button>
            `;
          });

          contentHtml = `
            <div class="flex flex-col items-center flex-1">
              <div class="text-4xl md:text-5xl font-black text-center leading-tight min-h-[180px] flex items-center justify-center break-keep w-full whitespace-pre-wrap px-4 text-slate-800">${escapeHtml(q.question)}</div>
              
              <div class="w-full max-w-2xl mt-12 mb-10">
                ${answerArea}
              </div>

              <div class="w-full bg-slate-50 rounded-3xl p-6 border border-slate-100 mt-auto">
                <p class="text-center font-bold text-slate-400 mb-5">정답을 맞춘 팀을 선택하세요 (선택 시 자동으로 점수가 올라갑니다)</p>
                <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                  ${teamsButtonsHtml}
                </div>
                <button onclick="handlePassQuestion()" class="w-full mt-4 bg-transparent hover:bg-slate-200 text-slate-500 font-bold py-4 rounded-2xl transition-colors">
                  아무도 못맞춤 (문제 닫기)
                </button>
              </div>
            </div>
          `;
        }

        html += `
          <div class="fixed inset-0 bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-6 z-50">
            <div class="bg-white text-slate-800 w-full max-w-4xl rounded-[2.5rem] p-10 md:p-14 flex flex-col relative shadow-[0_0_50px_-12px_rgba(0,0,0,0.5)] animate-popUp">
              <button onclick="closeQuestionModal()" class="absolute top-8 right-8 text-slate-400 hover:text-slate-800 transition-colors bg-slate-100 hover:bg-slate-200 p-2 rounded-full">
                <i data-lucide="x" class="w-7 h-7"></i>
              </button>
              <div class="text-center mb-10">
                <span class="bg-gradient-to-r from-blue-100 to-indigo-100 text-indigo-800 px-6 py-2 rounded-full font-bold text-lg inline-flex items-center gap-2 shadow-sm border border-indigo-200">
                  <span class="w-2 h-2 rounded-full bg-indigo-500"></span>
                  ${q.category} · ${q.points}점
                </span>
              </div>
              ${contentHtml}
            </div>
          </div>
        `;
      }

      // 미스터리 카드 모달
      if (state.drawnCard) {
        const card = state.drawnCard;
        let cardBg = '';
        let buttonBg = '';
        
        if (card.type === 'good') {
          cardBg = 'from-yellow-300 via-amber-400 to-orange-500';
          buttonBg = 'bg-gradient-to-r from-orange-400 to-amber-500 hover:from-orange-500 hover:to-amber-600 shadow-orange-500/30';
        } else if (card.type === 'bad') {
          cardBg = 'from-red-400 via-rose-500 to-pink-600';
          buttonBg = 'bg-gradient-to-r from-rose-500 to-red-600 hover:from-rose-600 hover:to-red-700 shadow-rose-500/30';
        } else {
          cardBg = 'from-blue-300 via-indigo-400 to-violet-500';
          buttonBg = 'bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 shadow-indigo-500/30';
        }

        html += `
          <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-6 z-[60]">
            <div class="bg-gradient-to-br ${cardBg} w-full max-w-md rounded-[2.5rem] p-1.5 shadow-[0_0_60px_-15px_rgba(255,255,255,0.3)] animate-popUp">
              <div class="bg-white rounded-[2.2rem] p-10 flex flex-col items-center text-center relative h-full">
                <div class="text-7xl mb-6 animate-float">🃏</div>
                <h3 class="text-sm font-black text-slate-400 mb-3 tracking-widest uppercase">Mystery Card</h3>
                <h2 class="text-4xl font-black text-slate-800 mb-6 break-keep">${escapeHtml(card.title)}</h2>
                <div class="w-12 h-1.5 rounded-full bg-slate-200 mb-6"></div>
                <p class="text-2xl text-slate-600 font-bold leading-snug mb-10 break-keep">${escapeHtml(card.desc)}</p>
                <p class="text-sm text-slate-400 mt-auto mb-8 bg-slate-50 p-4 rounded-xl border border-slate-100">
                  점수 적용은 우측 스코어보드의 <br/><span class="font-bold text-slate-600">+ - 버튼</span>으로 직접 조절해주세요!
                </p>
                <button onclick="closeMysteryCard()" class="w-full text-white font-black py-5 rounded-2xl text-xl transition-all shadow-lg active:scale-[0.98] ${buttonBg}">
                  확인
                </button>
              </div>
            </div>
          </div>
        `;
      }

      modalContainer.innerHTML = html;
      
      // 모달 내 아이콘 렌더링
      lucide.createIcons();
    }

    // 초기 렌더링
    function renderApp() {
      renderHeader();
      renderBoard();
      renderScoreboard();
      renderModals();
    }

    // 앱 시작
    renderApp();
  </script>
</body>
</html>
