<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제주 버스 시간표 검색</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- Favicon (WebHub) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20width%3D%271746%27%20height%3D%271745%27%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20xmlns%3Axlink%3D%27http%3A//www.w3.org/1999/xlink%27%20xml%3Aspace%3D%27preserve%27%20overflow%3D%27hidden%27%3E%3Cdefs%3E%3CclipPath%20id%3D%27clip0%27%3E%3Crect%20x%3D%271327%27%20y%3D%27365%27%20width%3D%271746%27%20height%3D%271745%27/%3E%3C/clipPath%3E%3C/defs%3E%3Cg%20clip-path%3D%27url(%2523clip0)%27%20transform%3D%27translate(-1327%20-365)%27%3E%3Cpath%20d%3D%27M2311.86%201126.81C2291.45%201126.1%202270.58%201128.5%202249.85%201134.37%202139.26%201165.66%202074.17%201283.56%202104.49%201397.72%202165.11%201626.04%202393.55%201760.4%202614.74%201697.83%202808.27%201643.07%202932.12%201455.68%202919.44%201256.73L2914.05%201223.69%202911.9%201230.96%202911.08%201256.02C2900.38%201338.81%202843.04%201411%202760.1%201434.47%202649.5%201465.76%202535.28%201398.58%202504.97%201284.42%202480.35%201191.66%202400.32%201129.92%202311.86%201126.81ZM2004.92%20762.177C1728%20772.703%201498.32%20998.253%201480.1%201289.86%201470.39%201445.38%201584.65%201579.59%201735.31%201589.62%201885.97%201599.65%202015.98%201481.7%202025.7%201326.18%202035.42%201170.66%202165.43%201052.71%202316.09%201062.74%202410.26%201069.01%202490.2%201123.78%202534.55%201201.96L2541.96%201215.66C2546.43%201224.15%202552.28%201237.53%202562.41%201252.11L2568.21%201259%202567.3%201248.26C2532.46%20988.233%202324.54%20780.535%202060.89%20762.983%202042.06%20761.729%202023.38%20761.475%202004.92%20762.177ZM1327%20365%203073%20365%203073%202110%201327%202110Z%27%20fill%3D%27%23161B22%27%20fill-rule%3D%27evenodd%27/%3E%3C/g%3E%3C/svg%3E" />
    
    <style>
        :root {
            /* Shared Variables */
            --primary-orange: #ff7f00; 
            --primary-glow: rgba(255, 127, 0, 0.4);
            --font-base: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            --font-logo: 'Cal Sans', sans-serif;

            /* Dark Theme (Default) */
            --bg-color: #050505;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --surface-color: rgba(20, 20, 25, 0.8);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow: rgba(0, 0, 0, 0.3);
            --home-btn-bg: rgba(20, 20, 25, 0.8);
            --home-btn-hover: rgba(255, 127, 0, 0.1);
            --blob-opacity: 0.5;
            --result-bg: #fff; /* Iframe usually needs white bg context */
            --loader-border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            /* Light Theme Overrides */
            --bg-color: #f9fafb;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --surface-color: rgba(255, 255, 255, 0.8);
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: rgba(0, 0, 0, 0.05);
            --home-btn-bg: #ffffff;
            --home-btn-hover: rgba(255, 127, 0, 0.05);
            --blob-opacity: 0.6;
            --loader-border: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-base);
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh; 
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; 
            transition: background-color 0.3s, color 0.3s;
            
            /* Prevent scrolling and text selection on body */
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- Background Animation --- */
        .blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: var(--blob-opacity); transition: opacity 0.3s; }
        .blob { position: absolute; border-radius: 50%; filter: blur(80px); animation: float 20s infinite ease-in-out alternate; }
        .b1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(255, 127, 0, 0.15); }
        .b2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: rgba(59, 130, 246, 0.1); animation-delay: -5s; }
        @keyframes float { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(20px, -20px) scale(1.1); } }

        /* --- Top Buttons (Home & Theme) --- */
        .top-btn {
            position: absolute;
            top: 15px;
            padding: 8px;
            background: var(--home-btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 99px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px var(--shadow);
            transition: all 0.2s;
            z-index: 10;
            backdrop-filter: blur(8px);
            cursor: pointer;
        }
        .top-btn:hover {
            color: var(--primary-orange);
            border-color: var(--primary-orange);
            transform: translateY(-2px);
            background: var(--home-btn-hover);
        }
        
        .home-btn { left: 15px; padding: 6px 14px; }
        .theme-btn { right: 15px; width: 36px; height: 36px; }

        /* --- Main Container --- */
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 60px 20px 20px;
            flex: 0 0 auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            transition: padding 0.3s;
        }
        
        .container.compact {
            padding-top: 50px;
            padding-bottom: 15px;
        }

        /* --- Header --- */
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin: 0;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }
        
        .powered-by {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 6px;
            opacity: 0.8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .brand-logo {
            font-family: var(--font-logo);
            font-weight: 400;
            color: var(--text-main);
        }

        /* --- Search Bar Style --- */
        .search-wrapper {
            width: 100%;
            max-width: 500px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 5px;
            box-shadow: 0 5px 20px -5px var(--shadow);
            display: flex;
            gap: 6px;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            backdrop-filter: blur(12px);
        }
        .search-wrapper:focus-within {
            border-color: var(--primary-orange);
            box-shadow: 0 8px 25px -5px var(--primary-glow);
            transform: translateY(-1px);
        }

        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0 14px;
            font-size: 16px;
            color: var(--text-main);
            font-family: var(--font-base);
            height: 44px;
            min-width: 0;
            /* Allow selection in input */
            user-select: text;
            -webkit-user-select: text;
        }
        input[type="text"]::placeholder { color: var(--text-sub); opacity: 0.7; }

        button {
            height: 44px;
            padding: 0 20px;
            border-radius: 10px;
            border: none;
            background: var(--primary-orange);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: var(--font-base);
        }
        button:hover {
            filter: brightness(1.1);
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        button:active { transform: scale(0.96); }

        /* --- Result Area --- */
        .result-container {
            width: 100%;
            flex: 1; 
            background: var(--result-bg);
            border-top: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            
            flex-grow: 0; 
            height: 0;
            opacity: 0;
            transition: flex-grow 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s;
        }
        
        .result-container.active {
            flex-grow: 1;
            height: auto;
            opacity: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* --- Loader --- */
        .loader {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 40px; height: 40px;
            border: 4px solid var(--loader-border);
            border-top-color: var(--primary-orange);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
            z-index: 5;
        }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

        /* --- Mobile Optimization --- */
        @media (max-width: 600px) {
            .container { padding-top: 60px; padding-bottom: 15px; }
            h1 { font-size: 22px; }
            .search-wrapper { border-radius: 12px; }
            button { padding: 0 14px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- Subtle Background Blobs -->
    <div class="blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <!-- Return to Main Button -->
    <a href="https://www.v1ctorym1n.kro.kr" class="top-btn home-btn">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        메인으로
    </a>

    <!-- Theme Toggle Button -->
    <button class="top-btn theme-btn" id="themeToggle" title="테마 변경">
        <!-- Sun Icon -->
        <svg id="iconSun" style="display:none" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
        </svg>
        <!-- Moon Icon -->
        <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79Z"></path>
        </svg>
    </button>

    <div class="container" id="searchContainer">
        <header>
            <h1>제주 버스 시간표 검색</h1>
            <div class="powered-by">
                powered by <span class="brand-logo">WebHub</span>
            </div>
        </header>

        <div class="search-wrapper">
            <input type="text" id="busNumber" placeholder="버스 번호 (예: 360, 201)" autocomplete="off" inputmode="numeric">
            <button id="searchBtn">검색</button>
        </div>
    </div>

    <!-- Result Container -->
    <div class="result-container" id="resultContainer">
        <div class="loader" id="loader"></div>
        <iframe id="busFrame" name="busFrame"></iframe>
    </div>

    <script>
        const busInput = document.getElementById('busNumber');
        const searchBtn = document.getElementById('searchBtn');
        const resultContainer = document.getElementById('resultContainer');
        const busFrame = document.getElementById('busFrame');
        const loader = document.getElementById('loader');
        const searchContainer = document.getElementById('searchContainer');
        
        // Theme Logic
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const iconMoon = document.getElementById('iconMoon');
        const iconSun = document.getElementById('iconSun');

        // Check Local Storage or Default to Dark
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'light') {
                iconSun.style.display = 'block';
                iconMoon.style.display = 'none';
            } else {
                iconSun.style.display = 'none';
                iconMoon.style.display = 'block';
            }
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(nextTheme);
        });

        function searchBus() {
            let busNumber = busInput.value.trim();
            
            if (busNumber === '') {
                const wrapper = document.querySelector('.search-wrapper');
                wrapper.style.transform = 'translateX(5px)';
                setTimeout(() => wrapper.style.transform = 'translateX(-5px)', 50);
                setTimeout(() => wrapper.style.transform = 'translateX(5px)', 100);
                setTimeout(() => wrapper.style.transform = 'none', 150);
                busInput.focus();
                return;
            }

            busNumber = busNumber.replace(/[^0-9]/g, '');
            
            searchContainer.classList.add('compact');
            resultContainer.classList.add('active');
            loader.style.display = 'block';
            busFrame.style.opacity = '0'; 

            const url = `https://bus.jeju.go.kr/schedule/viewNew/${busNumber}`;
            busFrame.src = url;

            busFrame.onload = () => {
                loader.style.display = 'none';
                busFrame.style.opacity = '1';
            };
        }

        searchBtn.addEventListener('click', searchBus);
        
        busInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                searchBus();
                busInput.blur(); 
            }
        });

        if (window.innerWidth > 768) {
            busInput.focus();
        }
    </script>
</body>
</html>
