<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Assessment Master</title>
    <!-- 프리텐다드 폰트 & FontAwesome -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Color Palette */
            --primary: #2563eb;       /* Royal Blue */
            --primary-light: #eff6ff; /* Light Blue Background */
            --primary-border: #bfdbfe;
            
            --success: #059669;       /* Emerald */
            --success-light: #ecfdf5; /* Light Green Background */
            --success-border: #a7f3d0;
            
            --accent: #d97706;        /* Amber */
            --accent-light: #fffbeb;
            --accent-border: #fde68a;

            --text-main: #1e293b;     /* Slate 900 */
            --text-sub: #475569;      /* Slate 600 */
            --bg-body: #f8fafc;       /* Slate 50 */
            --bg-card: #ffffff;
            --border: #e2e8f0;
            
            /* Layout */
            --header-height: 70px;
            --nav-height: 60px;
            --radius: 16px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding-top: calc(var(--header-height) + var(--nav-height) + 30px);
            line-height: 1.6;
        }

        /* --- Fixed Header --- */
        .fixed-header-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .main-header {
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo i { color: var(--primary); -webkit-text-fill-color: initial; }

        .header-controls { display: flex; gap: 10px; }

        .ctrl-btn {
            background: white;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: var(--bg-body);
            color: var(--primary);
            border-color: var(--primary);
        }

        /* --- Navigation --- */
        .nav-wrapper {
            border-top: 1px solid var(--border);
            background: #ffffff;
            height: var(--nav-height);
        }

        .nav-scroller {
            display: flex;
            gap: 8px;
            padding: 0 24px;
            overflow-x: auto;
            max-width: 1000px;
            margin: 0 auto;
            height: 100%;
            align-items: center;
            scrollbar-width: none;
        }
        .nav-scroller::-webkit-scrollbar { display: none; }

        .nav-btn {
            flex: 0 0 auto;
            padding: 8px 16px;
            border-radius: 20px;
            background: transparent;
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .nav-btn:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
        }

        /* --- Main Content --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 80px;
        }

        /* Chapter Cards */
        .chapter-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            margin-bottom: 32px;
            border: 1px solid var(--border);
            overflow: hidden;
            scroll-margin-top: 160px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chapter-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .chapter-header {
            padding: 24px 30px;
            background: linear-gradient(to right, #ffffff, #f8fafc);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .chapter-header:hover { background-color: #f1f5f9; }

        .chapter-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .chapter-badge {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 10px;
            border-radius: 6px;
            align-self: flex-start;
            letter-spacing: 0.5px;
        }

        .chapter-title-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .chapter-title-eng {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
            line-height: 1.2;
        }

        .chapter-title-kor {
            font-size: 1.2rem;
            color: var(--text-sub);
            font-weight: 600;
        }
        
        .chapter-title-kor::before {
            content: '';
            display: inline-block;
            width: 1px;
            height: 16px;
            background: #cbd5e1;
            margin-right: 12px;
            vertical-align: middle;
        }

        .toggle-icon {
            width: 40px;
            height: 40px;
            background: var(--bg-body);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            transition: all 0.3s;
            font-size: 1rem;
        }

        .chapter-card.active .toggle-icon {
            transform: rotate(180deg);
            background: var(--text-main);
            color: white;
        }

        /* Keyword List (Accordion) */
        .keyword-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: none;
        }

        .chapter-card.active .keyword-list {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        .keyword-item { border-bottom: 1px solid var(--border); }
        .keyword-item:last-child { border-bottom: none; }

        .keyword-trigger {
            width: 100%;
            text-align: left;
            padding: 20px 30px;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .keyword-trigger:hover { background-color: #f8fafc; }

        .keyword-text {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .keyword-bullet {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background-color: var(--primary);
            transform: rotate(45deg);
        }

        .plus-icon {
            font-size: 1rem;
            color: var(--text-sub);
            transition: transform 0.3s;
        }

        .keyword-item.open .plus-icon {
            transform: rotate(45deg);
            color: var(--primary);
        }

        /* Keyword Detail Content */
        .keyword-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
            background-color: #ffffff;
        }

        .keyword-item.open .keyword-detail {
            max-height: 5000px; /* Allow large content */
            box-shadow: inset 0 4px 6px -4px rgba(0,0,0,0.05);
        }

        .detail-inner {
            padding: 20px 30px 30px;
            border-top: 1px dashed var(--border);
        }

        /* --- Language Boxes (Core Design) --- */
        .lang-box {
            margin-bottom: 20px;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid transparent;
            position: relative;
        }

        /* English Box */
        .eng-box {
            background-color: var(--primary-light);
            border-color: var(--primary-border);
            border-left: 6px solid var(--primary);
        }

        /* Korean Box */
        .kor-box {
            background-color: var(--success-light);
            border-color: var(--success-border);
            border-left: 6px solid var(--success);
        }

        .lang-label {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            background: white;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        
        .eng-box .lang-label { color: var(--primary); border: 1px solid var(--primary-border); }
        .kor-box .lang-label { color: var(--success); border: 1px solid var(--success-border); }

        .text-content {
            font-size: 1.05rem;
            color: var(--text-main);
            line-height: 1.8;
        }

        .kor-box .text-content {
            font-size: 1rem; /* 한국어는 조금 더 작게 */
            color: var(--text-sub);
        }

        .text-content b {
            font-weight: 700;
            color: #000;
            background: rgba(255,255,255,0.6);
            padding: 0 4px;
            border-radius: 4px;
        }
        
        /* Lists inside content */
        .text-content ul, .text-content ol {
            margin: 12px 0 0 0;
            padding-left: 24px;
        }
        
        .text-content li {
            margin-bottom: 8px;
            padding-left: 4px;
        }
        
        /* Bullet Point Style */
        .text-content ul { list-style-type: disc; }
        .text-content ol { list-style-type: decimal; }


        /* Note Box */
        .note-box {
            margin-top: 20px;
            padding: 18px 24px;
            background-color: var(--accent-light);
            border: 1px solid var(--accent-border);
            border-radius: 12px;
            color: #92400e;
            font-size: 1rem;
            display: flex;
            gap: 12px;
            align-items: flex-start;
            line-height: 1.6;
        }

        .note-icon {
            color: var(--accent);
            margin-top: 4px;
            font-size: 1.2rem;
        }

        /* Scroll Top Button */
        .scroll-top {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 50px;
            height: 50px;
            background: var(--text-main);
            color: white;
            border-radius: 50%;
            border: none;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .scroll-top.visible { opacity: 1; transform: translateY(0); }
        .scroll-top:hover { background: var(--primary); transform: translateY(-5px); }

        @media (max-width: 640px) {
            .chapter-title-row { flex-direction: column; align-items: flex-start; gap: 4px; }
            .chapter-title-kor::before { display: none; }
            .container { padding: 0 16px 40px; }
            .keyword-trigger { padding: 16px; }
            .detail-inner { padding: 16px; }
            .logo span { display: none; }
            .header-controls .ctrl-btn span { display: none; }
        }
    </style>
</head>
<body>

    <!-- Header Area -->
    <div class="fixed-header-wrapper">
        <div class="main-header">
            <div class="logo" onclick="location.reload()">
                <i class="fas fa-graduation-cap"></i> <span>Language Assessment Master</span>
            </div>
            <div class="header-controls">
                <button class="ctrl-btn" onclick="app.expandAll()">
                    <i class="fas fa-folder-open"></i> <span>모두 펼치기</span>
                </button>
                <button class="ctrl-btn" onclick="app.collapseAll()">
                    <i class="fas fa-folder"></i> <span>모두 접기</span>
                </button>
            </div>
        </div>
        
        <!-- Navigation Scroll -->
        <div class="nav-wrapper">
            <div class="nav-scroller" id="nav-scroller">
                <!-- JS Generated Items -->
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container" id="main-container">
        <!-- Cards injected here -->
    </div>

    <!-- Scroll Top -->
    <button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <i class="fas fa-arrow-up"></i>
    </button>

<script>
    // ==========================================
    // CONTENT DATA (ENRICHED & FORMATTED)
    // ==========================================
    const examData = [
        {
            id: "ch1",
            title: "Assessment Concepts and Issues",
            subtitle: "평가의 핵심 개념 및 이슈",
            items: [
                {
                    key: "Assessment vs. Testing",
                    eng: "<ul><li><b>Assessment:</b> An ongoing pedagogical process that encompasses a wide range of methodological techniques.<br>- Includes incidental comments, observations, and student responses during class.<br>- Focuses on the <b>process</b> of learning.</li><li><b>Testing:</b> A subset of assessment.<br>- A method of measuring a person's ability, knowledge, or performance in a given domain at a specific point in time.<br>- An identifiable administrative procedure focusing on the <b>product</b> (result).</li></ul>",
                    kor: "<ul><li><b>평가(Assessment):</b> 광범위한 방법론적 기법을 포함하는 진행 중인 교육적 과정임.<br>- 수업 중의 우발적 코멘트, 관찰, 학생 반응 등을 포함하며 학습의 <b>과정</b>에 초점을 맞춤.</li><li><b>시험(Testing):</b> 평가의 하위 집합임.<br>- 특정 시점에 특정 영역에서 개인의 능력이나 지식을 측정하는 방법임.<br>- 식별 가능한 행정적 절차로, 학습의 <b>결과(Product)</b>에 초점을 둠.</li></ul>",
                    note: "모든 시험은 평가에 포함되지만, 모든 평가가 시험은 아님 (Tests are a subset of assessment)."
                },
                {
                    key: "Measurement vs. Evaluation",
                    eng: "<ul><li><b>Measurement:</b> The process of quantifying observed performance.<br>- Assigning numbers, rankings, or scores (e.g., 85/100).<br>- Does <b>not</b> necessarily imply value judgments.</li><li><b>Evaluation:</b> The interpretation of information (including measurements) to make decisions.<br>- Involves value judgments about the worth or quality of performance (e.g., grading, passing/failing).</li></ul>",
                    kor: "<ul><li><b>측정(Measurement):</b> 관찰된 수행을 수량화하는 과정임.<br>- 숫자, 석차, 점수 등을 부여함 (예: 100점 만점에 85점).<br>- 반드시 가치 판단을 내포하지는 않음.</li><li><b>평가/판단(Evaluation):</b> 정보를 해석하여 학습자 수행의 가치나 질에 대한 의사결정을 내리는 것임.<br>- 가치 판단이 개입됨 (예: 성적 부여, 통과/탈락 결정).</li></ul>"
                },
                {
                    key: "Assessment Types (Formal/Informal)",
                    eng: "<ul><li><b>Informal Assessment:</b> Incidental, unplanned feedback (e.g., 'Good job!').<br>- Purpose is coaching and eliciting performance without recording fixed results.<br>- Generally induces less anxiety.</li><li><b>Formal Assessment:</b> Systematic, planned exercises.<br>- Constructed to give an appraisal of achievement (e.g., unit tests, quizzes, journals, portfolios).<br>- Records results for evaluation.</li></ul>",
                    kor: "<ul><li><b>비공식적 평가:</b> 우발적이고 계획되지 않은 피드백임 (예: '잘했어!').<br>- 목적은 코칭이며, 고정된 결과를 기록하지 않고 수행을 이끌어냄.<br>- 일반적으로 불안감을 덜 유발함.</li><li><b>공식적 평가:</b> 성취도를 평가하기 위해 체계적으로 계획된 연습임.<br>- 단원 평가, 퀴즈, 저널, 포트폴리오 등이 포함됨.<br>- 평가를 위해 결과를 기록함.</li></ul>"
                },
                {
                    key: "Formative vs. Summative Assessment",
                    eng: "<ul><li><b>Formative Assessment:</b> Evaluating students <i>during</i> the process of learning to aid growth.<br>- Provides feedback for improvement and shapes future learning.</li><li><b>Summative Assessment:</b> Measuring attainment <i>at the end</i> of a course or unit.<br>- Aims to summarize learning for grading purposes (e.g., Final exams).</li></ul>",
                    kor: "<ul><li><b>형성평가:</b> 학습 <i>과정 중</i>에 학생을 평가하여 성장을 도움.<br>- 개선을 위한 피드백을 제공하여 미래의 학습을 형성함.</li><li><b>총괄평가:</b> 코스나 단원의 <i>마지막</i>에 성취도를 측정함.<br>- 성적 부여를 위해 학습 내용을 요약하는 것이 목적임 (예: 기말고사).</li></ul>"
                },
                {
                    key: "NRT vs. CRT",
                    eng: "<ul><li><b>Norm-Referenced Tests (NRT):</b> Scores are interpreted in relation to other students' scores (Mean, Percentile).<br>- Purpose is to rank students across a continuum.</li><li><b>Criterion-Referenced Tests (CRT):</b> Scores are interpreted against absolute criteria or objectives.<br>- Purpose is to measure mastery of specific course material.</li></ul>",
                    kor: "<ul><li><b>규준 지향 평가(NRT/상대평가):</b> 점수를 다른 학생들과 비교하여 해석함 (평균, 백분위).<br>- 학생들을 서열화하는 것이 목적임.</li><li><b>준거 지향 평가(CRT/절대평가):</b> 점수를 절대적인 기준이나 목표에 비추어 해석함.<br>- 특정 학습 자료의 숙달 여부를 측정하는 것이 목적임.</li></ul>"
                },
                {
                    key: "Historical Trends in Testing",
                    eng: "<ul><li><b>Discrete-point Testing:</b> Assumes language can be broken down into component parts (grammar, vocab) and tested in isolation (e.g., multiple choice grammar).</li><li><b>Integrative Testing:</b> Treats language competence as a unified set of interacting abilities (e.g., Cloze tests, Dictation).</li><li><b>Communicative Language Testing:</b> Emphasizes authentic tasks and real-world language use.</li></ul>",
                    kor: "<ul><li><b>이산적 평가:</b> 언어가 구성 요소(문법, 어휘)로 나뉠 수 있다고 보고 이를 분리하여 평가함 (예: 선다형 문법 문제).</li><li><b>통합적 평가:</b> 언어 능력을 상호작용하는 능력들의 통합체로 봄 (예: 빈칸 채우기, 받아쓰기).</li><li><b>의사소통적 언어 평가:</b> 실제적 과업(Authentic tasks)과 실제 세계의 언어 사용을 강조함.</li></ul>"
                }
            ]
        },
        {
            id: "ch2",
            title: "Principles of Language Assessment",
            subtitle: "언어 평가의 5대 원칙",
            items: [
                {
                    key: "1. Practicality (실용성)",
                    eng: "An effective test is practical if it meets these criteria:<br><ul><li>Is not excessively expensive (financial limitations).</li><li>Stays within appropriate time constraints (for administration and scoring).</li><li>Is easy to administer.</li><li>Has a specific and time-efficient scoring procedure.</li></ul>",
                    kor: "효과적인 시험은 다음 조건에서 실용적임:<br><ul><li>비용이 과하지 않음 (재정적 제약).</li><li>적절한 시간 내에 시행 및 채점 가능함.</li><li>시행이 용이함.</li><li>채점 절차가 구체적이고 시간 효율적임.</li></ul>"
                },
                {
                    key: "2. Reliability (신뢰도)",
                    eng: "Consistency and dependability of results. Major types:<br><ul><li><b>Student-Related:</b> Factors inside learner (illness, fatigue, anxiety, test-wiseness).</li><li><b>Rater Reliability:</b><br>- <i>Inter-rater:</i> Consistency between two or more scorers.<br>- <i>Intra-rater:</i> Consistency of the same scorer over time.</li><li><b>Test Administration:</b> Conditions like noise, lighting, equipment, photocopying quality.</li><li><b>Test Reliability:</b> Nature of the test itself (ambiguous items, test too long/short).</li></ul>",

                    kor: "평가 결과로부터 도출된 추론이 적절하고, 의미 있고, 유용한 정도임.<br><ul><li><b>내용 타당도:</b> 주제와 기술을 적절히 표집했는가?</li><li><b>준거 타당도:</b><br>- <i>공인 타당도:</i> 다른 동시 측정치에 의해 지지됨.<br>- <i>예측 타당도:</i> 미래의 성공을 예측함.</li><li><b>구인 타당도:</b> 이론적 특성(숙달도, 자존감 등)을 측정하는가?</li><li><b>결과 타당도:</b> 학습자와 사회에 미치는 영향.</li><li><b>안면 타당도:</b> 수험자 입장에서 타당해 보이는가? (주관적이지만 중요함).</li></ul>"

                    kor: "<ul><li><b>지각적:</b> 구성요소(문자, 단어).<br>- 과업: 낭독, 선다형(최소대립쌍).</li><li><b>선택적:</b> 어휘/문법 특징.<br>- 과업: 선다형(형태), 연결하기, 빈칸 채우기, 그림 단서.</li><li><b>상호작용적:</b> 의미 협상 (중간 길이).<br>- 과업: 클로즈, 즉흥 읽기+질문, 스캐닝, 순서 배열.</li><li><b>확장적:</b> 전반적 이해 (긴 글).<br>- 과업: 스키밍, 요약하기, 필기.</li></ul>"
                },
                {
                    key: "Specific Task Definitions",
                    eng: "<b>Cloze:</b> Filling gaps (Rational vs. Fixed-ratio).<br><b>Editing:</b> Detecting errors.<br><b>Scanning:</b> Locating specific info quickly.<br><b>Skimming:</b> Getting the gist quickly.",
                    kor: "<b>클로즈:</b> 빈칸 채우기 (합리적 삭제 vs 고정 비율 삭제).<br><b>편집:</b> 오류 찾기.<br><b>스캐닝:</b> 세부 정보 빠르게 찾기.<br><b>스키밍:</b> 요점 빠르게 파악하기."
                }
            ]
        },
        {
            id: "ch9",
            title: "Assessing Writing",
            subtitle: "쓰기 평가 (Productive)",
            items: [
                {
                    key: "4 Types of Writing",
                    eng: "<ul><li><b>Imitative:</b> Basics (Spelling, punctuation). Form focus.<br>- Task: Copying, Dictation.</li><li><b>Intensive (Controlled):</b> Grammar focus.<br>- Task: <b>Dicto-comp</b>, Picture-cued.</li><li><b>Responsive:</b> Paragraphs, logical sequence. Discourse focus.<br>- Task: Paraphrasing, Guided writing.</li><li><b>Extensive:</b> Essays, papers. Purpose & development focus.<br>- Task: Essay, Term paper.</li></ul>",
                    kor: "<ul><li><b>모방적:</b> 기초(철자, 구두점). 형태 초점.<br>- 과업: 베껴쓰기, 받아쓰기.</li><li><b>집중적(통제된):</b> 문법 초점.<br>- 과업: <b>딕토콤프</b>, 그림 묘사.</li><li><b>반응적:</b> 단락 연결, 논리적 순서. 담화 초점.<br>- 과업: 의역, 유도 작문.</li><li><b>확장적:</b> 에세이, 논문. 목적 및 전개 초점.<br>- 과업: 에세이, 기말 과제.</li></ul>"
                },
                {
                    key: "Key Task: Dicto-comp",
                    eng: "A variation of dictation. Learners listen to a text (paragraph) and try to rewrite it from memory, often using provided keywords. Bridges listening and writing.",
                    kor: "<b>Dicto-comp:</b> 받아쓰기의 변형임. 학습자가 텍스트(단락)를 들은 후 기억과 제공된 키워드를 활용해 텍스트를 다시 작성하는 과업으로, 듣기와 쓰기를 연결함."
                },
                {
                    key: "Scoring Methods",
                    eng: "<ul><li><b>Holistic:</b> Single global score based on overall impression. Fast, high inter-rater reliability, but no diagnostic info.</li><li><b>Primary-Trait:</b> Focuses on the specific function/purpose of the text.</li><li><b>Analytic:</b> Separate scores for features (content, org, grammar). Detailed diagnostic feedback, but time-consuming.</li></ul>",
                    kor: "<ul><li><b>총체적 채점:</b> 전반적 인상에 따른 단일 종합 점수. 빠르고 신뢰도 높으나 진단 정보 부족.</li><li><b>주요 특성 채점:</b> 글의 특정 기능/목적 달성 여부에 초점.</li><li><b>분석적 채점:</b> 요소별(내용, 조직, 문법) 별도 점수. 상세한 진단적 피드백 제공하나 시간 소요.</li></ul>"
                }
            ]
        },
        {
            id: "ch10",
            title: "Grammar & Vocabulary",
            subtitle: "문법 및 어휘 평가",
            items: [
                {
                    key: "Assessing Grammar",

                    kor: "문법 지식의 구성 요소:<br><ul><li><b>형태</b> (형태론, 통사론)</li><li><b>의미</b> (문자적/의도된 의미)</li><li><b>사용</b> (화용적 적절성)</li></ul>과업: 선다형, 빈칸 채우기, 정보 공백, 역할극."
                },
                {
                    key: "Assessing Vocabulary",
                    eng: "<ul><li><b>Nature:</b> Lexical knowledge (meaning, form, collocations). High vs. Low frequency.</li><li><b>Context:</b> Crucial for validity (e.g., Vocabulary in Context).</li><li><b>Receptive Tasks:</b> Recognition (Matching, Contextualized MC).</li><li><b>Productive Tasks:</b> Recall and Use (Sentence completion, Cloze).</li></ul>",
                    kor: "<ul><li><b>본질:</b> 어휘 지식(의미, 형태, 연어). 고빈도 vs 저빈도 어휘.</li><li><b>문맥:</b> 타당도를 위해 중요함 (예: 문맥 속 어휘).</li><li><b>수용적 과업:</b> 인식 (연결하기, 문맥 속 선다형).</li><li><b>산출적 과업:</b> 회상 및 사용 (문장 완성, 클로즈).</li></ul>"
                }
            ]
        },
        {
            id: "ch11",
            title: "Grading & Evaluation",
            subtitle: "성적 산출 및 평가",
            items: [
                {
                    key: "Grading Philosophy",
                    eng: "<ul><li><b>Achievement:</b> Grades should primarily reflect mastery of objectives.</li><li><b>Other Factors:</b> Improvement, behavior, effort, attendance can be included but weighted carefully to avoid distortion.</li><li><b>Institutional Expectations:</b> Must align with policy for consistency.</li></ul>",
                    kor: "<ul><li><b>성취도:</b> 성적은 주로 목표 숙달도를 반영해야 함.</li><li><b>기타 요인:</b> 향상도, 태도, 노력, 출석 등은 포함될 수 있으나 왜곡 방지를 위해 신중히 가중치를 두어야 함.</li><li><b>기관의 기대:</b> 일관성을 위해 방침과 일치해야 함.</li></ul>"
                },
                {
                    key: "Calculating Grades",
                    eng: "<ul><li><b>Absolute Grading:</b> Criterion-referenced. Based on pre-specified standards (e.g., A=90-100).</li><li><b>Relative Grading:</b> Norm-referenced. Based on rank compared to peers (Grading on a curve).</li></ul>",
                    kor: "<ul><li><b>절대평가:</b> 준거 지향. 미리 정해진 기준에 근거 (예: 90점 이상 A).</li><li><b>상대평가:</b> 규준 지향. 동료 대비 석차에 근거 (곡선 등급).</li></ul>"
                },
                {
                    key: "Rubrics",
                    eng: "<ul><li><b>Holistic Rubric:</b> Single score based on overall impression. Fast but less diagnostic.</li><li><b>Analytic Rubric:</b> Scores specific criteria separately (e.g., grammar 1-5, content 1-5). Provides better washback.</li></ul>",
                    kor: "<ul><li><b>총체적 루브릭:</b> 전반적 인상에 따른 단일 점수. 빠르지만 진단 정보 부족.</li><li><b>분석적 루브릭:</b> 특정 기준별 별도 채점. 더 나은 환류 효과(피드백) 제공.</li></ul>"
                }
            ]
        },
        {
            id: "ch12",
            title: "Beyond Letter Grading",
            subtitle: "성적 그 이상의 평가 (대안 평가)",
            items: [
                {
                    key: "Alternatives to Grading",
                    eng: "Letter grades mask detail. Alternatives offer formative, detailed, motivating feedback.<br>Includes: Self & Peer Assessment, Portfolios, Narrative Evaluations, Conferences.",
                    kor: "문자 등급은 세부사항을 가립니다. 대안은 형성적이고 상세하며 동기를 부여하는 피드백을 제공합니다.<br>포함: 자기/동료 평가, 포트폴리오, 서술형 평가, 면담."
                },
                {
                    key: "Self & Peer Assessment",
                    eng: "Promotes <b>Autonomy</b> and <b>Intrinsic Motivation</b>. Students learn to monitor their own progress. <br>Types: Performance checklist, Indirect competence assessment, Goal setting.",
                    kor: "<b>자율성</b>과 <b>내재적 동기</b>를 촉진합니다. 학생들은 자신의 진척도를 모니터링하는 법을 배웁니다.<br>유형: 수행 체크리스트, 간접 능력 평가, 목표 설정."
                },
                {
                    key: "Portfolios (CRADLE)",
                    eng: "A purposeful collection of student work demonstrating effort, progress, and achievement.<br><b>CRADLE Attributes:</b><br><ul><li><b>C</b>ollecting</li><li><b>R</b>eflecting</li><li><b>A</b>ssessing</li><li><b>D</b>ocumenting</li><li><b>L</b>inking</li><li><b>E</b>valuating</li></ul>",
                    kor: "노력, 진전, 성취를 보여주는 목적 있는 수집품.<br><b>CRADLE 속성:</b> 수집, 성찰, 평가, 문서화, 연결, 평가."
                },
                {
                    key: "Narrative & Checklists",
                    eng: "<ul><li><b>Narrative Evaluations:</b> Individualized written descriptions. High washback but time-consuming.</li><li><b>Checklists:</b> A practical compromise offering more detail than a grade but less time than narratives.</li></ul>",
                    kor: "<ul><li><b>서술형 평가:</b> 개별화된 서면 기술. 환류 효과는 높으나 시간이 많이 소요됨.</li><li><b>체크리스트:</b> 등급보다 자세한 정보를 제공하지만 서술형보다 실용적인 절충안.</li></ul>"
                }
            ]
        }
    ];

    const app = {
        init: function() {
            this.renderNav();
            this.renderContent();
            this.setupScrollEvents();
        },

        renderNav: function() {
            const nav = document.getElementById('nav-scroller');
            examData.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.textContent = ch.id.replace('ch', 'Ch ');
                btn.onclick = () => this.scrollTo(ch.id, btn);
                nav.appendChild(btn);
            });
        },

        renderContent: function() {
            const container = document.getElementById('main-container');
            
            examData.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'chapter-card';
                card.id = ch.id;

                card.innerHTML = `
                    <div class="chapter-header" onclick="app.toggleChapter('${ch.id}')">
                        <div class="chapter-info">
                            <span class="chapter-badge">${ch.id.toUpperCase().replace('CH', 'CHAPTER ')}</span>
                            <div class="chapter-title-row">
                                <span class="chapter-title-eng">${ch.title}</span>
                                <span class="chapter-title-kor">${ch.subtitle}</span>
                            </div>
                        </div>
                        <div class="toggle-icon"><i class="fas fa-chevron-down"></i></div>
                    </div>
                    <div class="chapter-content">
                        <ul class="keyword-list">
                            ${ch.items.map(item => `
                                <li class="keyword-item">
                                    <button class="keyword-trigger" onclick="app.toggleKeyword(this)">
                                        <span class="keyword-text">
                                            <span class="keyword-bullet"></span> ${item.key}
                                        </span>
                                        <div class="plus-icon"><i class="fas fa-plus"></i></div>
                                    </button>
                                    <div class="keyword-detail">
                                        <div class="detail-inner">
                                            <div class="lang-box eng-box">
                                                <span class="lang-label">English</span>
                                                <div class="text-content">${item.eng}</div>
                                            </div>
                                            <div class="lang-box kor-box">
                                                <span class="lang-label">Korean</span>
                                                <div class="text-content">${item.kor}</div>
                                            </div>
                                            ${item.note ? `
                                            <div class="note-box">
                                                <i class="fas fa-lightbulb note-icon"></i>
                                                <div>${item.note}</div>
                                            </div>` : ''}
                                        </div>
                                    </div>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                `;
                container.appendChild(card);
            });
        },

        toggleChapter: function(id) {
            const card = document.getElementById(id);
            card.classList.toggle('active');
        },

        toggleKeyword: function(btn) {
            const li = btn.parentElement;
            li.classList.toggle('open');
        },

        expandAll: function() {
            document.querySelectorAll('.chapter-card').forEach(c => c.classList.add('active'));
            document.querySelectorAll('.keyword-item').forEach(k => k.classList.add('open'));
        },

        collapseAll: function() {
            document.querySelectorAll('.chapter-card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.keyword-item').forEach(k => k.classList.remove('open'));
        },

        scrollTo: function(id, btn) {
            const el = document.getElementById(id);
            if (!el.classList.contains('active')) el.classList.add('active');
            const headerOffset = 160;
            const elementPosition = el.getBoundingClientRect().top;
            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
            window.scrollTo({ top: offsetPosition, behavior: "smooth" });
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        },

        setupScrollEvents: function() {
            const btn = document.getElementById('scrollTopBtn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) btn.classList.add('visible');
                else btn.classList.remove('visible');
            });
        }
    };

    document.addEventListener('DOMContentLoaded', () => {
        app.init();
        setTimeout(() => app.toggleChapter('ch1'), 100);
        document.querySelector('.nav-btn').classList.add('active');
    });
</script>

</body>
</html>
