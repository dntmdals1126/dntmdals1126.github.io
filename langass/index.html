<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어과 평가법 마스터 가이드 (Enhanced)</title>
    <!-- 폰트 및 아이콘 로드 -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;       /* Royal Blue */
            --primary-dark: #1e40af;  /* Darker Blue */
            --secondary: #06b6d4;     /* Cyan */
            --accent: #f59e0b;        /* Amber */
            --bg-body: #f1f5f9;       /* Slate 100 */
            --bg-card: #ffffff;
            --text-main: #0f172a;     /* Slate 900 */
            --text-sub: #64748b;      /* Slate 500 */
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #fbbf24;
            --error: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --nav-height: 60px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding-top: calc(var(--nav-height) + 80px); /* Header + Nav height */
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Fixed Header & Navigation --- */
        .fixed-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
        }

        .header-top {
            height: var(--nav-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Chapter Navigation */
        .nav-container {
            background: white;
            border-top: 1px solid var(--border);
        }

        .nav-scroller {
            display: flex;
            gap: 8px;
            padding: 12px 20px;
            overflow-x: auto;
            max-width: 1200px;
            margin: 0 auto;
            scrollbar-width: none;
        }
        .nav-scroller::-webkit-scrollbar { display: none; }

        .nav-btn {
            flex: 0 0 auto;
            padding: 6px 16px;
            border-radius: 20px;
            background: #f8fafc;
            border: 1px solid var(--border);
            color: var(--text-sub);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .nav-btn:hover {
            background: #e2e8f0;
            color: var(--primary);
        }

        .nav-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
        }

        /* Global Controls */
        .global-controls {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: white;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .control-btn:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        /* --- Main Content --- */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .chapter-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            margin-bottom: 30px;
            border: 1px solid var(--border);
            overflow: hidden;
            scroll-margin-top: 150px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chapter-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .chapter-header {
            padding: 20px 25px;
            background: linear-gradient(to right, #ffffff, #f8fafc);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .chapter-title-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .chapter-label {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--primary);
            letter-spacing: 0.5px;
        }

        .chapter-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .chapter-subtitle {
            font-size: 0.95rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .toggle-icon {
            width: 32px;
            height: 32px;
            background: #f1f5f9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            transition: transform 0.3s ease, background 0.3s, color 0.3s;
        }

        .chapter-card.active .toggle-icon {
            transform: rotate(180deg);
            background: var(--primary);
            color: white;
        }

        /* Keyword List */
        .keyword-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: none;
        }

        .chapter-card.active .keyword-list {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .keyword-item {
            border-bottom: 1px solid var(--border);
        }
        .keyword-item:last-child { border-bottom: none; }

        .keyword-trigger {
            width: 100%;
            text-align: left;
            padding: 18px 25px;
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .keyword-trigger:hover {
            background-color: #f8fafc;
        }

        .keyword-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .keyword-bullet {
            width: 8px;
            height: 8px;
            background: var(--secondary);
            border-radius: 2px;
            transform: rotate(45deg);
        }

        .plus-icon {
            font-size: 0.9rem;
            color: var(--text-sub);
            transition: transform 0.3s;
        }

        .keyword-item.open .plus-icon {
            transform: rotate(45deg);
            color: var(--primary);
        }

        /* Keyword Details */
        .keyword-detail {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            background-color: #ffffff;
        }

        .keyword-item.open .keyword-detail {
            max-height: 2000px; /* Sufficient height */
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        .detail-inner {
            padding: 20px 30px 30px 30px;
        }

        .content-row {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 15px;
        }

        .lang-box {
            background: #f8fafc;
            border-left: 4px solid #cbd5e1;
            padding: 15px;
            border-radius: 0 8px 8px 0;
        }

        .lang-box.eng { border-color: var(--primary); background: #eff6ff; }
        .lang-box.kor { border-color: var(--success); background: #f0fdf4; }

        .lang-label {
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
            display: block;
            color: var(--text-sub);
        }
        
        .lang-box.eng .lang-label { color: var(--primary); }
        .lang-box.kor .lang-label { color: var(--success); }

        .text-content {
            font-size: 1rem;
            color: var(--text-main);
            line-height: 1.7;
        }

        /* Highlight styles within text */
        .text-content b { color: var(--primary-dark); font-weight: 700; }
        .text-content i { background: #fffbeb; padding: 0 2px; font-style: normal; border-radius: 2px; }

        /* Note Box */
        .note-box {
            margin-top: 15px;
            padding: 15px;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            color: #9a3412;
            font-size: 0.95rem;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .note-icon {
            color: #f59e0b;
            font-size: 1.1rem;
            margin-top: 2px;
        }

        /* Scroll Top Button */
        .scroll-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            border: none;
            box-shadow: var(--shadow-lg);
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .scroll-top.visible { opacity: 1; transform: translateY(0); }
        .scroll-top:hover { background: var(--primary-dark); transform: translateY(-2px); }

        /* Responsive */
        @media (max-width: 640px) {
            .container { padding: 15px; }
            .header-top { padding: 10px 15px; }
            .logo { font-size: 1.1rem; }
            .chapter-title-group { gap: 2px; }
            .chapter-name { font-size: 1.2rem; }
            .detail-inner { padding: 20px; }
            .text-content { font-size: 0.95rem; }
            .control-btn span { display: none; } /* Hide text on mobile */
        }
    </style>
</head>
<body>

    <div class="fixed-header">
        <div class="header-top">
            <div class="logo"><i class="fas fa-graduation-cap"></i> Assessment Master</div>
            <div class="global-controls">
                <button class="control-btn" onclick="app.expandAll()">
                    <i class="fas fa-expand-alt"></i> <span>모두 펼치기</span>
                </button>
                <button class="control-btn" onclick="app.collapseAll()">
                    <i class="fas fa-compress-alt"></i> <span>모두 접기</span>
                </button>
            </div>
        </div>
        <div class="nav-container">
            <div class="nav-scroller" id="nav-scroller">
                <!-- Nav Items Injected via JS -->
            </div>
        </div>
    </div>

    <div class="container" id="main-container">
        <!-- Chapter Cards Injected via JS -->
    </div>

    <button class="scroll-top" id="scrollTopBtn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
        <i class="fas fa-arrow-up"></i>
    </button>

<script>
    // ==========================================
    // DATA DEFINITION
    // ==========================================
    const examData = [
        {
            id: "ch1",
            title: "Assessment Concepts",
            subtitle: "평가의 기본 개념 및 이슈",
            items: [
                {
                    key: "Assessment vs. Testing",
                    eng: "<b>Assessment</b> is an ongoing pedagogical process that encompasses a wide range of methodological techniques (incidental comments, observations). It focuses on the <i>process</i> of learning.<br><br><b>Testing</b> is a subset of assessment. It is a method of measuring a person's ability, knowledge, or performance in a given domain at a specific point in time. It is an identifiable administrative procedure focusing on the <i>product</i>.",
                    kor: "<b>평가(Assessment):</b> 광범위한 방법론적 기법을 포함하는 진행 중인 교육적 과정입니다. 수업 중 우발적인 코멘트, 관찰 등을 포함하며 학습의 <b>과정</b>에 초점을 맞춥니다.<br><br><b>시험(Testing):</b> 평가의 하위 집합입니다. 특정 시점에 특정 영역에서 개인의 능력, 지식, 수행을 측정하는 방법으로, 식별 가능한 행정적 절차이며 <b>결과</b>에 초점을 둡니다.",
                    note: "모든 시험(Test)은 평가(Assessment)의 일부분이지만, 모든 평가가 시험은 아닙니다."
                },
                {
                    key: "Measurement vs. Evaluation",
                    eng: "<b>Measurement:</b> The process of quantifying observed performance (assigning numbers, e.g., 85/100). It does not necessarily imply value judgments.<br><br><b>Evaluation:</b> The interpretation of information (including measurements) to make decisions about the worth or quality of the learner's performance (e.g., grading, passing/failing).",
                    kor: "<b>측정(Measurement):</b> 관찰된 수행을 수량화하는 과정입니다(예: 점수 부여). 가치 판단을 포함하지 않습니다.<br><br><b>평가/판단(Evaluation):</b> 정보를 해석하여 학습자 수행의 가치나 질에 대한 의사결정을 내리는 것입니다(예: 성적 부여, 통과/탈락)."
                },
                {
                    key: "Informal vs. Formal Assessment",
                    eng: "<b>Informal:</b> Incidental, unplanned feedback (e.g., 'Good job!'). Purpose is coaching and eliciting performance without recording fixed results. Low anxiety.<br><br><b>Formal:</b> Systematic, planned exercises constructed to give an appraisal of achievement (e.g., unit tests). Records results.",
                    kor: "<b>비공식적 평가:</b> 우발적이고 계획되지 않은 피드백입니다. 코칭 목적이며 결과를 기록하지 않아 불안감이 낮습니다.<br><br><b>공식적 평가:</b> 성취도 평가를 위해 체계적으로 계획된 연습입니다. 결과를 기록합니다."
                },
                {
                    key: "Formative vs. Summative Assessment",
                    eng: "<b>Formative:</b> Evaluating students <i>during</i> the process of learning to aid growth. Provides feedback.<br><br><b>Summative:</b> Measuring attainment <i>at the end</i> of a course. Summarizes learning for grading.",
                    kor: "<b>형성평가:</b> 학습 <i>과정 중</i>에 학생을 평가하여 성장을 돕고 피드백을 제공합니다.<br><br><b>총괄평가:</b> 코스나 단원의 <i>마지막</i>에 성취도를 측정하여 성적을 산출합니다."
                },
                {
                    key: "NRT vs. CRT",
                    eng: "<b>Norm-Referenced (NRT):</b> Interpretation relative to other students (Ranking, Curve).<br><b>Criterion-Referenced (CRT):</b> Interpretation against absolute objectives (Mastery).",
                    kor: "<b>규준지향(상대평가):</b> 다른 학생과 비교하여 해석(석차, 상대평가).<br><b>준거지향(절대평가):</b> 절대적 목표 달성 여부 확인(숙달도)."
                },
                {
                    key: "Historical Trends",
                    eng: "<b>Discrete-point:</b> Isolated skills (Grammar/Vocab).<br><b>Integrative:</b> Unified competence (Cloze, Dictation).<br><b>Communicative:</b> Authentic, real-world tasks.",
                    kor: "<b>이산적 평가:</b> 문법, 어휘 등 분리된 요소 평가.<br><b>통합적 평가:</b> 클로즈 테스트, 받아쓰기 등 통합된 능력 평가.<br><b>의사소통적 평가:</b> 실제적 과업과 실제 세계의 언어 사용 중시."

        {
            id: "ch2",
            title: "Principles of Assessment",
            subtitle: "언어 평가의 5대 원칙",
            items: [
                {
                    key: "1. Practicality (실용성)",
                    eng: "An effective test is practical if it is not excessively expensive, stays within time constraints, is easy to administer, and has a specific/time-efficient scoring procedure.",
                    kor: "비용이 적절하고, 시간 제약 내에 있으며, 시행이 쉽고, 채점 절차가 구체적이고 효율적이어야 합니다.",
                    note: "고려 사항: 예산, 시간, 행정적 편의성, 채점의 용이성."

                {
                    key: "2. Reliability (신뢰도)",
                    eng: "Consistency and dependability of results.<br><ul><li><b>Student-Related:</b> Illness, fatigue, anxiety, test-wiseness.</li><li><b>Rater Reliability:</b> Inter-rater (between scorers) & Intra-rater (same scorer consistency).</li><li><b>Test Administration:</b> Environment conditions (noise, lighting).</li><li><b>Test Reliability:</b> Ambiguous items, length.</li></ul>",
                    kor: "결과의 일관성과 신뢰성입니다.<br>- <b>학생 관련:</b> 질병, 피로, 불안 등 내부 요인.<br>- <b>채점자:</b> 채점자 간(Inter) & 채점자 내(Intra) 일관성.<br>- <b>운영:</b> 소음, 조명 등 환경 조건.<br>- <b>검사 자체:</b> 문항의 모호성, 너무 길거나 짧은 길이."
                },
                {
                    key: "3. Validity (타당도)",
                    eng: "The extent to which inferences made from assessment results are appropriate, meaningful, and useful.<br><ul><li><b>Content:</b> Samples subject matter appropriately.</li><li><b>Criterion:</b> Concurrent & Predictive.</li><li><b>Construct:</b> Measures the theoretical trait (e.g., proficiency).</li><li><b>Consequential:</b> Impact on learner/society.</li><li><b>Face:</b> Looks valid to the test-taker.</li></ul>",
                    kor: "평가 결과의 추론이 적절하고 의미 있는 정도입니다.<br>- <b>내용:</b> 주제 표집의 적절성.<br>- <b>준거:</b> 공인(동시 측정치) & 예측(미래 성공).<br>- <b>구인:</b> 이론적 개념(숙달도 등) 측정 여부.<br>- <b>결과:</b> 학습자와 사회에 미치는 영향.<br>- <b>안면:</b> 수험자가 느끼기에 타당해 보이는가."

                {

                }
            ]
        },
        {
            id: "ch3",

                    key: "Item Analysis Statistics",
                    eng: "<b>Item Facility (IF):</b> How easy is the item? (% correct).<br><b>Item Discrimination (ID):</b> Differentiation between high/low ability groups.<br><b>Distractor Efficiency:</b> Do distractors attract lower-ability students?",
                    kor: "<b>문항 난이도(IF):</b> 얼마나 쉬운가 (정답률).<br><b>문항 변별도(ID):</b> 상위권과 하위권을 구별하는 정도.<br><b>오답지 효율성:</b> 오답지가 하위권 학생을 잘 유인하는가?"
                }
            ]
        },
        {
            id: "ch4",
            title: "Standards-Based Assessment",
            subtitle: "표준 기반 평가",
            items: [
                {
                    key: "Standards (Benchmarks)",
                    eng: "Specific criteria students are expected to meet. Anchors for accountability. (e.g., CASAS, SCANS, CEFR, ACTFL).",

                },
                {
                    key: "Consequences",
                    eng: "<b>Accountability:</b> Schools/teachers held responsible.<br><b>High-Stakes:</b> Gate-keepers (graduation/admission).<br><b>Test-Driven Learning:</b> Teaching to the test, narrowed curriculum.",
                    kor: "<b>책무성:</b> 학교/교사의 책임.<br><b>고부담 시험:</b> 입시/졸업의 문지기.<br><b>시험 주도 학습:</b> 시험 위주 수업으로 교육과정 축소 우려."
                },
                {
                    key: "Critical Language Testing",
                    eng: "Tests are not neutral; embedded in social/political agendas. Can be tools of power. Advocates exposing Test Bias.",
                    kor: "시험은 중립적이지 않고 권력의 도구가 될 수 있음. 시험 편향(Bias) 경계 및 불공정한 관행 폭로."
                }
            ]
        },
        {
            id: "ch5",
            title: "Standardized Testing",
            subtitle: "표준화 시험",
            items: [
                {
                    key: "Characteristics",
                    eng: "Standards-based, Systematic (uniform procedures), Norm-referenced, Empirical (research-based).",
                    kor: "표준 기반, 체계적(통일된 절차), 규준 지향, 경험적(연구 기반)."
                },
                {
                    key: "Pros & Cons",
                    eng: "<b>Pros:</b> Practicality, Reliability, Construct Validity.<br><b>Cons:</b> Indirect testing (validity issues), Test Bias, Test-driven learning.",
                    kor: "<b>장점:</b> 실용성, 신뢰도, 구인 타당도.<br><b>단점:</b> 간접 평가(타당도 문제), 시험 편향, 시험 주도 학습."
                },
                {
                    key: "Proficiency Testing",
                    eng: "<b>Direct:</b> Performing actual task (e.g., Essay). High content validity.<br><b>Indirect:</b> Related task (e.g., Grammar error ID). Relies on correlation.",
                    kor: "<b>직접 평가:</b> 실제 과업 수행(에세이 등). 높은 내용 타당도.<br><b>간접 평가:</b> 관련 과업 수행(문법 오류 찾기). 상관관계에 의존."
                }
            ]
        },
        {
            id: "ch6",
            title: "Assessing Listening",
            subtitle: "듣기 평가",
            items: [
                {
                    key: "Nature of Listening",
                    eng: "Receptive & Invisible. Assessment relies on <b>Inference</b> from observed output.",
                    kor: "수용적이며 보이지 않음. 산출물을 통한 <b>추론</b>에 의존."
                },
                {
                    key: "Micro vs. Macro Skills",
                    eng: "<b>Micro:</b> Bottom-up (sounds, words, sentence structure).<br><b>Macro:</b> Top-down (meaning, function, inference).",
                    kor: "<b>미시 기술:</b> 상향식 (소리, 단어, 문장구조).<br><b>거시 기술:</b> 하향식 (의미, 기능, 추론)."
                },
                {
                    key: "Difficulty Factors",
                    eng: "1. Clustering (chunks).<br>2. Redundancy (repetitions).<br>3. Reduced Forms (contractions).<br>4. Performance Variables (hesitations, pauses).<br>5. Colloquial Language (idioms).<br>6. Rate of Delivery.<br>7. Stress, Rhythm, Intonation.<br>8. Interaction.",
                    kor: "<b>듣기를 어렵게 만드는 요인:</b><br>1. 군집화(청크).<br>2. 잉여성(반복).<br>3. 축약형.<br>4. 수행 변인(주저함).<br>5. 구어체.<br>6. 속도.<br>7. 강세/억양.<br>8. 상호작용."
                },
                {
                    key: "4 Types of Listening & Tasks",
                    eng: "1. <b>Intensive:</b> Components (Phonemes).<br>2. <b>Responsive:</b> Short immediate response.<br>3. <b>Selective:</b> Scanning specific info (Cloze).<br>4. <b>Extensive:</b> Gist, main idea (Dictation).",
                    kor: "1. <b>집중적:</b> 구성요소(음소) 식별.<br>2. <b>반응적:</b> 짧은 응답.<br>3. <b>선택적:</b> 정보 탐색(빈칸 채우기).<br>4. <b>확장적:</b> 전체적 이해(받아쓰기, 필기)."
                }
            ]
        },
        {
            id: "ch7",
            title: "Assessing Speaking",
            subtitle: "말하기 평가",
            items: [
                {
                    key: "5 Types of Speaking",
                    eng: "1. <b>Imitative:</b> Repetition.<br>2. <b>Intensive:</b> Directed Response, Read-aloud.<br>3. <b>Responsive:</b> Short Q&A.<br>4. <b>Interactive:</b> Role Play, Interview (Transactional/Interpersonal).<br>5. <b>Extensive:</b> Monologue (Speech).",
                    kor: "1. <b>모방적:</b> 따라 말하기.<br>2. <b>집중적:</b> 지시된 응답, 낭독.<br>3. <b>반응적:</b> 질의응답.<br>4. <b>상호작용적:</b> 역할극, 인터뷰.<br>5. <b>확장적:</b> 독백(연설)."
                },
                {
                    key: "Information Gap",
                    eng: "A task where students must share missing information to complete a task. Promotes negotiation of meaning.",
                    kor: "학생들이 서로 부족한 정보를 공유하여 과제를 완성해야 하는 활동. 의미 협상을 촉진함."
                }
            ]
        },
        {
            id: "ch8",
            title: "Assessing Reading",
            subtitle: "읽기 평가",
            items: [
                {
                    key: "Micro vs. Macro Skills",
                    eng: "<b>Micro:</b> Bottom-up (graphemes, word order).<br><b>Macro:</b> Top-down (rhetorical forms, inference, scanning/skimming).",
                    kor: "<b>미시:</b> 상향식(자소, 어순).<br><b>거시:</b> 하향식(수사적 형식, 추론, 스캐닝/스키밍)."
                },
                {
                    key: "4 Types of Reading",
                    eng: "1. <b>Perceptive:</b> Letters, words.<br>2. <b>Selective:</b> Lexical/grammar features.<br>3. <b>Interactive:</b> Negotiating meaning (Cloze).<br>4. <b>Extensive:</b> Global understanding.",
                    kor: "1. <b>지각적:</b> 문자 인식.<br>2. <b>선택적:</b> 어휘/문법 확인.<br>3. <b>상호작용적:</b> 의미 협상(클로즈).<br>4. <b>확장적:</b> 긴 글 이해."
                }
            ]
        },
        {
            id: "ch9",
            title: "Assessing Writing",
            subtitle: "쓰기 평가",
            items: [
                {
                    key: "4 Types of Writing",
                    eng: "1. <b>Imitative:</b> Spelling.<br>2. <b>Intensive:</b> Grammar focus (Dictation, Dicto-comp).<br>3. <b>Responsive:</b> Paragraphs.<br>4. <b>Extensive:</b> Essays.",
                    kor: "1. <b>모방적:</b> 철자.<br>2. <b>집중적:</b> 문법 초점(딕토콤프).<br>3. <b>반응적:</b> 단락 연결.<br>4. <b>확장적:</b> 에세이."
                },
                {
                    key: "Dicto-comp",
                    eng: "Learners listen to a text and rewrite it from memory using keywords. Bridges listening and writing.",
                    kor: "텍스트를 들은 후 기억과 키워드를 활용해 다시 작성하는 과업. 듣기와 쓰기를 연결함."
                },
                {
                    key: "Scoring Methods",
                    eng: "<b>Holistic:</b> Single score (Fast).<br><b>Primary-Trait:</b> Focus on function.<br><b>Analytic:</b> Sub-scores (Detailed feedback).",
                    kor: "<b>총체적:</b> 단일 점수(빠름).<br><b>주요 특성:</b> 기능/목적 초점.<br><b>분석적:</b> 요소별 점수(상세 피드백)."
                }
            ]
        },
        {
            id: "ch10",
            title: "Grammar & Vocabulary",
            subtitle: "문법 및 어휘 평가",
            items: [
                {
                    key: "Assessing Grammar",
                    eng: "<b>Knowledge:</b> Form (accuracy) + Meaning (meaningfulness) + Use (pragmatic appropriateness).<br><b>Tasks:</b> Gap-filling, Multiple-choice, Information Gap (Communicative).",
                    kor: "<b>지식:</b> 형태(정확성) + 의미(의미성) + 사용(화용적 적절성).<br><b>과업:</b> 빈칸 채우기, 선다형, 정보 공백(의사소통적)."
                },
                {
                    key: "Assessing Vocabulary",
                    eng: "<b>Nature:</b> High-frequency vs. Low-frequency words. Receptive vs. Productive. Context is crucial for validity.",
                    kor: "<b>본질:</b> 고빈도 vs 저빈도 어휘. 수용적 vs 산출적. 타당도를 위해 문맥(Context)이 중요함."
                }
            ]
        },
        {
            id: "ch11",
            title: "Grading",
            subtitle: "성적 산출 및 평가",
            items: [
                {
                    key: "Grading Philosophy",
                    eng: "Grades should primarily reflect <b>Achievement</b>. Effort/Behavior can be included but weighted carefully.",
                    kor: "성적은 주로 <b>성취도</b>를 반영해야 함. 노력/태도는 포함될 수 있으나 왜곡 방지를 위해 신중히 가중치를 두어야 함."
                },
                {
                    key: "Calculating Grades",
                    eng: "<b>Absolute:</b> Criterion-referenced (Standards).<br><b>Relative:</b> Norm-referenced (Curve).",
                    kor: "<b>절대평가:</b> 기준 점수 도달 여부.<br><b>상대평가:</b> 석차 기준(곡선 등급)."
                },
                {
                    key: "Rubrics",
                    eng: "<b>Holistic:</b> Single global score.<br><b>Analytic:</b> Separate scores for different criteria (e.g., content, organization).",
                    kor: "<b>총체적 루브릭:</b> 단일 종합 점수.<br><b>분석적 루브릭:</b> 기준별(내용, 조직 등) 별도 점수."
                }
            ]
        },
        {
            id: "ch12",
            title: "Beyond Letter Grading",
            subtitle: "성적 그 이상의 평가",
            items: [
                {
                    key: "Alternatives to Grading",
                    eng: "Self & Peer Assessment, Portfolios, Narrative Evaluations, Conferences.",
                    kor: "자기/동료 평가, 포트폴리오, 서술형 평가, 면담."
                },
                {
                    key: "Portfolios (CRADLE)",
                    eng: "<b>C</b>ollecting, <b>R</b>eflecting, <b>A</b>ssessing, <b>D</b>ocumenting, <b>L</b>inking, <b>E</b>valuating.",
                    kor: "수집, 성찰, 평가, 문서화, 연결, 평가."
                },
                {
                    key: "Self & Peer Assessment",
                    eng: "Promotes autonomy and intrinsic motivation. Students learn to monitor their own progress.",
                    kor: "자율성과 내재적 동기를 촉진함. 학생들이 자신의 진척도를 모니터링하는 법을 배움."
                }
            ]
        }
    ];

    // ==========================================
    // APP LOGIC
    // ==========================================
    const app = {
        init: function() {
            this.renderNav();
            this.renderContent();
            this.setupScrollEvents();
        },

        renderNav: function() {
            const nav = document.getElementById('nav-scroller');
            examData.forEach(ch => {
                const btn = document.createElement('button');
                btn.className = 'nav-btn';
                btn.textContent = ch.id.replace('ch', 'Ch ');
                btn.onclick = () => this.scrollTo(ch.id, btn);
                nav.appendChild(btn);
            });
        },

        renderContent: function() {
            const container = document.getElementById('main-container');
            
            examData.forEach(ch => {
                // Card
                const card = document.createElement('div');
                card.className = 'chapter-card';
                card.id = ch.id;

                // Header
                const header = document.createElement('div');
                header.className = 'chapter-header';
                header.onclick = () => this.toggleChapter(card);

                const titleGroup = document.createElement('div');
                titleGroup.className = 'chapter-title-group';

                const label = document.createElement('span');
                label.className = 'chapter-label';
                label.textContent = ch.id.replace('ch', 'Chapter ');

                const name = document.createElement('span');
                name.className = 'chapter-name';
                name.textContent = ch.title;

                const sub = document.createElement('span');
                sub.className = 'chapter-subtitle';
                sub.textContent = ch.subtitle;

                titleGroup.appendChild(label);
                titleGroup.appendChild(name);
                titleGroup.appendChild(sub);

                const icon = document.createElement('div');
                icon.className = 'toggle-icon';
                icon.innerHTML = '<i class="fas fa-chevron-down"></i>';

                header.appendChild(titleGroup);
                header.appendChild(icon);
                card.appendChild(header);

                // Keyword List
                const content = document.createElement('div');
                content.className = 'chapter-content';
                const list = document.createElement('ul');
                list.className = 'keyword-list';

                ch.items.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'keyword-item';

                    const trigger = document.createElement('button');
                    trigger.className = 'keyword-trigger';
                    trigger.onclick = () => this.toggleKeyword(li);

                    const text = document.createElement('span');
                    text.className = 'keyword-text';
                    text.textContent = item.key;

                    const plus = document.createElement('span');
                    plus.className = 'plus-icon';
                    plus.innerHTML = '<i class="fas fa-plus"></i>';

                    trigger.appendChild(text);
                    trigger.appendChild(plus);

                    const detail = document.createElement('div');
                    detail.className = 'keyword-detail';
                    
                    const inner = document.createElement('div');
                    inner.className = 'detail-inner';

                    // English
                    const engRow = document.createElement('div');
                    engRow.className = 'content-row';
                    const engBox = document.createElement('div');
                    engBox.className = 'lang-box eng';
                    engBox.innerHTML = `<span class="lang-label">English</span><div class="text-content">${item.eng}</div>`;
                    engRow.appendChild(engBox);

                    // Korean
                    const korRow = document.createElement('div');
                    korRow.className = 'content-row';
                    const korBox = document.createElement('div');
                    korBox.className = 'lang-box kor';
                    korBox.innerHTML = `<span class="lang-label">Korean</span><div class="text-content">${item.kor}</div>`;
                    korRow.appendChild(korBox);

                    inner.appendChild(engRow);
                    inner.appendChild(korRow);

                    if(item.note) {
                        const note = document.createElement('div');
                        note.className = 'note-box';
                        note.innerHTML = `<i class="fas fa-lightbulb note-icon"></i><div><strong>Note:</strong> ${item.note}</div>`;
                        inner.appendChild(note);
                    }

                    detail.appendChild(inner);
                    li.appendChild(trigger);
                    li.appendChild(detail);
                    list.appendChild(li);
                });

                content.appendChild(list);
                card.appendChild(content);
                container.appendChild(card);
            });
        },

        toggleChapter: function(card) {
            card.classList.toggle('active');
            const list = card.querySelector('.keyword-list');
            const content = card.querySelector('.chapter-content');
            
            if (card.classList.contains('active')) {
                content.style.maxHeight = "5000px"; 
            } else {
                content.style.maxHeight = "0";
            }
        },

        toggleKeyword: function(li) {
            li.classList.toggle('open');
            const icon = li.querySelector('.plus-icon i');
            if(li.classList.contains('open')) {
                icon.classList.replace('fa-plus', 'fa-minus');
            } else {
                icon.classList.replace('fa-minus', 'fa-plus');
            }
        },

        expandAll: function() {
            document.querySelectorAll('.chapter-card').forEach(c => {
                c.classList.add('active');
                c.querySelector('.chapter-content').style.maxHeight = "5000px";
            });
            document.querySelectorAll('.keyword-item').forEach(k => {
                k.classList.add('open');
                k.querySelector('.plus-icon i').classList.replace('fa-plus', 'fa-minus');
            });
        },

        collapseAll: function() {
            document.querySelectorAll('.chapter-card').forEach(c => {
                c.classList.remove('active');
                c.querySelector('.chapter-content').style.maxHeight = "0";
            });
            document.querySelectorAll('.keyword-item').forEach(k => {
                k.classList.remove('open');
                k.querySelector('.plus-icon i').classList.replace('fa-minus', 'fa-plus');
            });
        },

        scrollTo: function(id, btn) {
            const el = document.getElementById(id);
            if(!el.classList.contains('active')) {
                this.toggleChapter(el);
            }
            
            // Update Nav State
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // Scroll Center
            btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });

            // Smooth Scroll to Element
            const offset = 160;
            const bodyRect = document.body.getBoundingClientRect().top;
            const elementRect = el.getBoundingClientRect().top;
            const elementPosition = elementRect - bodyRect;
            const offsetPosition = elementPosition - offset;

            window.scrollTo({
                top: offsetPosition,
                behavior: "smooth"
            });
        },

        setupScrollEvents: function() {
            const btn = document.getElementById('scrollTopBtn');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) btn.classList.add('visible');
                else btn.classList.remove('visible');
            });
        }
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        app.init();
        // Open first chapter by default
        setTimeout(() => app.toggleChapter(document.getElementById('ch1')), 100);
        // Set first nav btn active
        document.querySelector('.nav-btn').classList.add('active');
    });

</script>

</body>
</html>
