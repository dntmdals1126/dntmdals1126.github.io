<!DOCTYPE html>
<html lang="ko">
<head>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary)',
                        'primary-glow': 'var(--primary-glow)',
                        surface: 'var(--glass-surface)',
                        'text-main': 'var(--text-main)',
                        'text-sub': 'var(--text-sub)',
                        'glass-border': 'var(--glass-border)',
                        'highlight': '#fbbf24',
                    },
                    fontFamily: {
                        sans: ['"Google Sans Flex"', '"Pretendard"', 'sans-serif'],
                        logo: ['"Cal Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* --- WebHub CSS Variables --- */
        :root {
            --bg-dark: #050505; 
            --glass-surface: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.04);
            --header-bg: rgba(20, 20, 25, 0.6); 
            
            --primary: #3b82f6; 
            --primary-glow: rgba(59, 130, 246, 0.3);
            
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            
            --max-w: 1000px; 
            --header-max-w: 1100px;
            --radius-md: 22px;
            --header-h: 64px;
            
            --font-logo: 'Cal Sans', sans-serif;
            --font-base: 'Google Sans Flex', 'Pretendard', sans-serif;
            
            color-scheme: dark;
        }

        html[data-theme="light"] {
            --bg-dark: #f2f4f7; 
            --glass-surface: #ffffff; 
            --glass-border: #e2e8f0; 
            --glass-highlight: rgba(0, 0, 0, 0.03);
            --header-bg: rgba(255, 255, 255, 0.9);
            
            --primary: #2563eb; 
            --primary-glow: rgba(37, 99, 235, 0.15);
            
            --text-main: #1e293b;
            --text-sub: #64748b;
            --text-dim: #94a3b8;
            
            color-scheme: light;
        }

        /* 기본적으로 전체 선택 방지, 박스 사이징 */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            outline: none; 
            user-select: none; 
            -webkit-user-select: none; 
        }
        
        /* 입력창은 선택 가능하게 예외 처리 */
        input, textarea { 
            user-select: text !important; 
            -webkit-user-select: text !important; 
        }
        
        html {
            font-family: var(--font-base);
            background: var(--bg-dark);
            color: var(--text-main);
            overflow-y: scroll; 
            scroll-behavior: smooth;
            min-height: 100%;
        }
        
        body {
            margin: 0; 
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(20, 30, 40, 0.2), transparent 50%),
                        radial-gradient(circle at bottom right, rgba(20, 30, 40, 0.15), transparent 50%);
            background-attachment: fixed;
            transition: background 0.3s;
        }
        
        html[data-theme="light"] body {
            background: radial-gradient(circle at top left, rgba(0,0,0,0.02), transparent 50%);
            background-attachment: fixed;
        }

        button { font-family: inherit; cursor: pointer; }

        /* --- Animations --- */
        .blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; filter: blur(90px); opacity: 0.4; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; animation: float 25s infinite ease-in-out alternate; }
        .b1 { top: -20%; left: -10%; width: 60vw; height: 60vw; background: rgba(30, 40, 60, 0.2); }
        .b2 { bottom: -20%; right: -10%; width: 70vw; height: 70vw; background: rgba(20, 30, 40, 0.15); animation-delay: -5s; }
        
        html[data-theme="light"] .b1 { background: rgba(0,0,0,0.03); }
        html[data-theme="light"] .b2 { background: rgba(0,0,0,0.02); }
        
        .fade-in-up { animation: fadeInUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(10px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* --- Scroll Mask (Gradient Header) --- */
        .scroll-mask {
            position: fixed; top: 0; left: 0; right: 0; height: 140px;
            background: linear-gradient(to bottom, var(--bg-dark) 0%, rgba(5,5,5,0.8) 40%, transparent 100%);
            pointer-events: none; z-index: 900;
        }
        html[data-theme="light"] .scroll-mask {
            background: linear-gradient(to bottom, #f2f4f7 0%, rgba(242, 244, 247, 0.8) 40%, transparent 100%);
        }

        /* --- Header --- */
        header {
            position: fixed; 
            top: calc(16px + env(safe-area-inset-top)); 
            left: 50%; transform: translateX(-50%);
            width: calc(100% - 32px); max-width: var(--header-max-w); height: var(--header-h);
            z-index: 1000;
            background: var(--header-bg);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 99px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px;
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        .logo {
            display: flex; align-items: baseline; cursor: pointer;
            color: var(--text-main);
        }
        
        .header-tools { display: flex; gap: 8px; }
        .tool-btn {
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid transparent; background: transparent;
            color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        @media (hover: hover) {
            .tool-btn:hover { background: var(--glass-highlight); border-color: var(--glass-border); }
        }

        /* --- Main Layout --- */
        main { 
            max-width: var(--max-w); margin: 0 auto; 
            /* 헤더와 간격 넓힘 (110px) */
            padding: calc(110px + env(safe-area-inset-top)) 16px 60px; 
            position: relative; z-index: 1; 
        }

        .section-card {
            background: var(--glass-surface);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: var(--radius-md);
            padding: 20px; margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        
        /* --- Buttons & Chips --- */
        .btn {
            height: 48px; border-radius: 14px;
            font-weight: 600; font-size: 15px;
            border: 1px solid transparent; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
            padding: 0 20px;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-pri { background: var(--primary); color: white; }
        .btn-sec { background: rgba(255,255,255,0.08); color: var(--text-main); border: 1px solid var(--glass-border); }
        html[data-theme="light"] .btn-sec { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }

        .chip-nav {
            display: flex; gap: 8px; overflow-x: auto; 
            scrollbar-width: none; width: 100%;
            justify-content: flex-start;
        }
        .chip-nav::-webkit-scrollbar { display: none; }
        
        .chip {
            flex: 1; white-space: nowrap; text-align: center;
            padding: 10px 16px; border-radius: 12px;
            font-size: 15px; font-weight: 600;
            background: transparent;
            color: var(--text-sub); cursor: pointer;
            transition: all 0.2s;
        }
        .chip.active {
            background: var(--glass-highlight); color: var(--primary);
        }

        /* --- Vocab App Specifics --- */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        .flashcard-container {
            width: 100%; max-width: 500px; height: 350px;
            margin: 0 auto; position: relative; cursor: pointer;
        }
        .flashcard-inner {
            position: relative; w-full; h-full; transition: transform 0.6s;
            transform-style: preserve-3d; width: 100%; height: 100%;
        }
        .flashcard-face {
            position: absolute; w-full; h-full; 
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            width: 100%; height: 100%;
            border-radius: 20px;
            background: var(--glass-surface);
            border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .flashcard-face.back { transform: rotateY(180deg); background: rgba(59, 130, 246, 0.1); border-color: var(--primary); }
        html[data-theme="light"] .flashcard-face.back { background: #eff6ff; }

        .progress-bar-bg {
            background: rgba(255,255,255,0.1); border-radius: 99px; height: 8px; overflow: hidden;
        }
        html[data-theme="light"] .progress-bar-bg { background: #e2e8f0; }
        .progress-bar-fill {
            background: var(--primary); height: 100%; transition: width 0.5s ease;
        }

        /* Stats Box Slim */
        .stat-box {
            background: var(--glass-highlight);
            border-radius: 12px; padding: 12px 14px;
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            border: 1px solid var(--glass-border);
            height: 100%;
        }

        /* Highlight Class */
        .hl-text {
            background-color: rgba(251, 191, 36, 0.3);
            color: #fcd34d;
            border-radius: 2px;
            padding: 0 2px;
        }
        html[data-theme="light"] .hl-text {
            background-color: rgba(251, 191, 36, 0.4);
            color: #92400e;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 480px) {
            :root { --header-h: 60px; }
            header { 
                top: 0; width: 100%; border-radius: 0; 
                padding: env(safe-area-inset-top) 16px 0;
                height: calc(var(--header-h) + env(safe-area-inset-top));
                max-width: none; border: none; border-bottom: 1px solid var(--glass-border);
            }
            main { padding-top: calc(86px + env(safe-area-inset-top)); }
            .flashcard-container { height: 300px; }
            
            .stat-box {
                flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px;
                padding: 10px;
            }
            .stat-box .flex-row-wrap {
                width: 100%; display: flex; justify-content: space-between; align-items: center;
            }
        }
    </style>
</head>
<body>

    <!-- Scroll Mask Gradient -->
    <div class="scroll-mask"></div>

    <!-- Background Animation -->
    <div class="blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <!-- Header -->
    <header class="no-select">
        <div class="logo" onclick="location.reload()">
            <span class="text-xl font-bold font-sans">EngEd.</span>
            <span class="text-[10px] text-text-sub mx-2 opacity-70 font-sans" style="transform: translateY(1px);">powered by</span>
            <span class="text-[10px] font-logo text-text-sub opacity-90" style="transform: translateY(1px);">WebHub</span>
        </div>
        <div class="header-tools">
            <button class="tool-btn" onclick="resetData()" title="데이터 초기화">
                <i class="fa-solid fa-trash-can text-sm"></i>
            </button>
            <button class="tool-btn" id="themeToggle" title="테마 변경">
                <svg id="iconMoon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79Z"></path></svg>
                <svg id="iconSun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
            </button>
        </div>
    </header>

    <main>
        <!-- Nav Container (Closer to Header) -->
        <div class="section-card p-1.5 mb-6">
            <nav class="chip-nav no-select">
                <div class="chip active" onclick="switchTab('dashboard')" id="btn-dashboard">홈</div>
                <div class="chip" onclick="switchTab('flashcard')" id="btn-flashcard">플래시카드</div>
                <div class="chip" onclick="switchTab('quiz')" id="btn-quiz">퀴즈</div>
                <div class="chip" onclick="switchTab('mistake')" id="btn-mistake">오답노트</div>
            </nav>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="section-card flex flex-col items-center justify-center py-20 text-text-sub">
            <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-4 text-primary"></i>
            <p>데이터 로딩 중...</p>
        </div>

        <!-- 1. Home (Dashboard + Stats + List) -->
        <div id="view-dashboard" class="hidden fade-in-up space-y-6">
            <!-- Combined Dashboard Section -->
            <section class="section-card flex flex-col gap-4 p-4">
                <!-- Progress -->
                <div class="flex flex-col justify-center">
                    <div class="flex justify-between items-end mb-1">
                        <span class="text-xs font-bold text-text-sub uppercase tracking-wider">Total Progress</span>
                        <span id="progressText" class="text-sm font-bold text-primary">0%</span>
                    </div>
                    <div class="progress-bar-bg h-2">
                        <div id="progressBar" class="progress-bar-fill" style="width: 0%"></div>
                    </div>
                </div>
                
                <!-- Stats Grid (Slim & Horizontal Layout) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div class="stat-box">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-blue-500/10 text-blue-500 flex items-center justify-center">
                                <i class="fa-solid fa-database text-xs"></i>
                            </div>
                            <span class="text-xs text-text-sub font-bold uppercase">Total</span>
                        </div>
                        <span class="text-lg font-bold text-text-main" id="statTotal">0</span>
                    </div>
                    
                    <div class="stat-box">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-green-500/10 text-green-500 flex items-center justify-center">
                                <i class="fa-solid fa-check text-xs"></i>
                            </div>
                            <span class="text-xs text-text-sub font-bold uppercase">Done</span>
                        </div>
                        <span class="text-lg font-bold text-green-500" id="statMemorized">0</span>
                    </div>
                    
                    <div class="stat-box">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center">
                                <i class="fa-solid fa-book-open text-xs"></i>
                            </div>
                            <span class="text-xs text-text-sub font-bold uppercase">Review</span>
                        </div>
                        <span class="text-lg font-bold text-red-500" id="statMistakes">0</span>
                    </div>
                </div>
            </section>

            <!-- List Table -->
            <section class="section-card p-0 overflow-hidden">
                <div class="p-3 border-b border-[var(--glass-border)] flex flex-col gap-2 bg-[var(--glass-highlight)]">
                    <div class="flex items-center gap-2">
                         <i class="fa-solid fa-search text-text-dim ml-1"></i>
                         <input type="text" id="searchInput" placeholder="단어, 뜻 검색..." onkeyup="renderListTable()" 
                            class="flex-1 bg-transparent border-none focus:ring-0 text-text-main placeholder-text-dim text-sm font-medium p-0">
                         <button onclick="toggleSort()" class="btn btn-sec h-8 px-3 text-xs whitespace-nowrap" id="sortBtn">
                            <i class="fa-solid fa-arrow-down-a-z mr-1"></i> 정렬
                         </button>
                    </div>
                </div>
                <div class="overflow-x-auto max-h-[500px]">
                    <table class="w-full text-left border-collapse table-fixed">
                        <thead class="bg-[var(--glass-surface)] sticky top-0 z-10 text-xs uppercase text-text-dim font-bold">
                            <tr>
                                <th class="px-2 py-3 text-center w-8">#</th>
                                <th class="px-2 py-3 text-center w-8"><i class="fa-solid fa-check"></i></th>
                                <th class="px-2 py-3 w-[25%]">Term</th>
                                <th class="px-2 py-3 w-auto">Definition</th>
                            </tr>
                        </thead>
                        <tbody id="wordListBody" class="divide-y divide-[var(--glass-border)] text-sm text-text-main">
                            <!-- 로드됨 -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>

        <!-- 2. Flashcard -->
        <div id="view-flashcard" class="hidden fade-in-up flex flex-col items-center">
            <!-- Controls Top -->
            <div class="w-full max-w-[500px] flex justify-end items-center mb-4 px-2 h-8">
                <label class="flex items-center gap-2 cursor-pointer bg-[var(--glass-surface)] px-3 py-1.5 rounded-full border border-[var(--glass-border)] hover:bg-[var(--glass-highlight)] transition">
                    <input type="checkbox" id="fc-memorized-check" class="accent-primary w-4 h-4 rounded-full">
                    <span class="text-xs font-bold text-text-sub uppercase">Memorized</span>
                </label>
            </div>

            <!-- Card -->
            <div class="flashcard-container perspective-1000" onclick="flipCard()">
                <div id="flashcard-inner" class="flashcard-inner transform-style-3d duration-500">
                    <!-- Front -->
                    <div class="flashcard-face backface-hidden">
                        <span class="text-xs text-primary font-bold uppercase tracking-widest mb-4 font-sans">Term</span>
                        <h2 id="fc-front" class="text-3xl md:text-4xl font-bold text-text-main break-words px-4 font-sans">Loading...</h2>
                        <div class="mt-8 text-text-dim text-xs flex items-center gap-1 animate-pulse font-sans">
                            <i class="fa-solid fa-arrow-pointer"></i> 탭하여 뜻 확인
                        </div>
                    </div>
                    <!-- Back -->
                    <div class="flashcard-face back rotate-y-180 backface-hidden">
                        <div class="overflow-y-auto w-full max-h-full px-2 no-scrollbar">
                            <span class="text-xs text-primary font-bold uppercase tracking-widest mb-2 block font-sans">Definition</span>
                            <h3 id="fc-back-ko" class="text-xl font-bold text-text-main mb-3 font-sans"></h3>
                            <p id="fc-back-def" class="text-text-sub italic mb-3 font-sans leading-relaxed"></p>
                            <p id="fc-back-def-ko" class="text-text-main text-sm font-medium font-sans"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="flex items-center gap-4 mt-8">
                <button onclick="prevCard()" class="btn btn-sec w-12 px-0 rounded-full" title="이전">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <button onclick="speakTerm()" class="btn btn-sec w-12 px-0 rounded-full text-primary" title="발음 듣기">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <button onclick="nextCard()" class="btn btn-pri w-12 px-0 rounded-full" title="다음">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- 3. Quiz -->
        <div id="view-quiz" class="hidden fade-in-up max-w-2xl mx-auto">
            <div id="quiz-game">
                <div class="flex justify-between items-end mb-4 px-1">
                    <span class="text-xs font-bold text-text-dim tracking-widest font-sans">QUESTION <span id="quiz-progress" class="text-text-main ml-1">1/10</span></span>
                    <span id="quiz-score" class="text-xs font-bold text-primary bg-[var(--glass-highlight)] px-2 py-1 rounded font-sans">0</span>
                </div>
                
                <div class="section-card mb-4 min-h-[140px] flex flex-col justify-center items-center text-center">
                    <p class="text-[10px] text-primary font-bold mb-3 uppercase tracking-widest border-b border-primary/20 pb-1 font-sans">Definition</p>
                    <p id="quiz-question" class="text-lg font-medium text-text-main leading-relaxed font-sans px-2">
                        문제 내용이 여기에 표시됩니다.
                    </p>
                </div>

                <div id="quiz-options" class="grid grid-cols-1 gap-3">
                    <!-- JS로 버튼 생성 -->
                </div>

                <div id="quiz-feedback" class="hidden mt-4 p-4 rounded-xl text-center font-bold text-text-main bg-[var(--glass-highlight)] border border-[var(--glass-border)] font-sans"></div>

                <button id="quiz-next-btn" onclick="nextQuizQuestion()" class="hidden btn btn-pri w-full mt-4 justify-center font-sans">
                    다음 문제 <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>
        </div>

        <!-- 5. Mistake -->
        <div id="view-mistake" class="hidden fade-in-up">
            <div class="flex justify-between items-center mb-4 px-1">
                <h2 class="text-lg font-bold text-text-main font-sans">오답 노트</h2>
                <button onclick="clearMistakes()" class="text-xs btn btn-sec h-8 px-3 font-sans">
                    모두 비우기
                </button>
            </div>

            <div id="mistake-container" class="space-y-3">
                <!-- 오답 카드 -->
            </div>
            
            <div id="mistake-empty" class="hidden flex flex-col items-center justify-center py-20 text-text-dim">
                <i class="fa-regular fa-face-smile text-4xl mb-3 opacity-50"></i>
                <p class="text-sm font-sans">오답 노트가 비어있습니다.</p>
            </div>
        </div>

        <footer class="no-select text-center py-6 text-xs text-text-sub mt-4 border-t border-[var(--glass-border)]">
            <span style="font-family: var(--font-base); font-weight: 600;">EngEd.</span>
            <span style="font-family: var(--font-base); opacity: 0.7; margin-left: 6px; margin-right: 2px;">powered by</span>
            <span style="font-family: var(--font-logo);">WebHub</span><br>
            <p style="margin: 4px 0 0; opacity: 0.7;">© 2025 Seungmin Woo. All rights reserved.</p>
        </footer>

    </main>

    <!-- JS Logic -->
    <script>
        // --- Theme Logic ---
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const iconMoon = document.getElementById('iconMoon');
        const iconSun = document.getElementById('iconSun');
        const savedTheme = localStorage.getItem('theme') || 'dark';

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'light') {
                iconSun.style.display = 'block';
                iconMoon.style.display = 'none';
            } else {
                iconSun.style.display = 'none';
                iconMoon.style.display = 'block';
            }
        }
        applyTheme(savedTheme);
        themeToggle.onclick = () => applyTheme(html.getAttribute('data-theme') === 'light' ? 'dark' : 'light');

        // --- App Logic ---
        let allWords = [];
        let appState = { memorized: {}, mistakes: [], currentIndex: 0 };
        let quizState = { questions: [], currentQIndex: 0, score: 0 };
        let isQuizActive = false;
        let sortOrder = 'asc'; 

        // --- TTS Voice Load (Improved for US English) ---
        let voices = [];
        function loadVoices() {
            voices = window.speechSynthesis.getVoices();
        }
        
        // 초기 로드 시도
        loadVoices();
        
        // 크롬 등 일부 브라우저는 비동기로 로드되므로 이벤트 리스너 추가
        if (window.speechSynthesis.onvoiceschanged !== undefined) {
            window.speechSynthesis.onvoiceschanged = loadVoices;
        }

        window.onload = async function() {
            loadLocalData();
            await fetchCSV();
            updateDashboard();
            switchTab('dashboard');
        };

        function loadLocalData() {
            const saved = localStorage.getItem('engVocabState');
            if (saved) appState = JSON.parse(saved);
        }
        function saveData() {
            localStorage.setItem('engVocabState', JSON.stringify(appState));
            updateProgress();
        }

        async function fetchCSV() {
            try {
                const response = await fetch('./영어.csv');
                if (!response.ok) throw new Error("CSV not found");
                const text = await response.text();
                parseCSV(text);
                document.getElementById('loadingState').classList.add('hidden');
                updateProgress();
                renderListTable(); 
            } catch (error) {
                console.error(error);
                document.getElementById('loadingState').innerHTML = `<p class="text-red-500">데이터 로드 실패</p>`;
            }
        }

        function parseCSV(text) {
            const lines = text.split(/\r\n|\n/);
            allWords = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                let matches = [];
                let match = '';
                let inQuotes = false;
                for (let char of line) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { matches.push(cleanCSVField(match)); match = ''; }
                    else match += char;
                }
                matches.push(cleanCSVField(match));
                
                let term, koTerm, def, koDef;
                
                const isFirstColNum = /^\d+$/.test(matches[0]);
                
                if (matches.length >= 5 && isFirstColNum) {
                    term = matches[1];
                    koTerm = matches[2];
                    def = matches[3];
                    koDef = matches[4];
                } else if (matches.length >= 4) {
                    if (isFirstColNum && matches[1]) {
                         term = matches[1];
                         koTerm = matches[2];
                         def = matches[3];
                         koDef = matches[4] || ""; 
                    } else {
                         term = matches[0];
                         koTerm = matches[1];
                         def = matches[2];
                         koDef = matches[3];
                    }
                }

                if (term && def) {
                    allWords.push({ term, koTerm, def, koDef });
                }
            }
        }
        function cleanCSVField(text) {
            let clean = text.trim();
            if (clean.startsWith('"') && clean.endsWith('"')) clean = clean.substring(1, clean.length - 1);
            return clean.replace(/""/g, '"');
        }

        // --- UI Control ---
        function switchTab(tabName) {
            document.querySelectorAll('main > div[id^="view-"]').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.chip').forEach(el => el.classList.remove('active'));
            
            const target = document.getElementById(`view-${tabName}`);
            const btn = document.getElementById(`btn-${tabName}`);
            if (target) target.classList.remove('hidden');
            if (btn) btn.classList.add('active');

            if (tabName === 'dashboard') {
                updateDashboard();
                renderListTable();
            }
            if (tabName === 'flashcard') loadFlashcard(appState.currentIndex);
            if (tabName === 'mistake') renderMistakes();
            
            if (tabName === 'quiz') {
                if (!isQuizActive) startQuiz();
            }
        }

        function updateProgress() {
            const total = allWords.length;
            if (total === 0) return;
            const memorizedCount = Object.keys(appState.memorized).length;
            const percentage = Math.round((memorizedCount / total) * 100);
            
            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('progressText').innerText = `${percentage}%`;
            
            document.getElementById('statTotal').innerText = total;
            document.getElementById('statMemorized').innerText = memorizedCount;
            document.getElementById('statMistakes').innerText = appState.mistakes.length;
        }
        function updateDashboard() { updateProgress(); }

        // --- Flashcard ---
        function loadFlashcard(index) {
            if (allWords.length === 0) return;
            if (index < 0) index = 0;
            if (index >= allWords.length) index = allWords.length - 1;
            
            appState.currentIndex = index;
            const word = allWords[index];
            
            document.getElementById('fc-front').innerText = word.term;
            document.getElementById('fc-back-ko').innerText = word.koTerm;
            document.getElementById('fc-back-def').innerText = word.def;
            document.getElementById('fc-back-def-ko').innerText = word.koDef;
            
            document.getElementById('flashcard-inner').classList.remove('rotate-y-180');
            
            const checkbox = document.getElementById('fc-memorized-check');
            checkbox.checked = !!appState.memorized[word.term];
            checkbox.onclick = function() { toggleMemorized(word.term, this.checked); };
        }

        function flipCard() { document.getElementById('flashcard-inner').classList.toggle('rotate-y-180'); }
        function nextCard() {
            if (appState.currentIndex < allWords.length - 1) loadFlashcard(appState.currentIndex + 1);
        }
        function prevCard() {
            if (appState.currentIndex > 0) loadFlashcard(appState.currentIndex - 1);
        }
        function toggleMemorized(term, isMemorized) {
            if (isMemorized) appState.memorized[term] = true;
            else delete appState.memorized[term];
            saveData();
        }
        function speakTerm() {
            const term = document.getElementById('fc-front').innerText;
            
            // 음성 목록이 비어있으면 다시 로드 시도
            if (voices.length === 0) {
                voices = window.speechSynthesis.getVoices();
            }

            const utterance = new SpeechSynthesisUtterance(term);
            utterance.lang = 'en-US'; // 기본 언어 설정
            
            // 영어 전용 음성 찾기 로직 강화
            // 1순위: Google US English (보통 품질 좋음)
            // 2순위: Microsoft US English
            // 3순위: Samantha (Mac)
            // 4순위: 이름에 'English' 또는 'US'가 들어가는 음성
            // 5순위: lang 속성이 'en-US'인 음성
            let preferredVoice = voices.find(v => v.name === 'Google US English') ||
                                 voices.find(v => v.name.includes('Microsoft') && v.lang === 'en-US') ||
                                 voices.find(v => v.name === 'Samantha') ||
                                 voices.find(v => (v.name.includes('English') || v.name.includes('US')) && v.lang.startsWith('en')) ||
                                 voices.find(v => v.lang === 'en-US');

            if (preferredVoice) {
                console.log("Selected Voice:", preferredVoice.name);
                utterance.voice = preferredVoice;
            } else {
                console.log("No specific US voice found, using default en-US");
            }
            
            window.speechSynthesis.speak(utterance);
        }

        // --- Quiz ---
        function startQuiz() {
            if (allWords.length < 4) { 
                document.getElementById('quiz-game').innerHTML = '<div class="text-center py-10">데이터 부족 (4개 이상 필요)</div>';
                return; 
            }
            isQuizActive = true;
            const quizCount = Math.min(10, allWords.length);
            const shuffled = [...allWords].sort(() => 0.5 - Math.random());
            quizState.questions = shuffled.slice(0, quizCount);
            quizState.currentQIndex = 0;
            quizState.score = 0;
            
            document.getElementById('quiz-score').innerText = `0`;
            document.getElementById('quiz-next-btn').classList.add('hidden');
            document.getElementById('quiz-feedback').classList.add('hidden');
            
            loadQuizQuestion();
        }

        function loadQuizQuestion() {
            const currentQ = quizState.questions[quizState.currentQIndex];
            document.getElementById('quiz-progress').innerText = `${quizState.currentQIndex + 1}/${quizState.questions.length}`;
            
            document.getElementById('quiz-question').innerHTML = 
                `<span class="text-xs text-primary font-bold block mb-2 font-sans">[${currentQ.koTerm}]</span>${currentQ.def}`;
            
            document.getElementById('quiz-feedback').classList.add('hidden');
            document.getElementById('quiz-next-btn').classList.add('hidden');
            
            let options = [currentQ];
            while (options.length < 4) {
                const r = allWords[Math.floor(Math.random() * allWords.length)];
                if (!options.includes(r)) options.push(r);
            }
            options.sort(() => 0.5 - Math.random());
            
            const container = document.getElementById('quiz-options');
            container.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-3 rounded-xl border border-[var(--glass-border)] bg-[var(--glass-highlight)] hover:bg-[var(--glass-border)] transition-all font-medium text-text-main flex items-center gap-3";
                btn.innerHTML = `<div class="w-6 h-6 rounded-full border border-text-dim flex items-center justify-center text-[10px] text-text-dim">●</div><span class="font-sans">${opt.term}</span>`;
                btn.onclick = () => checkAnswer(opt, currentQ, btn);
                container.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct, btnElement) {
            if (!document.getElementById('quiz-next-btn').classList.contains('hidden')) return;
            const feedback = document.getElementById('quiz-feedback');
            const btns = document.getElementById('quiz-options').children;
            
            feedback.classList.remove('hidden');
            for (let btn of btns) {
                btn.disabled = true;
                if (btn.innerText.includes(correct.term)) {
                    btn.classList.add('border-green-500', 'bg-green-500/10');
                    btn.querySelector('div').classList.add('bg-green-500', 'border-transparent', 'text-white');
                    btn.querySelector('div').innerHTML = '<i class="fa-solid fa-check"></i>';
                }
            }

            if (selected.term === correct.term) {
                quizState.score++;
                document.getElementById('quiz-score').innerText = `${quizState.score * 10}`;
                feedback.innerHTML = '<span class="text-green-500">정답입니다!</span>';
            } else {
                btnElement.classList.add('border-red-500', 'bg-red-500/10');
                btnElement.querySelector('div').classList.add('bg-red-500', 'border-transparent', 'text-white');
                btnElement.querySelector('div').innerHTML = '<i class="fa-solid fa-xmark"></i>';
                feedback.innerHTML = `<span class="text-red-500">오답! 정답은 '${correct.term}' 입니다.</span>`;
                addToMistakes(correct.term);
            }
            document.getElementById('quiz-next-btn').classList.remove('hidden');
        }

        function nextQuizQuestion() {
            quizState.currentQIndex++;
            if (quizState.currentQIndex < quizState.questions.length) loadQuizQuestion();
            else finishQuiz();
        }

        function finishQuiz() {
            isQuizActive = false;
            document.getElementById('quiz-game').innerHTML = `
                <div class="section-card text-center py-10">
                    <h2 class="text-xl font-bold text-text-main mb-2 font-sans">퀴즈 종료!</h2>
                    <p class="text-lg mb-6 font-sans">Total Score: <span class="text-primary font-bold">${quizState.score * 10}</span> / ${quizState.questions.length * 10}</p>
                    <div class="flex justify-center gap-3">
                        <button onclick="window.location.reload()" class="btn btn-pri font-sans">다시 하기</button>
                        <button onclick="switchTab('mistake')" class="btn btn-sec font-sans">오답 확인</button>
                    </div>
                </div>
            `;
        }

        // --- List & Mistake ---
        function toggleSort() {
            sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
            const btn = document.getElementById('sortBtn');
            btn.innerHTML = sortOrder === 'asc' ? '<i class="fa-solid fa-arrow-down-a-z mr-1"></i> 정렬' : '<i class="fa-solid fa-arrow-up-a-z mr-1"></i> 정렬';
            renderListTable();
        }

        function renderListTable() {
            const tbody = document.getElementById('wordListBody');
            if(!tbody) return;
            
            const query = document.getElementById('searchInput').value.trim();
            const queryLower = query.toLowerCase();
            
            tbody.innerHTML = '';
            
            // 1. Filter
            let filtered = allWords.filter(word => {
                if(!query) return true;
                return word.term.toLowerCase().includes(queryLower) || 
                       word.koTerm.includes(query) || 
                       word.def.toLowerCase().includes(queryLower);
            });

            // 2. Sort
            filtered.sort((a, b) => {
                if (query) {
                    const aExact = a.term.toLowerCase() === queryLower;
                    const bExact = b.term.toLowerCase() === queryLower;
                    if(aExact && !bExact) return -1;
                    if(!aExact && bExact) return 1;

                    const aTermHas = a.term.toLowerCase().includes(queryLower);
                    const bTermHas = b.term.toLowerCase().includes(queryLower);
                    if(aTermHas && !bTermHas) return -1;
                    if(!aTermHas && bTermHas) return 1;
                }
                const compare = a.term.localeCompare(b.term);
                return sortOrder === 'asc' ? compare : -compare;
            });

            // 3. Render
            filtered.forEach((word, idx) => {
                const isMemorized = appState.memorized[word.term];
                const tr = document.createElement('tr');
                if(isMemorized) tr.className = "bg-green-500/5";
                
                const highlight = (text) => {
                    if (!query || !text) return text;
                    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    return text.replace(regex, '<span class="hl-text">$1</span>');
                };

                tr.innerHTML = `
                    <td class="px-2 py-3 text-center text-text-dim text-xs font-sans">${idx + 1}</td>
                    <td class="px-2 py-3 text-center">
                        <input type="checkbox" ${isMemorized ? 'checked' : ''} class="w-4 h-4 accent-primary cursor-pointer rounded"
                            onchange="toggleListMemorized('${word.term.replace(/'/g, "\\'")}', this.checked, this)">
                    </td>
                    <td class="px-2 py-3 align-top">
                        <div class="font-bold text-text-main font-sans text-sm">${highlight(word.term)}</div>
                        <div class="text-xs text-text-sub font-sans opacity-80">${highlight(word.koTerm)}</div>
                    </td>
                    <td class="px-2 py-3 align-top">
                        <div class="text-xs text-text-sub font-sans mb-1 leading-relaxed">${highlight(word.def)}</div>
                        <div class="text-xs text-text-dim font-sans opacity-80 leading-relaxed">${highlight(word.koDef)}</div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function toggleListMemorized(term, checked, checkboxEl) {
            toggleMemorized(term, checked);
            const row = checkboxEl.closest('tr');
            if (checked) row.classList.add('bg-green-500/5');
            else row.classList.remove('bg-green-500/5');
        }

        function renderMistakes() {
            const container = document.getElementById('mistake-container');
            const emptyState = document.getElementById('mistake-empty');
            container.innerHTML = '';
            
            if (appState.mistakes.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }
            
            appState.mistakes.forEach(mistakeTerm => {
                const word = allWords.find(w => w.term === mistakeTerm);
                if (!word) return;
                
                const card = document.createElement('div');
                card.className = "section-card p-4 flex justify-between items-center mb-0 hover:border-red-500/30 transition-colors";
                card.innerHTML = `
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <h3 class="font-bold text-lg text-text-main font-sans">${word.term}</h3>
                            <span class="text-xs text-text-dim font-sans">${word.koTerm}</span>
                        </div>
                        <p class="text-sm text-text-sub font-sans">${word.def}</p>
                    </div>
                    <button onclick="removeMistake('${mistakeTerm}')" class="ml-4 w-10 h-10 rounded-full bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white transition flex items-center justify-center">
                        <i class="fa-solid fa-check"></i>
                    </button>
                `;
                container.appendChild(card);
            });
        }
        
        function removeMistake(term) {
            appState.mistakes = appState.mistakes.filter(t => t !== term);
            saveData();
            renderMistakes();
        }
        
        function clearMistakes() {
            if (confirm("정말 비우시겠습니까?")) {
                appState.mistakes = [];
                saveData();
                renderMistakes();
            }
        }
        
        function resetData() {
            if(confirm("모든 학습 기록(암기 상태, 오답 노트)을 초기화하시겠습니까?")) {
                localStorage.removeItem('engVocabState');
                location.reload();
            }
        }
    </script>
</body>
