    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary)',
                        surface: 'var(--glass-surface)',
                        'text-main': 'var(--text-main)',
                        'text-sub': 'var(--text-sub)',
                        'text-dim': 'var(--text-dim)',
                        'glass-border': 'var(--glass-border)',
                        highlight: '#fbbf24',
                    },
                    fontFamily: {
                        sans: ['"Google Sans Flex"', '"Pretendard"', 'sans-serif'],
                        logo: ['"Cal Sans"', 'sans-serif'],
                        kor: ['"Pretendard"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --bg-dark: #050505; 
            --glass-surface: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.04);
            --header-bg: rgba(20, 20, 25, 0.6); 
            --primary: #3b82f6; 
            --primary-glow: rgba(59, 130, 246, 0.3);
            
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            
            --header-h: 64px;
            --radius-md: 22px;
            color-scheme: dark;
        }

        html[data-theme="light"] {
            --bg-dark: #f2f4f7; 
            --glass-surface: #ffffff; 
            --glass-border: #e2e8f0; 
            --glass-highlight: rgba(0, 0, 0, 0.03);
            --header-bg: rgba(255, 255, 255, 0.9);
            --primary: #2563eb; 
            --text-main: #1e293b;
            --text-sub: #475569; 
            --text-dim: #64748b; 
            color-scheme: light;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(150,150,150,0.3); border-radius: 3px; }
        html[data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb:hover { background: rgba(150,150,150,0.5); }

        html {
            font-family: "Google Sans Flex", "Pretendard", sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            margin: 0; padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(20, 30, 40, 0.2), transparent 50%),
                        radial-gradient(circle at bottom right, rgba(20, 30, 40, 0.15), transparent 50%);
            background-color: var(--bg-dark);
            background-attachment: fixed;
            display: flex; flex-direction: column; align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        html[data-theme="light"] body {
            background: radial-gradient(circle at top left, rgba(0,0,0,0.02), transparent 50%);
            background-color: var(--bg-dark);
            background-attachment: fixed;
        }

        html, body {
            -webkit-user-select: auto;
            user-select: auto;
            -webkit-touch-callout: default;
        }

        .blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; filter: blur(90px); opacity: 0.4; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; animation: float 25s infinite ease-in-out alternate; }
        .b1 { top: -20%; left: -10%; width: 60vw; height: 60vw; background: rgba(30, 40, 60, 0.2); }
        .b2 { bottom: -20%; right: -10%; width: 70vw; height: 70vw; background: rgba(20, 30, 40, 0.15); animation-delay: -5s; }
        html[data-theme="light"] .b1 { background: rgba(0,0,0,0.03); }
        html[data-theme="light"] .b2 { background: rgba(0,0,0,0.02); }
        
        @keyframes float { 100% { transform: translate(5%, 5%); } }

        header { 
            position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); 
            width: calc(100% - 32px); max-width: 1100px; height: var(--header-h); z-index: 1000; 
            background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            border: 1px solid var(--glass-border); border-radius: 99px; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px; 
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.15); 
            transition: background-color 0.3s, border-color 0.3s;
        }
        html[data-theme="light"] header { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); }

        .logo { display: flex; align-items: baseline; cursor: pointer; color: var(--text-main); transition: color 0.3s; }
        .header-tools { display: flex; gap: 8px; align-items: center; }

        input[type="file"] { display: none; }

        .btn { 
            height: 40px; border-radius: 12px; font-weight: 600; font-size: 13px; 
            border: 1px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 0 16px; 
        }
        .btn:active { transform: scale(0.96); }
        .btn-pri { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }
        .btn-pri:hover { background: #2563eb; }
        .btn-sec { background: rgba(255,255,255,0.08); color: var(--text-main); border: 1px solid var(--glass-border); }
        .btn-sec:hover { background: rgba(255,255,255,0.12); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; transition: all 0.2s; }
        @media (hover: hover) and (pointer: fine) {
            .btn-danger:hover { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); }
        }
        html[data-theme="light"] .btn-sec { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }
        html[data-theme="light"] .btn-sec:hover { background: #e2e8f0; }
        
        .tool-icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--text-main); display: flex; align-items: center; justify-content: center; transition: all 0.2s; text-decoration: none; cursor: pointer; }
        @media (hover: hover) and (pointer: fine) {
            .tool-icon-btn:hover { background: var(--glass-highlight); border-color: var(--glass-border); }
        }

        .section-card { 
            background: var(--glass-surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            border: 1px solid var(--glass-border); border-radius: var(--radius-md); 
            padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            transition: background-color 0.3s, border-color 0.3s;
        }
        html[data-theme="light"] .section-card { box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        
        #actionCard {
            position: sticky;
            top: calc(var(--header-h) + 24px + env(safe-area-inset-top));
            z-index: 900;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        html[data-theme="light"] #actionCard { box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        .control-card {
            width: 100%; max-width: 720px; margin-top: 24px; 
            display: flex; flex-direction: column; gap: 24px;
        }
        
        .config-section { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; width: 100%; }
        .config-title { font-size: 14px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; opacity: 0.9; justify-content: flex-start; }

        .option-group { display: flex; gap: 16px; flex-wrap: wrap; background: var(--glass-highlight); padding: 12px; border-radius: 14px; border: 1px solid var(--glass-border); width: 100%; }
        .label-box { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-main); cursor: pointer; }
        .label-box input { accent-color: var(--primary); width: 16px; height: 16px; }

        .tag-stack { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
        .tag { 
            padding: 8px 16px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: var(--glass-highlight); color: var(--text-sub); font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .tag:hover { background: rgba(150, 150, 150, 0.15); color: var(--text-main); }
        .tag.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px var(--primary-glow); }

        /* =========================================
           A4 학습지 렌더링 영역
           ========================================= */
        #renderArea { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 40px 0; gap: 40px; }
        
        .sheet {
            width: 210mm; min-height: 297mm; padding: 15mm 20mm; box-sizing: border-box; 
            position: relative; display: flex; flex-direction: column; page-break-after: always;
            background: #ffffff !important; color: #111827 !important;
            border-radius: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        html[data-theme="light"] .sheet { box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        /* 외곽선 및 두께 미세 조정 (0.24px / 0.12px) */
        .sheet-header { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            border-bottom: 0.24px solid #111827 !important; padding-bottom: 12px; margin-bottom: 16px;
        }
        .sheet-header h1 { 
            margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.03em; font-family: "Pretendard", sans-serif; display: flex; align-items: baseline; gap: 8px;
        }
        .sheet-header .page-info { font-size: 14px; font-weight: 700; color: #6b7280; letter-spacing: 0; }
        
        .print-table { 
            width: 100%; border-collapse: collapse; table-layout: fixed; 
            border: 0.24px solid #111827 !important; margin-bottom: 0; background-color: #fff !important; 
        }
        .print-table tr { page-break-inside: avoid; } 
        
        .print-table th, .print-table td { 
            border: 0.12px solid #e5e7eb !important; padding: 10px 12px; font-size: 14px; line-height: 1.4; vertical-align: middle; 
            word-break: keep-all !important; overflow-wrap: break-word !important; color: #111827 !important; 
        }
        .print-table th { 
            background: #f8fafc !important; color: #475569 !important; font-size: 11.5px; font-weight: 800; 
            text-align: center; text-transform: uppercase; border-bottom: 0.24px solid #111827 !important; letter-spacing: 0.03em;
        }

        .col-vocabulary { font-weight: 800; font-size: 15.5px; color: #111827 !important; text-align: center; }
        .col-meaning { font-weight: 500; font-size: 14px; }
        .col-synonyms { font-size: 12px; color: #4b5563 !important; }
        
        .badge-synonym { 
            display: inline-block; background: #f8fafc !important; padding: 3px 8px; border-radius: 6px; 
            font-size: 11px; margin: 2px 3px 2px 0; color: #475569 !important; border: 1px solid #e2e8f0 !important; font-weight: 600; 
        }
        .bullet-point { color: #6b7280 !important; font-size: 11px; margin-right: 8px; font-weight: 900; }
        
        .test-no { 
            text-align: center; color: #4b5563 !important; font-size: 13px; font-weight: 900; 
            background: #f1f5f9 !important; white-space: nowrap !important;
        }
        .ans-highlight { color: #dc2626 !important; font-weight: 800; }

        .status-mask { position: fixed; inset: 0; background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(8px); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .status-mask.active { display: flex; }
        .spinner { width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @keyframes modalPopIn {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-card { animation: modalPopIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        
        /* 펄스 애니메이션 수정: 바깥으로 퍼져나가는 형태 */
        @keyframes iconPulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .icon-pulse { animation: iconPulse 1.5s infinite cubic-bezier(0.4, 0, 0.6, 1); border-radius: 50%; }

        @media print {
            :root, html, body {
                color-scheme: light !important; background: #ffffff !important; background-color: #ffffff !important; background-image: none !important;
                margin: 0 !important; padding: 0 !important;
            }
            @page { size: A4 portrait; margin: 0 !important; }
            html, body { height: auto !important; overflow: visible !important; }
            .app-header, .control-card, #actionCard, .status-mask, .blobs, #warningModal { display: none !important; }
            #renderArea { padding: 0 !important; width: 210mm !important; display: block !important; gap: 0 !important; background: transparent !important; margin: 0 auto !important; }
            
            .sheet { 
                box-shadow: none !important; border: none !important; width: 210mm !important; 
                height: 296.5mm !important; max-height: 297mm !important;
                padding: 15mm 20mm !important; margin: 0 auto !important; border-radius: 0 !important; background: #ffffff !important;
                overflow: hidden !important; 
                page-break-after: always !important;
                page-break-inside: avoid !important;
            }
            .sheet:last-child { page-break-after: avoid !important; break-after: avoid !important; }
            .img-overlay { display: none !important; }
        }

        html.pdf-export-active, body.pdf-export-active { 
            color-scheme: light !important; background: #ffffff !important; background-color: #ffffff !important; background-image: none !important; width: 100% !important; overflow: visible !important; height: auto !important; 
            margin: 0 !important; padding: 0 !important;
        }
        body.pdf-export-active .blobs, body.pdf-export-active .app-header, body.pdf-export-active .control-card, body.pdf-export-active #actionCard, body.pdf-export-active #warningModal { display: none !important; }
        body.pdf-export-active #renderArea { width: 210mm !important; padding: 0 !important; margin: 0 auto !important; display: block !important; gap: 0 !important; background: transparent !important; }
        
        body.pdf-export-active .sheet { 
            box-shadow: none !important; width: 210mm !important; margin: 0 auto !important; border: none !important; 
            padding: 15mm 20mm !important; height: 296.5mm !important; max-height: 297mm !important; border-radius: 0 !important; 
            background: #ffffff !important; overflow: hidden !important;
            page-break-after: always !important; break-after: page !important;
            page-break-inside: avoid !important;
        }
        body.pdf-export-active .sheet:last-child { page-break-after: avoid !important; break-after: avoid !important; }
        body.pdf-export-active .img-overlay { display: none !important; }

        @media (max-width: 640px) {
            :root { --header-h: 60px; }
            header { 
                top: 0; width: 100%; border-radius: 0; max-width: none; border-left: none; border-right: none; border-top: none; 
                padding: env(safe-area-inset-top) 16px 0; 
                height: calc(var(--header-h) + env(safe-area-inset-top));
                border-bottom: 1px solid var(--glass-border);
            }
            .logo span:last-child { transform: translateY(1px); }
            
            #actionCard { margin-top: calc(80px + env(safe-area-inset-top)); top: calc(var(--header-h) + 12px + env(safe-area-inset-top)); }
            
            .control-card { 
                margin: 16px auto 0; padding: 20px; border-radius: 16px; 
                border-left: 1px solid var(--glass-border); 
                border-right: 1px solid var(--glass-border); 
                width: calc(100% - 32px); 
            }
            .sheet { transform: scale(0.9); transform-origin: top center; margin-bottom: -15%; }
        }
    </style>
</head>
<body>

    <div class="blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <!-- PDF 로딩 오버레이 -->
    <div id="statusOverlay" class="status-mask">
        <div class="spinner"></div>
        <div class="text-lg font-bold text-white tracking-wide">PDF를 생성하고 있습니다.</div>
        <div class="text-sm mt-2 text-text-sub" style="color: #94a3b8;">파일 안정성 검증 및 페이지 레이아웃 조정 중...</div>
    </div>

    <!-- 경고 모달 (인쇄/PDF 클릭 시 호출) -->
    <div id="warningModal" class="status-mask" style="z-index: 10000; display: none; touch-action: none; user-select: none; -webkit-user-select: none;">
        <div class="section-card modal-card max-w-sm w-[90%] flex flex-col items-center text-center p-6 gap-4">
            <div class="icon-pulse w-12 h-12 flex items-center justify-center text-red-500 mb-2">
                <i data-lucide="alert-triangle" class="w-7 h-7 relative z-10"></i>
            </div>
            <h3 class="text-lg font-bold text-text-main">저장 및 인쇄 오류 주의</h3>
            <p class="text-sm text-text-sub leading-relaxed">
                Day를 5개 이상 한 번에 처리할 경우<br>저장 및 인쇄 시 오류가 발생할 수 있습니다.<br>안정성을 위해 가급적 나누어 처리해 주세요.
            </p>
            <div class="flex items-center gap-2 mt-2">
                <input type="checkbox" id="hideWarningToday" class="w-4 h-4 accent-primary cursor-pointer">
                <label for="hideWarningToday" class="text-xs text-text-dim cursor-pointer font-bold">오늘 하루 안 보기</label>
            </div>
            <div class="flex gap-2 w-full mt-2">
                <button class="btn btn-sec flex-1 !h-[42px]" onclick="document.getElementById('warningModal').style.display='none'; pendingExportType=null;">취소</button>
                <button class="btn btn-pri flex-1 !h-[42px]" onclick="proceedExport()">무시하고 진행</button>
            </div>
        </div>
    </div>

    <header class="app-header">
        <div class="logo no-select" onclick="location.reload()">
            <span class="text-xl font-logo font-semibold italic tracking-tight">Enged<span class="text-highlight">.</span></span>

                <svg id="iconSun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">

                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>

    <div class="section-card w-fit mx-auto flex flex-wrap items-center justify-center gap-3 py-3 px-5 transition-colors border border-[var(--glass-border)]" id="actionCard" style="margin-top: calc(100px + env(safe-area-inset-top)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);">
        <!-- 버튼 순서: 업로드, 인쇄, PDF 저장, 초기화 -->
        <label for="csvFileInput" id="uploadLabel" class="btn btn-sec cursor-pointer mb-0">

        <div class="config-section" id="testConfigArea" style="display: none;">
            <div class="config-title"><i data-lucide="settings-2" class="w-4 h-4 text-primary"></i> 시험지 세부 옵션</div>

                <label class="label-box"><input type="checkbox" id="chkIncludeSyn"> 동의어 포함</label>

                <label class="label-box"><input type="checkbox" id="chkMergePool"> 여러 Day 통합 출제</label>

                    <label class="label-box"><input type="radio" name="qLimit" value="10"> 10</label>
                    <label class="label-box"><input type="radio" name="qLimit" value="20"> 20</label>
                    <label class="label-box"><input type="radio" name="qLimit" value="30"> 30</label>
                    <label class="label-box"><input type="radio" name="qLimit" value="all" checked> 전체</label>
                </div>
            </div>

        <div class="config-section">
            <div class="flex items-center justify-between w-full mb-1">
                <div class="config-title w-auto">
                    <i data-lucide="check-square" class="w-4 h-4 text-primary"></i> 학습 대상 Day 선택
                    <!-- 복수 선택 토글 -->
                    <label class="flex items-center gap-1.5 ml-3 px-2 py-0.5 rounded bg-[var(--glass-highlight)] border border-[var(--glass-border)] cursor-pointer hover:bg-[var(--glass-border)] transition-colors">
                        <input type="checkbox" id="chkMultiSelect" class="accent-primary w-3 h-3 cursor-pointer">
                        <span class="text-[11px] font-bold text-text-sub">복수 선택</span>
                    </label>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="selectAllDays()" class="text-[11px] font-bold px-2.5 py-1.5 bg-[var(--glass-highlight)] hover:bg-[var(--glass-border)] border border-[var(--glass-border)] rounded-md text-text-main transition-colors">전체 선택</button>
                    <button onclick="deselectAllDays()" class="text-[11px] font-bold px-2.5 py-1.5 bg-[var(--glass-highlight)] hover:bg-[var(--glass-border)] border border-[var(--glass-border)] rounded-md text-text-main transition-colors">전체 해제</button>
                </div>

    <main id="renderArea">
        <div style="padding: calc(100px + env(safe-area-inset-top)) 20px 100px; text-align: center; color: var(--text-sub);" id="emptyStateArea">
            <div class="w-16 h-16 rounded-full bg-[var(--glass-highlight)] flex items-center justify-center mx-auto mb-6 pointer-events-none">
                <i data-lucide="file-spreadsheet" class="w-8 h-8 text-primary opacity-80"></i>
            </div>
            <h2 class="text-lg font-bold text-text-main mb-2 pointer-events-none">데이터를 업로드해 주세요</h2>
            <p class="text-sm font-medium opacity-80 pointer-events-none">상단의 버튼을 누르거나 화면에 CSV 파일을 드래그하면<br>단어장이 자동으로 렌더링됩니다.</p>
        </div>
    </main>

    <script>
        const htmlRoot = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const iconMoon = document.getElementById('iconMoon');
        const iconSun = document.getElementById('iconSun');
        const savedTheme = localStorage.getItem('theme') || 'dark';

        function applyTheme(theme) {
            htmlRoot.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'light') { 
                iconSun.style.display = 'block'; 
                iconMoon.style.display = 'none'; 
            } else { 
                iconSun.style.display = 'none'; 
                iconMoon.style.display = 'block'; 
            }
        }
        applyTheme(savedTheme);
        themeToggle.onclick = () => applyTheme(htmlRoot.getAttribute('data-theme') === 'light' ? 'dark' : 'light');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });
        function preventDefaults (e) { e.preventDefault(); e.stopPropagation(); }

        ['dragenter', 'dragover'].forEach(eventName => { document.body.addEventListener(eventName, highlight, false); });
        ['dragleave', 'drop'].forEach(eventName => { document.body.addEventListener(eventName, unhighlight, false); });

        function highlight(e) {
            const actionCard = document.getElementById('actionCard');
            if(actionCard) { actionCard.style.borderColor = 'var(--primary)'; actionCard.style.backgroundColor = 'rgba(59, 130, 246, 0.1)'; }
        }
        function unhighlight(e) {
            const actionCard = document.getElementById('actionCard');
            if(actionCard) { actionCard.style.borderColor = ''; actionCard.style.backgroundColor = ''; }
        }

        document.body.addEventListener('drop', handleDrop, false);
        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            if(files.length > 0) {
                const file = files[0];
                if(file.name.toLowerCase().endsWith('.csv')) { processFile(file); } 
                else { alert("CSV 파일만 업로드 가능합니다."); }
            }
        }

        window.onload = () => {
            lucide.createIcons();
            const savedCSV = localStorage.getItem('savedVocabCSV');
            if (savedCSV) { parseCSVString(savedCSV); }
        };

        function clearLocalData() {
            if(confirm("저장된 단어장 데이터를 기기에서 초기화하시겠습니까?")) {
                localStorage.removeItem('savedVocabCSV');
                location.reload();
            }
        }

        let vocabRepository = {};
        let selectedDays = new Set();
        let overlayTimeoutId = null;

        document.getElementById('csvFileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            processFile(file);
        };

        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                try { localStorage.setItem('savedVocabCSV', text); } catch(err) {}
                parseCSVString(text);
            };
            reader.readAsText(file);
        }

        function parseCSVString(text) {
            Papa.parse(text, { header: true, skipEmptyLines: true, complete: (res) => { processRawData(res.data); } });
        }

        function processRawData(data) {
            vocabRepository = {};
            const availableDays = new Set();
            data.forEach(row => {
                const d = row['Day']?.trim();
                if (!d) return;
                availableDays.add(d);
                if (!vocabRepository[d]) vocabRepository[d] = [];
                const mRaw = (row['Meaning (KR)'] || '').split(';').map(s => s.trim()).filter(Boolean);
                const sRaw = (row['Synonyms'] || '').split(';').map(s => s.trim()).filter(Boolean);
                const maxLen = Math.max(mRaw.length, sRaw.length, 1);
                const entries = [];
                for (let i = 0; i < maxLen; i++) { 
                    entries.push({ meaning: mRaw[i] || '', synonym: sRaw[i] || '' }); 
                }
                vocabRepository[d].push({ word: row['Word']?.trim() || '', entries });
            });
            const sorted = [...availableDays].sort((a, b) => parseInt(a) - parseInt(b));
            
            // 초기 화면: 아무것도 선택되지 않은 상태가 기본
            selectedDays.clear(); 
            
            updateDayTags(sorted);
            
            document.getElementById('uploadLabel').style.display = 'none'; 
            document.getElementById('resetDataBtn').style.display = 'inline-flex'; 
            document.getElementById('configCard').style.display = 'flex';
            document.getElementById('printBtn').style.display = 'inline-flex';
            document.getElementById('pdfBtnTrigger').style.display = 'inline-flex';
            document.getElementById('emptyStateArea').style.display = 'none';
            updateView();
        }

        function updateDayTags(days) {
            const container = document.getElementById('tagStack');
            container.innerHTML = '';
            days.forEach(d => {
                const tag = document.createElement('div');
                tag.className = `tag ${selectedDays.has(d) ? 'active' : ''}`;
                tag.textContent = `Day ${d}`;
                tag.onclick = () => {
                    const isMulti = document.getElementById('chkMultiSelect').checked;
                    
                    if (!isMulti) {
                        if (selectedDays.has(d)) {
                            selectedDays.delete(d); 
                        } else {
                            selectedDays.clear(); 
                            selectedDays.add(d);  
                        }
                    } else {
                        if (selectedDays.has(d)) {
                            selectedDays.delete(d); 
                        } else {
                            selectedDays.add(d);
                        }
                    }
                    
                    updateView();
                    updateDayTags(days);
                };
                container.appendChild(tag);
            });
        }

        function selectAllDays() {
            const availableDays = Object.keys(vocabRepository).sort((a, b) => parseInt(a) - parseInt(b));
            if (availableDays.length === 0) return;
            
            document.getElementById('chkMultiSelect').checked = true;
            availableDays.forEach(d => selectedDays.add(d));
            updateDayTags(availableDays);
            updateView();
        }

        function deselectAllDays() {
            const availableDays = Object.keys(vocabRepository).sort((a, b) => parseInt(a) - parseInt(b));
            selectedDays.clear();
            updateDayTags(availableDays);
            updateView();
        }

        let pendingExportType = null;

        function handleExport(type) {
            const hideWarningDate = localStorage.getItem('hideWarningDate');
            const today = new Date().toDateString();
            
            if (selectedDays.size >= 5 && hideWarningDate !== today) {
                pendingExportType = type;
                document.getElementById('warningModal').style.display = 'flex';
            } else {
                executeExport(type);
            }
        }

        function executeExport(type) {
            if (type === 'print') {
                window.print();
            } else if (type === 'pdf') {
                document.getElementById('realPdfBtn').click();
            }
        }

        function proceedExport() {
            const chk = document.getElementById('hideWarningToday');
            if (chk && chk.checked) {
                localStorage.setItem('hideWarningDate', new Date().toDateString());
            }
            document.getElementById('warningModal').style.display = 'none';
            if (pendingExportType) {
                executeExport(pendingExportType);
            }
            pendingExportType = null;
        }

        document.querySelectorAll('input[name="viewMode"]').forEach(r => r.onchange = (e) => {
            document.getElementById('testConfigArea').style.display = e.target.value === 'test' ? 'flex' : 'none';
            updateView();
        });
        document.getElementById('chkIncludeSyn').onchange = updateView;
        document.getElementById('chkShufflePool').onchange = updateView;
        document.getElementById('chkMergePool').onchange = updateView;
        document.querySelectorAll('input[name="qLimit"]').forEach(r => r.onchange = updateView);

        function updateView() {
            const area = document.getElementById('renderArea');
            if (selectedDays.size === 0) { 
                area.innerHTML = `
                    <div style="padding:100px; text-align:center; color:var(--text-sub);">
                        <i data-lucide="check-square" class="w-12 h-12 opacity-30 mx-auto mb-4"></i>
                        <div class="font-bold">출력할 Day를 선택해 주세요.</div>
                    </div>`; 
                lucide.createIcons();
                return; 
            }
            const mode = document.querySelector('input[name="viewMode"]:checked').value;
            const sortedList = [...selectedDays].sort((a, b) => parseInt(a) - parseInt(b));
            let htmlPayload = ''; 

            if (mode === 'study') {
                sortedList.forEach(day => {
                    const dayItems = vocabRepository[day] || [];
                    let maxMLen = 0;
                    dayItems.forEach(item => {
                        item.entries.forEach(e => {
                            if (e.meaning && e.meaning.length > maxMLen) maxMLen = e.meaning.length;
                        });
                    });
                    
                    const MAX_LINES = maxMLen <= 17 ? 22 : 20;
                    let pages = [];
                    let currentChunk = [];
                    let currentLines = 0;
                    let currentCells = 0;

                    dayItems.forEach(item => {
                        let itemLines = 0;
                        let itemCells = item.entries.length;
                        item.entries.forEach(e => {
                            let sLen = e.synonym ? e.synonym.length : 0;
                            let sLines = Math.ceil((sLen || 1) / 34);
                            itemLines += sLines; 
                        });

                        let futureCells = currentCells + itemCells;
                        let futureLines = currentLines + itemLines;
                        
                        let allowedLines = 22;
                        if (futureCells === 14) allowedLines = 21;
                        else if (futureCells === 15) allowedLines = 22;
                        else if (futureCells === 16) allowedLines = 17;
                        else if (futureCells === 17) allowedLines = 16;
                        else if (futureCells === 18) allowedLines = 16;

                        if (currentChunk.length > 0 && (futureCells >= 19 || futureLines > allowedLines)) {
                            pages.push(currentChunk);
                            currentChunk = [];
                            currentLines = 0;
                            currentCells = 0;
                            futureCells = itemCells;
                            futureLines = itemLines;
                        }
                        
                        currentChunk.push(item);
                        currentLines = futureLines;
                        currentCells = futureCells;
                    });
                    if (currentChunk.length > 0) pages.push(currentChunk);

                    const totalPages = pages.length;
                    pages.forEach((chunk, pageIndex) => {
                        const pageNum = pageIndex + 1;
                        // 타이틀 포맷 수정: 단어장(청색), Day/페이지(흑색), 기호(-, p) 제거
                        htmlPayload += `
                        <section class="sheet">
                            <div class="sheet-header">
                                <div class="header-left">
                                    <h1><span style="color:#3b82f6;">단어장</span> <span style="color:#111827; margin-left:6px;">Day ${day} ${totalPages > 1 ? `${pageNum}/${totalPages}` : ''}</span></h1>
                                </div>
                                <div class="header-right" style="text-align: right; display: flex; align-items: flex-end;">
                                    <span style="font-family: 'Cal Sans', sans-serif; font-size: 18px; font-style: italic; font-weight: 600; color: #111827; letter-spacing: -0.02em;">Enged<span style="color: #fbbf24;">.</span></span>
                                </div>
                            </div>
                            <table class="print-table">
                                <thead><tr><th width="26%">VOCABULARY</th><th width="30%">KOREAN MEANING</th><th width="44%">SYNONYMS</th></tr></thead>
                                <tbody>`;
                        chunk.forEach(item => {
                            item.entries.forEach((e, idx) => {
                                htmlPayload += `<tr>`;
                                if (idx === 0) htmlPayload += `<td rowspan="${item.entries.length}" class="col-vocabulary">${item.word}</td>`;
                                htmlPayload += `<td class="col-meaning">${e.meaning ? `<span class="bullet-point">${idx+1}</span>` + e.meaning : ''}</td>`;
                                htmlPayload += `<td class="col-synonyms">${e.synonym.split(',').map(s => `<span class="badge-synonym">${s.trim()}</span>`).join('')}</td></tr>`;
                            });
                        });
                        htmlPayload += `</tbody></table></section>`;
                    });
                });
            } else {
                const isMerge = document.getElementById('chkMergePool').checked;
                const isSyn = document.getElementById('chkIncludeSyn').checked;
                const isShuffle = document.getElementById('chkShufflePool').checked;
                const limitValue = document.querySelector('input[name="qLimit"]:checked').value;
                const TEST_CHUNK = 36; 

                const buildAssmt = (days, label, isAnswerSheet = false) => {
                    let pool = [];
                    days.forEach(d => (vocabRepository[d] || []).forEach(item => {
                        const ans = item.entries.map(e => e.meaning).filter(Boolean).join(', ');
                        pool.push({ q: item.word, a: ans });
                        if (isSyn) item.entries.forEach(e => e.synonym.split(',').forEach(s => { if(s.trim()) pool.push({ q: s.trim(), a: ans }); }));
                    }));
                    let uniquePool = [];
                    const filter = new Set();
                    pool.forEach(o => { if(!filter.has(o.q.toLowerCase())) { filter.add(o.q.toLowerCase()); uniquePool.push(o); } });
                    if (isShuffle) uniquePool.sort(() => Math.random() - 0.5);
                    if (limitValue !== 'all') uniquePool = uniquePool.slice(0, parseInt(limitValue));

                    let out = '';
                    const totalPages = Math.ceil(uniquePool.length / TEST_CHUNK);
                    const titleBase = isAnswerSheet ? '정답지' : '시험지';
                    const titleColor = isAnswerSheet ? '#dc2626' : '#3b82f6';

                    for (let i = 0; i < uniquePool.length; i += TEST_CHUNK) {
                        const chunk = uniquePool.slice(i, i + TEST_CHUNK);
                        const pageNum = Math.floor(i / TEST_CHUNK) + 1;
                        out += `
                        <section class="sheet">
                            <div class="sheet-header">
                                <div class="header-left">
                                    <h1><span style="color:${titleColor};">${titleBase}</span> <span style="color:#111827; font-size:18px; margin-left:6px;">(${label}) ${totalPages > 1 ? `${pageNum}/${totalPages}` : ''}</span></h1>
                                </div>
                                <div class="header-right" style="text-align: right; display: flex; align-items: flex-end;">
                                    <span style="font-family: 'Cal Sans', sans-serif; font-size: 18px; font-style: italic; font-weight: 600; color: #111827; letter-spacing: -0.02em;">Enged<span style="color: #fbbf24;">.</span></span>
                                </div>
                            </div>
                            <table class="print-table"><thead><tr><th width="55">No.</th><th>Vocabulary</th><th>${isAnswerSheet ? 'Correct Answer' : 'Answer'}</th><th width="55">No.</th><th>Vocabulary</th><th>${isAnswerSheet ? 'Correct Answer' : 'Answer'}</th></tr></thead><tbody>`;
                        const half = Math.ceil(chunk.length / 2);
                        for (let r = 0; r < half; r++) {
                            const L = chunk[r], R = chunk[r + half];
                            out += `<tr><td class="test-no">${i+r+1}</td><td style="font-weight:500; font-size:13.5px; color:#000 !important;">${L.q}</td><td class="${isAnswerSheet ? 'ans-highlight' : ''}">${isAnswerSheet ? L.a : ''}</td>`;
                            out += `<td class="test-no">${R ? i+r+half+1 : ''}</td><td style="font-weight:500; font-size:13.5px; color:#000 !important;">${R ? R.q : ''}</td><td class="${isAnswerSheet ? 'ans-highlight' : ''}">${isAnswerSheet && R ? R.a : ''}</td></tr>`;
                        }
                        out += `</tbody></table></section>`;
                    }
                    return out;
                };

                if (isMerge) htmlPayload = buildAssmt(sortedList, `Day ${sortedList.join(', ')} 통합`) + buildAssmt(sortedList, `Day ${sortedList.join(', ')} 통합`, true);
                else sortedList.forEach(d => htmlPayload += (buildAssmt([d], `Day ${d}`) + buildAssmt([d], `Day ${d}`, true)));
            }
            area.innerHTML = htmlPayload;
            lucide.createIcons();

            clearTimeout(overlayTimeoutId);
            overlayTimeoutId = setTimeout(applyMobileImageOverlay, 800);
        }

        async function applyMobileImageOverlay() {
            const isMobile = /iPhone|iPad|iPod|Android|Mobi/i.test(navigator.userAgent);
            if (!isMobile) return; 
            const sheets = document.querySelectorAll('.sheet');
            for (let sheet of sheets) {
                if (sheet.querySelector('.img-overlay')) continue;
                try {
                    const canvas = await html2canvas(sheet, { scale: 2, useCORS: true, logging: false });
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/jpeg', 0.95);
                    img.className = 'img-overlay';
                    img.style.cssText = 'position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 50; opacity: 0.01; pointer-events: auto; -webkit-touch-callout: default; cursor: pointer;';
                    sheet.appendChild(img);
                } catch(e) {}
            }
        }

        document.getElementById('realPdfBtn').onclick = async function() {
            const overlay = document.getElementById('statusOverlay');
            overlay.classList.add('active');
            window.scrollTo(0,0);
            document.documentElement.classList.add('pdf-export-active');
            document.body.classList.add('pdf-export-active');
            
            const modeName = document.querySelector('input[name="viewMode"]:checked').value;
            const sortedList = [...selectedDays].sort((a, b) => parseInt(a) - parseInt(b));
            let nameTag = sortedList.length > 2 ? `${sortedList[0]}_TO_${sortedList[sortedList.length-1]}` : sortedList.join('_');
            if (!nameTag) nameTag = "ALL";
            const saveName = `Vocab_${modeName}_Day_${nameTag}.pdf`;

            const opt = {
                margin: 0, 
                filename: saveName,
                image: { type: 'jpeg', quality: 0.85 }, 
                html2canvas: { scale: 1.5, useCORS: true, letterRendering: true, scrollY: 0, scrollX: 0 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait', compress: true },
                pagebreak: { mode: 'css' } 
            };

            try {
                await new Promise(r => setTimeout(r, 600));
                await html2pdf().set(opt).from(document.getElementById('renderArea')).save();
            } catch (err) {
                console.error("PDF 생성 실패:", err);
                alert("PDF 생성 중 문제가 발생했습니다. 브라우저 '인쇄' 기능을 이용해 주세요.");
            } finally {
                document.documentElement.classList.remove('pdf-export-active');
                document.body.classList.remove('pdf-export-active');
                overlay.classList.remove('active');
            }
        };
    </script>
</body>
</html>
