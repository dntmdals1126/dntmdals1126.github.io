    <!-- iOS Apple Touch Icon 자동 생성 -->
    <script>
        (function() {
            const svgData = `<svg width="2789" height="2789" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" overflow="hidden"><g transform="translate(-102 638)"><rect x="102" y="-638" width="2789" height="2789" fill="#050505"/><path d="M1086.86-12 2130-12 1992.3 393.199 1377.63 393.199 1315.79 575.168 1895.55 575.168 1778.69 919.005 1198.93 919.005 1138.17 1097.8 1763.42 1097.8 1625.72 1503 572 1503 1086.86-12Z" fill="#F2F5F9" fill-rule="evenodd"/><path d="M2238.6 1028C2308.33 1028 2359.43 1051.8 2391.88 1099.39 2424.33 1146.98 2428.69 1205.67 2404.99 1275.47 2381.29 1345.27 2337 1404.14 2272.11 1452.09 2207.23 1500.03 2139.91 1524 2070.17 1524 1999.73 1524 1948.52 1500.03 1916.55 1452.09 1884.57 1404.14 1880.43 1345.27 1904.13 1275.47 1927.84 1205.67 1971.9 1146.98 2036.31 1099.39 2100.72 1051.8 2168.15 1028 2238.6 1028Z" fill="#F2C14B" fill-rule="evenodd"/></g></svg>`;
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, 512, 512);
                const link = document.createElement('link');
                link.rel = 'apple-touch-icon';
                link.href = canvas.toDataURL('image/png'); 
                document.head.appendChild(link);
            };
            img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData);
        })();
    </script>

    <!-- 핵심 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary)',
                        surface: 'var(--glass-surface)',
                        'text-main': 'var(--text-main)',
                        'text-sub': 'var(--text-sub)',
                        'text-dim': 'var(--text-dim)',
                        'glass-border': 'var(--glass-border)',
                        highlight: '#fbbf24',
                    },
                    fontFamily: {
                        sans: ['"Google Sans Flex"', '"Pretendard"', 'sans-serif'],
                        logo: ['"Cal Sans"', 'sans-serif'],
                        kor: ['"Pretendard"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* --- Enged Design System Variables --- */
        :root {
            --bg-dark: #050505; 
            --glass-surface: rgba(20, 20, 25, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --header-bg: rgba(20, 20, 25, 0.6); 
            --primary: #3b82f6; 
            --primary-glow: rgba(59, 130, 246, 0.3);
            
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --text-dim: #64748b;
            
            --header-h: 64px;
            --radius-md: 22px;
            color-scheme: dark;
        }

        html[data-theme="light"] {
            --bg-dark: #f2f4f7; 
            --glass-surface: #ffffff; 
            --glass-border: #e2e8f0; 
            --glass-highlight: rgba(0, 0, 0, 0.03);
            --header-bg: rgba(255, 255, 255, 0.9);
            --primary: #2563eb; 
            --text-main: #1e293b;
            --text-sub: #475569; 
            --text-dim: #64748b; 
            color-scheme: light;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        html {
            font-family: "Google Sans Flex", "Pretendard", sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        body {
            margin: 0; padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, rgba(20, 30, 40, 0.2), transparent 50%),
                        radial-gradient(circle at bottom right, rgba(20, 30, 40, 0.15), transparent 50%);
            background-color: var(--bg-dark);
            background-attachment: fixed;
            display: flex; flex-direction: column; align-items: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        html[data-theme="light"] body {
            background: radial-gradient(circle at top left, rgba(0,0,0,0.02), transparent 50%);
            background-color: var(--bg-dark);
            background-attachment: fixed;
        }

        /* --- 텍스트 선택/드래그 차단 (오작동에 의한 스크롤 방지) --- */
        html, body {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        /* 인쇄 영역은 복사/선택 가능하게 예외 처리 */
        .sheet, .sheet * {
            -webkit-user-select: text;
            user-select: text;
        }

        /* --- Animated Background Blobs --- */
        .blobs { position: fixed; inset: 0; z-index: -1; pointer-events: none; filter: blur(90px); opacity: 0.4; overflow: hidden; }
        .blob { position: absolute; border-radius: 50%; animation: float 25s infinite ease-in-out alternate; }
        .b1 { top: -20%; left: -10%; width: 60vw; height: 60vw; background: rgba(30, 40, 60, 0.2); }
        .b2 { bottom: -20%; right: -10%; width: 70vw; height: 70vw; background: rgba(20, 30, 40, 0.15); animation-delay: -5s; }
        html[data-theme="light"] .b1 { background: rgba(0,0,0,0.03); }
        html[data-theme="light"] .b2 { background: rgba(0,0,0,0.02); }
        
        @keyframes float { 100% { transform: translate(5%, 5%); } }

        /* --- Header (Floating Pill) --- */
        header { 
            position: fixed; top: calc(16px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); 
            width: calc(100% - 32px); max-width: 1100px; height: var(--header-h); z-index: 1000; 
            background: var(--header-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            border: 1px solid var(--glass-border); border-radius: 99px; 
            display: flex; align-items: center; justify-content: space-between; padding: 0 24px; 
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.3); 
            transition: background-color 0.3s, border-color 0.3s;
        }
        html[data-theme="light"] header { box-shadow: 0 10px 30px -10px rgba(0,0,0,0.1); }

        .logo { display: flex; align-items: baseline; cursor: pointer; color: var(--text-main); transition: color 0.3s; }
        .header-tools { display: flex; gap: 8px; align-items: center; }

        input[type="file"] { display: none; }

        /* --- Buttons --- */
        .btn { 
            height: 40px; border-radius: 12px; font-weight: 600; font-size: 13px; 
            border: 1px solid transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); padding: 0 16px; 
        }
        .btn:active { transform: scale(0.96); }
        .btn-pri { background: var(--primary); color: white; box-shadow: 0 4px 12px var(--primary-glow); }
        .btn-pri:hover { background: #2563eb; }
        .btn-sec { background: rgba(255,255,255,0.08); color: var(--text-main); border: 1px solid var(--glass-border); }
        .btn-sec:hover { background: rgba(255,255,255,0.12); }
        html[data-theme="light"] .btn-sec { background: #f1f5f9; border-color: #cbd5e1; color: #334155; }
        html[data-theme="light"] .btn-sec:hover { background: #e2e8f0; }
        
        .tool-icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid transparent; background: transparent; color: var(--text-main); display: flex; align-items: center; justify-content: center; transition: all 0.2s; text-decoration: none; cursor: pointer; }
        @media (hover: hover) and (pointer: fine) {
            .tool-icon-btn:hover { background: var(--glass-highlight); border-color: var(--glass-border); }
        }

        /* --- Glass Cards --- */
        .section-card { 
            background: var(--glass-surface); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
            border: 1px solid var(--glass-border); border-radius: var(--radius-md); 
            padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
            transition: background-color 0.3s, border-color 0.3s;
        }
        html[data-theme="light"] .section-card { box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        
        /* 기능 제어 액션 패널 고정 설정 */
        #actionCard {
            position: sticky;
            top: calc(var(--header-h) + 24px + env(safe-area-inset-top));
            z-index: 900;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        html[data-theme="light"] #actionCard {
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        
        .control-card {
            width: 100%; max-width: 1000px; margin-top: 24px; 
            display: flex; flex-direction: column; gap: 24px;
        }
        
        /* 설정 섹션의 타이틀 정렬 교정 */
        .config-section { display: flex; flex-direction: column; gap: 12px; }
        .config-title { font-size: 14px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; gap: 8px; opacity: 0.9; }

        .option-group { display: flex; gap: 16px; flex-wrap: wrap; background: var(--glass-highlight); padding: 12px; border-radius: 14px; border: 1px solid var(--glass-border); }
        .label-box { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text-main); cursor: pointer; }
        .label-box input { accent-color: var(--primary); width: 16px; height: 16px; }

        .tag-stack { display: flex; flex-wrap: wrap; gap: 8px; }
        .tag { 
            padding: 8px 16px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: var(--glass-highlight); color: var(--text-sub); font-size: 13px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .tag:hover { background: rgba(150, 150, 150, 0.15); color: var(--text-main); }
        .tag.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 12px var(--primary-glow); }

        /* =========================================
           인쇄 / PDF 전용 레이아웃 
           ========================================= */
        #renderArea { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 40px 0; gap: 0; }
        
        .sheet {
            width: 210mm; min-height: 297mm; padding: 20mm 20mm; box-sizing: border-box; 
            position: relative; display: flex; flex-direction: column; page-break-after: always;
            
            /* PDF 및 화면 미리보기를 위해 완벽한 화이트/블랙 강제 적용 (테마 무시) */
            background: #ffffff !important; 
            color: #000000 !important;
            border-radius: 4px;
        }

        /* 화면에서 여러 장을 볼 때 구분선 (인쇄 시 사라짐) */
        @media screen { .sheet { border-bottom: 1px dashed #94a3b8; margin-bottom: 20px; } }

        .sheet-header { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2.5px solid #000 !important; padding-bottom: 16px; margin-bottom: 30px;
        }
        .sheet-header h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.04em; color: #000 !important; font-family: "Pretendard", sans-serif; }
        
        .print-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 0.25mm solid #000 !important; margin-bottom: 24px; background-color: #fff !important; }
        .print-table tr { page-break-inside: avoid; } 
        .print-table th, .print-table td { border: 0.25mm solid #000 !important; padding: 12px 14px; font-size: 14.5px; line-height: 1.5; vertical-align: middle; word-break: break-all; color: #000 !important; }
        .print-table th { background: #f1f5f9 !important; color: #1e293b !important; font-size: 11px; font-weight: 900; text-align: center; text-transform: uppercase; border-bottom: 0.5mm solid #000 !important; }

        .col-vocabulary { width: 25%; font-weight: 800; font-size: 16px; color: #000 !important; }
        .col-meaning { width: 42%; font-weight: 500; }
        .col-synonyms { width: 33%; font-size: 12px; color: #475569 !important; }
        
        .badge-synonym { display: inline-block; background: #f8fafc !important; padding: 2px 8px; border-radius: 5px; font-size: 11px; margin: 2px; color: #475569 !important; border: 0.15mm solid #cbd5e1 !important; font-weight: 600; }
        .bullet-point { color: #64748b !important; font-size: 11px; margin-right: 8px; font-weight: 900; }
        .test-no { text-align: center; color: #475569 !important; width: 40px; font-size: 12px; font-weight: 900; background: #f8fafc !important; }
        .ans-highlight { color: #dc2626 !important; font-weight: 800; }

        /* --- 상태 메시지 및 로딩 --- */
        .status-mask { position: fixed; inset: 0; background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(8px); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .status-mask.active { display: flex; }
        .spinner { width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- 물리적 인쇄 전용 CSS (A4 포맷 및 여백 확보) --- */
        @media print {
            :root, html, body {
                color-scheme: light !important; 
                background: #ffffff !important;
                background-color: #ffffff !important;
                background-image: none !important;
            }
            @page { size: A4; margin: 15mm; } 
            html, body { height: auto !important; overflow: visible !important; }
            .app-header, .control-card, #actionCard, .status-mask, .blobs { display: none !important; }
            #renderArea { padding: 0 !important; width: 100% !important; display: block !important; gap: 0 !important; background: transparent !important; }
            
            .sheet { 
                box-shadow: none !important; border: none !important; width: 100% !important; 
                height: auto !important; min-height: 0 !important;
                padding: 0 !important; margin: 0 !important; page-break-after: always !important; 
                background: #ffffff !important;
            }
        }

        /* --- PDF 저장 전용 CSS (1 Day = 1 Page 커스텀 비율 대응) --- */
        html.pdf-export-active, body.pdf-export-active { 
            color-scheme: light !important; 
            background: #ffffff !important; 
            background-color: #ffffff !important;
            background-image: none !important;
            width: 100% !important; overflow: visible !important; height: auto !important; 
        }
        body.pdf-export-active .blobs, body.pdf-export-active .app-header, body.pdf-export-active .control-card, body.pdf-export-active #actionCard { display: none !important; }
        
        body.pdf-export-active #renderArea { 
            width: 800px !important; /* 렌더링 너비 고정 */
            padding: 0 !important; margin: 0 auto !important; 
            display: block !important; gap: 0 !important; background: transparent !important; 
        }
        
        body.pdf-export-active .sheet { 
            box-shadow: none !important; width: 800px !important; margin: 0 !important; border: none !important; 
            padding: 40px !important; height: auto !important; min-height: 0 !important; border-radius: 0; page-break-after: always !important; 
            background: #ffffff !important;
        }

        /* Mobile tweaks */
        @media (max-width: 640px) {
            :root { --header-h: 60px; }
            header { 
                top: 0; width: 100%; border-radius: 0; max-width: none; border-left: none; border-right: none; border-top: none; 
                padding-top: env(safe-area-inset-top); height: calc(var(--header-h) + env(safe-area-inset-top));
            }
            #actionCard { margin-top: calc(80px + env(safe-area-inset-top)); top: calc(var(--header-h) + 12px + env(safe-area-inset-top)); }
            .control-card { margin-top: 16px; padding: 20px; border-radius: 0; border-left: none; border-right: none; }
        }
    </style>
</head>
<body>

    <!-- 애니메이션 배경 -->
    <div class="blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <!-- PDF 로딩 오버레이 -->
    <div id="statusOverlay" class="status-mask">
        <div class="spinner"></div>
        <div class="text-lg font-bold text-white tracking-wide">PDF를 생성하고 있습니다.</div>
        <div class="text-sm mt-2 text-text-sub" style="color: #94a3b8;">파일 안정성 검증 및 페이지 레이아웃 조정 중...</div>
    </div>

    <!-- 메인 헤더 -->
    <header class="app-header">
        <div class="logo no-select" onclick="location.reload()">
            <span class="text-xl font-logo font-semibold italic tracking-tight">Enged<span class="text-highlight">.</span></span>
            <span class="text-xs font-sans not-italic font-bold ml-2 text-text-main opacity-90 hidden sm:inline">Vocab Master</span>
        </div>
        
        <div class="header-tools">
            <a href="https://www.v1ctorym1n.kro.kr/enged" class="tool-icon-btn hidden sm:flex" title="상위 메뉴">
                <i data-lucide="corner-up-left" class="w-4 h-4"></i>
            </a>
            
            <!-- 테마 전환 버튼 -->
            <button class="tool-icon-btn ml-1" id="themeToggle" title="테마 변경">
                <svg id="iconMoon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79Z"></path></svg>
                <svg id="iconSun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
    </header>

    <!-- 기능 제어 액션 패널 (Sticky 요소) -->
    <div class="section-card w-fit mx-auto flex flex-wrap items-center justify-center gap-3 py-3 px-5 transition-colors border border-[var(--glass-border)]" id="actionCard" style="margin-top: calc(100px + env(safe-area-inset-top)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);">
        
        <!-- 데이터 업로드 버튼 -->
        <label for="csvFileInput" id="uploadLabel" class="btn btn-sec cursor-pointer mb-0">
            <i data-lucide="file-up" class="w-4 h-4"></i> 
            <span>데이터 업로드</span>
        </label>
        <input type="file" id="csvFileInput" accept=".csv" />

        <!-- 데이터 초기화 버튼 (파일 로드 후 업로드 버튼 대신 표시됨) -->
        <button class="btn" id="resetDataBtn" style="display:none; background-color: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444;" onclick="clearLocalData()">
            <i data-lucide="trash-2" class="w-4 h-4"></i>
            <span>데이터 초기화</span>
        </button>
        
        <button class="btn btn-sec" onclick="window.print()" id="printBtn" style="display:none;">
            <i data-lucide="printer" class="w-4 h-4"></i>
            <span>인쇄</span>
        </button>
        <button class="btn btn-pri" id="pdfBtn" style="display:none;">
            <i data-lucide="download" class="w-4 h-4"></i>
            <span>PDF 저장</span>
        </button>
    </div>

    <!-- 세부 설정 패널 -->
    <div class="section-card control-card" id="configCard" style="display: none;">
        <div class="config-section">
            <div class="config-title"><i data-lucide="layout" class="w-4 h-4 text-primary"></i> 문서 형식 선택</div>
            <div class="option-group">
                <label class="label-box"><input type="radio" name="viewMode" value="study" checked> 단어장</label>
                <label class="label-box"><input type="radio" name="viewMode" value="test"> 시험지</label>
            </div>
        </div>
        
        <div class="config-section" id="testConfigArea" style="display: none;">
            <div class="config-title"><i data-lucide="settings-2" class="w-4 h-4 text-primary"></i> 시험지 세부 옵션</div>
            <div class="option-group">
                <label class="label-box"><input type="checkbox" id="chkIncludeSyn"> 동의어 포함</label>
                <label class="label-box"><input type="checkbox" id="chkShufflePool" checked> 문항 무작위 섞기</label>
                <label class="label-box"><input type="checkbox" id="chkMergePool"> 여러 Day 통합 출제</label>
                <div class="flex items-center gap-2 ml-2 sm:ml-4 border-l border-[var(--glass-border)] pl-4">
                    <span class="text-xs font-bold text-text-sub">출제 수:</span>
                    <label class="label-box"><input type="radio" name="qLimit" value="10"> 10</label>
                    <label class="label-box"><input type="radio" name="qLimit" value="20"> 20</label>
                    <label class="label-box"><input type="radio" name="qLimit" value="30"> 30</label>
                    <label class="label-box"><input type="radio" name="qLimit" value="all" checked> 전체</label>
                </div>
            </div>
        </div>

        <div class="config-section">
            <div class="config-title w-full justify-between">
                <div class="flex items-center gap-2">
                    <i data-lucide="check-square" class="w-4 h-4 text-primary"></i> 학습 대상 Day 선택
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="selectAllDays()" class="text-[11px] font-bold px-2.5 py-1.5 bg-[var(--glass-highlight)] hover:bg-[var(--glass-border)] border border-[var(--glass-border)] rounded-md text-text-main transition-colors">전체 선택</button>
                    <button onclick="deselectAllDays()" class="text-[11px] font-bold px-2.5 py-1.5 bg-[var(--glass-highlight)] hover:bg-[var(--glass-border)] border border-[var(--glass-border)] rounded-md text-text-main transition-colors">전체 해제</button>
                </div>
            </div>
            <div class="tag-stack" id="tagStack"></div>
        </div>
    </div>

    <!-- 메인 렌더링 영역 -->
    <main id="renderArea">
        <div style="padding: calc(100px + env(safe-area-inset-top)) 20px 100px; text-align: center; color: var(--text-sub);" id="emptyStateArea">
            <div class="w-16 h-16 rounded-full bg-[var(--glass-highlight)] flex items-center justify-center mx-auto mb-6 pointer-events-none">
                <i data-lucide="file-spreadsheet" class="w-8 h-8 text-primary opacity-80"></i>
            </div>
            <h2 class="text-lg font-bold text-text-main mb-2 pointer-events-none">데이터를 업로드해 주세요</h2>
            <p class="text-sm font-medium opacity-80 pointer-events-none">상단의 버튼을 누르거나 화면에 CSV 파일을 드래그하면<br>단어장이 자동으로 렌더링됩니다.</p>
        </div>
    </main>

    <script>
        // --- Theme Toggle Logic ---
        const htmlRoot = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');
        const iconMoon = document.getElementById('iconMoon');
        const iconSun = document.getElementById('iconSun');
        const savedTheme = localStorage.getItem('theme') || 'dark';

        function applyTheme(theme) {
            htmlRoot.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            if (theme === 'light') { 
                iconSun.style.display = 'block'; 
                iconMoon.style.display = 'none'; 
            } else { 
                iconSun.style.display = 'none'; 
                iconMoon.style.display = 'block'; 
            }
        }
        applyTheme(savedTheme);
        themeToggle.onclick = () => applyTheme(htmlRoot.getAttribute('data-theme') === 'light' ? 'dark' : 'light');

        // --- Drag and Drop Logic ---
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            document.body.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            document.body.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            const actionCard = document.getElementById('actionCard');
            if(actionCard) {
                actionCard.style.borderColor = 'var(--primary)';
                actionCard.style.backgroundColor = 'rgba(59, 130, 246, 0.1)';
            }
        }

        function unhighlight(e) {
            const actionCard = document.getElementById('actionCard');
            if(actionCard) {
                actionCard.style.borderColor = '';
                actionCard.style.backgroundColor = '';
            }
        }

        document.body.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            let dt = e.dataTransfer;
            let files = dt.files;
            
            if(files.length > 0) {
                const file = files[0];
                if(file.name.toLowerCase().endsWith('.csv')) {
                    processFile(file);
                } else {
                    alert("CSV 파일만 업로드 가능합니다.");
                }
            }
        }

        // --- Local Storage Data Logic ---
        // 앱이 켜질 때 로컬 스토리지에 저장된 파일이 있는지 확인
        window.onload = () => {
            lucide.createIcons();
            const savedCSV = localStorage.getItem('savedVocabCSV');
            if (savedCSV) {
                parseCSVString(savedCSV);
            }
        };

        // 데이터 초기화 버튼 누를 때 실행되는 함수
        function clearLocalData() {
            if(confirm("저장된 단어장 데이터를 기기에서 초기화하시겠습니까?")) {
                localStorage.removeItem('savedVocabCSV');
                location.reload();
            }
        }

        // --- App Logic ---
        let vocabRepository = {};
        let selectedDays = new Set();

        // 1. CSV 파일 인풋 변경
        document.getElementById('csvFileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            processFile(file);
        };

        // 파일을 읽어 로컬 스토리지에 저장하고 파싱 시작
        function processFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                try {
                    localStorage.setItem('savedVocabCSV', text);
                } catch(err) {
                    console.warn("로컬 스토리지 저장 실패 (용량 초과 등):", err);
                }
                parseCSVString(text);
            };
            reader.readAsText(file);
        }

        function parseCSVString(text) {
            Papa.parse(text, {
                header: true, skipEmptyLines: true,
                complete: (res) => { processRawData(res.data); }
            });
        }

        function processRawData(data) {
            vocabRepository = {};
            const availableDays = new Set();
            data.forEach(row => {
                const d = row['Day']?.trim();
                if (!d) return;
                availableDays.add(d);
                if (!vocabRepository[d]) vocabRepository[d] = [];
                const mRaw = (row['Meaning (KR)'] || '').split(';').map(s => s.trim()).filter(Boolean);
                const sRaw = (row['Synonyms'] || '').split(';').map(s => s.trim()).filter(Boolean);
                const maxLen = Math.max(mRaw.length, sRaw.length, 1);
                const entries = [];
                for (let i = 0; i < maxLen; i++) { 
                    entries.push({ meaning: mRaw[i] || '', synonym: sRaw[i] || '' }); 
                }
                vocabRepository[d].push({ word: row['Word']?.trim() || '', entries });
            });
            const sorted = [...availableDays].sort((a, b) => parseInt(a) - parseInt(b));
            selectedDays.clear();
            if (sorted.length > 0) selectedDays.add(sorted[0]);
            updateDayTags(sorted);
            
            // 데이터 로드 완료 후 UI 전환
            document.getElementById('uploadLabel').style.display = 'none'; // 데이터 업로드 버튼 숨김
            document.getElementById('resetDataBtn').style.display = 'inline-flex'; // 데이터 초기화 붉은 버튼 표시
            document.getElementById('configCard').style.display = 'flex';
            document.getElementById('printBtn').style.display = 'inline-flex';
            document.getElementById('pdfBtn').style.display = 'inline-flex';
            document.getElementById('emptyStateArea').style.display = 'none';
            updateView();
        }

        function updateDayTags(days) {
            const container = document.getElementById('tagStack');
            container.innerHTML = '';
            days.forEach(d => {
                const tag = document.createElement('div');
                tag.className = `tag ${selectedDays.has(d) ? 'active' : ''}`;
                tag.textContent = `Day ${d}`;
                tag.onclick = () => {
                    if (selectedDays.has(d)) selectedDays.delete(d); else selectedDays.add(d);
                    updateView();
                    updateDayTags(days);
                };
                container.appendChild(tag);
            });
        }

        // 전체 선택 로직
        function selectAllDays() {
            const availableDays = Object.keys(vocabRepository).sort((a, b) => parseInt(a) - parseInt(b));
            if (availableDays.length === 0) return;
            availableDays.forEach(d => selectedDays.add(d));
            updateDayTags(availableDays);
            updateView();
        }

        // 전체 해제 로직
        function deselectAllDays() {
            const availableDays = Object.keys(vocabRepository).sort((a, b) => parseInt(a) - parseInt(b));
            selectedDays.clear();
            updateDayTags(availableDays);
            updateView();
        }

        // 옵션 이벤트 리스너 연결
        document.querySelectorAll('input[name="viewMode"]').forEach(r => r.onchange = (e) => {
            document.getElementById('testConfigArea').style.display = e.target.value === 'test' ? 'flex' : 'none';
            updateView();
        });
        document.getElementById('chkIncludeSyn').onchange = updateView;
        document.getElementById('chkShufflePool').onchange = updateView;
        document.getElementById('chkMergePool').onchange = updateView;
        document.querySelectorAll('input[name="qLimit"]').forEach(r => r.onchange = updateView);

        // 3. 통합 렌더링 로직 (시험지 모드 포함 모든 청크 분할 제거)
        function updateView() {
            const area = document.getElementById('renderArea');
            if (selectedDays.size === 0) { 
                area.innerHTML = `
                    <div style="padding:100px; text-align:center; color:var(--text-sub);">
                        <i data-lucide="check-square" class="w-12 h-12 opacity-30 mx-auto mb-4"></i>
                        <div class="font-bold">출력할 Day를 선택해 주세요.</div>
                    </div>`; 
                lucide.createIcons();
                return; 
            }
            const mode = document.querySelector('input[name="viewMode"]:checked').value;
            const sortedList = [...selectedDays].sort((a, b) => parseInt(a) - parseInt(b));
            let htmlPayload = ''; 

            if (mode === 'study') {
                sortedList.forEach(day => {
                    htmlPayload += `
                    <section class="sheet">
                        <div class="sheet-header">
                            <div class="header-left">
                                <h1>단어장 (DAY ${day})</h1>
                            </div>
                        </div>
                        <table class="print-table">
                            <thead><tr><th width="25%">VOCABULARY</th><th width="42%">KOREAN MEANING</th><th width="33%">SYNONYMS</th></tr></thead>
                            <tbody>`;
                    (vocabRepository[day] || []).forEach(item => {
                        item.entries.forEach((e, i) => {
                            htmlPayload += `<tr>`;
                            if (i === 0) htmlPayload += `<td rowspan="${item.entries.length}" class="col-vocabulary">${item.word}</td>`;
                            htmlPayload += `<td class="col-meaning">${e.meaning ? `<span class="bullet-point">${i+1}</span>` + e.meaning : ''}</td>`;
                            htmlPayload += `<td class="col-synonyms">${e.synonym.split(',').map(s => `<span class="badge-synonym">${s.trim()}</span>`).join('')}</td></tr>`;
                        });
                    });
                    htmlPayload += `</tbody></table></section>`;
                });
            } else {
                const isMerge = document.getElementById('chkMergePool').checked;
                const isSyn = document.getElementById('chkIncludeSyn').checked;
                const isShuffle = document.getElementById('chkShufflePool').checked;
                const limitValue = document.querySelector('input[name="qLimit"]:checked').value;

                const buildAssmt = (days, label) => {
                    let pool = [];
                    days.forEach(d => (vocabRepository[d] || []).forEach(item => {
                        const ans = item.entries.map(e => e.meaning).filter(Boolean).join(', ');
                        pool.push({ q: item.word, a: ans });
                        if (isSyn) item.entries.forEach(e => e.synonym.split(',').forEach(s => { if(s.trim()) pool.push({ q: s.trim(), a: ans }); }));
                    }));
                    let uniquePool = [];
                    const filter = new Set();
                    pool.forEach(o => { if(!filter.has(o.q.toLowerCase())) { filter.add(o.q.toLowerCase()); uniquePool.push(o); } });
                    if (isShuffle) uniquePool.sort(() => Math.random() - 0.5);
                    if (limitValue !== 'all') uniquePool = uniquePool.slice(0, parseInt(limitValue));

                    // 청크 분할 없이 1개의 거대한 표로 생성
                    let out = `
                    <section class="sheet">
                        <div class="sheet-header">
                            <div class="header-left">
                                <h1>시험지 (${label})</h1>
                            </div>
                        </div>
                        <table class="print-table"><thead><tr><th width="40">No.</th><th>Vocabulary</th><th>Answer</th><th width="40">No.</th><th>Vocabulary</th><th>Answer</th></tr></thead><tbody>`;
                    const half = Math.ceil(uniquePool.length / 2);
                    for (let r = 0; r < half; r++) {
                        const L = uniquePool[r], R = uniquePool[r + half];
                        out += `<tr><td class="test-no">${r+1}</td><td style="font-weight:800; color:#000 !important;">${L.q}</td><td></td>`;
                        out += `<td class="test-no">${R ? r+half+1 : ''}</td><td style="font-weight:800; color:#000 !important;">${R ? R.q : ''}</td><td></td></tr>`;
                    }
                    out += `</tbody></table></section>`;

                    // 정답지 역시 단일 표로 생성
                    out += `
                    <section class="sheet">
                        <div class="sheet-header">
                            <div class="header-left">
                                <h1 style="color:#dc2626 !important;">정답지 (${label})</h1>
                            </div>
                        </div>
                        <table class="print-table"><thead><tr><th width="40">No.</th><th>Vocabulary</th><th>Correct Answer</th><th width="40">No.</th><th>Vocabulary</th><th>Correct Answer</th></tr></thead><tbody>`;
                    for (let r = 0; r < half; r++) {
                        const L = uniquePool[r], R = uniquePool[r + half];
                        out += `<tr><td class="test-no">${r+1}</td><td style="font-weight:800; color:#000 !important;">${L.q}</td><td class="ans-highlight">${L.a}</td>`;
                        out += `<td class="test-no">${R ? r+half+1 : ''}</td><td style="font-weight:800; color:#000 !important;">${R ? R.q : ''}</td><td class="ans-highlight">${R ? R.a : ''}</td></tr>`;
                    }
                    out += `</tbody></table></section>`;
                    
                    return out;
                };

                if (isMerge) htmlPayload = buildAssmt(sortedList, `Day ${sortedList.join(', ')} 통합`);
                else sortedList.forEach(d => htmlPayload += buildAssmt([d], `Day ${d}`));
            }
            area.innerHTML = htmlPayload;
            lucide.createIcons();
        }

        // 4. PDF 저장 (동적 높이 조절 방식으로 1 Day = 1 PDF Page 생성)
        document.getElementById('pdfBtn').onclick = async function() {
            const overlay = document.getElementById('statusOverlay');
            overlay.classList.add('active');
            
            window.scrollTo(0,0);
            document.documentElement.classList.add('pdf-export-active');
            document.body.classList.add('pdf-export-active');
            
            try {
                // 레이아웃 전환 대기 (요소들이 지정된 폭과 패딩을 적용받도록 기다림)
                await new Promise(r => setTimeout(r, 600));

                const modeName = document.querySelector('input[name="viewMode"]:checked').value;
                const sortedList = [...selectedDays].sort((a, b) => parseInt(a) - parseInt(b));
                
                let nameTag = sortedList.length > 2 ? `${sortedList[0]}_TO_${sortedList[sortedList.length-1]}` : sortedList.join('_');
                if (!nameTag) nameTag = "ALL";
                const saveName = `Vocab_${modeName}_Day_${nameTag}.pdf`;

                // 각 Day(sheet) 중 가장 긴 요소의 높이를 측정하여 PDF 페이지 규격으로 사용
                const pdfWidth = 800; 
                let maxSheetHeight = 0;
                const sheets = document.querySelectorAll('#renderArea .sheet');
                sheets.forEach(sheet => {
                    if (sheet.offsetHeight > maxSheetHeight) {
                        maxSheetHeight = sheet.offsetHeight;
                    }
                });
                
                // 잘림 방지를 위한 하단 버퍼 추가
                maxSheetHeight += 20;

                // 내용이 너무 적을 경우를 대비해 최소 A4 비율(1:1.414) 보장
                if (maxSheetHeight < 1131) maxSheetHeight = 1131;

                const opt = {
                    margin: 0,
                    filename: saveName,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { 
                        scale: 2.0, 
                        useCORS: true, 
                        letterRendering: true,
                        width: pdfWidth,
                        windowWidth: pdfWidth,
                        scrollY: 0,
                        scrollX: 0
                    },
                    jsPDF: { 
                        unit: 'px', 
                        format: [pdfWidth, maxSheetHeight], 
                        orientation: 'portrait', 
                        compress: true 
                    },
                    pagebreak: { mode: ['css', 'legacy'] } 
                };

                const element = document.getElementById('renderArea');
                await html2pdf().set(opt).from(element).save();

            } catch (err) {
                console.error("PDF 생성 실패:", err);
                alert("PDF 생성 중 문제가 발생했습니다. 브라우저 인쇄 기능을 이용해 주세요.");
            } finally {
                // 원상 복구
                document.documentElement.classList.remove('pdf-export-active');
                document.body.classList.remove('pdf-export-active');
                overlay.classList.remove('active');
            }
        };

    </script>
</body>
</html>
