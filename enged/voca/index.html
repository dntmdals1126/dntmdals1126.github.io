<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>단어장 출력 시스템</title>
    <!-- 외부 라이브러리 연동 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/variable/pretendardvariable.css" />
    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary: #4f46e5;
            --primary-dark: #3730a3;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Pretendard Variable', -apple-system, system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        /* --- 프리미엄 상단 툴바 --- */
        .header-wrapper {
            width: 100%; position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 0; display: flex; flex-direction: column; align-items: center;
        }

        .toolbar {
            display: flex; gap: 12px; align-items: center;
            background: white; padding: 8px 16px; border-radius: 100px;
            box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }

        input[type="file"] { display: none; }
        
        .btn {
            font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 18px;
            border-radius: 100px; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 6px; border: none;
        }
        .btn-upload { background: white; color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-upload:hover { background: #f1f5f9; }
        .btn-print { background: #334155; color: white; display: none; }
        .btn-pdf { background: var(--primary); color: white; display: none; }
        .btn-pdf:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-back { color: var(--text-muted); text-decoration: none; font-size: 13px; padding: 8px 12px; }
        .btn-back:hover { color: var(--primary); }

        /* --- 세련된 옵션 패널 --- */
        .control-panel {
            width: 95%; max-width: 900px; background: white; padding: 24px;
            border-radius: 16px; box-shadow: var(--shadow); margin-top: 20px;
            border: 1px solid var(--border-color); display: none;
        }
        .panel-section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #f1f5f9; }
        .panel-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .section-header { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .options-group { display: flex; gap: 16px; flex-wrap: wrap; }
        .radio-label, .check-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); cursor: pointer; }
        .radio-label input, .check-label input { accent-color: var(--primary); width: 16px; height: 16px; }

        .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
        .chip { 
            padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border-color);
            background: white; color: var(--text-muted); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* --- A4 용지 렌더링 영역 --- */
        #mainContent { 
            width: 100%; display: flex; flex-direction: column; align-items: center; 
            padding: 40px 0; gap: 0; /* PDF 여백 조절을 위해 gap 제거 */
        }
        
        .paper-content {
            width: 210mm; background: white; padding: 20mm;
            box-shadow: 0 0 20px rgba(0,0,0,0.05); box-sizing: border-box;
            position: relative;
        }

        .page-header { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            border-bottom: 3px solid var(--text-main); padding-bottom: 12px; margin-bottom: 24px;
        }
        .title-group h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.03em; color: var(--text-main); }
        .title-group p { margin: 4px 0 0 0; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
        .header-meta { font-size: 13px; font-weight: 700; color: var(--text-main); }
        .input-line { display: inline-block; width: 110px; border-bottom: 1px solid var(--text-main); margin-left: 6px; height: 14px; }

        /* --- 초정밀 테이블 (0.12px) --- */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 0.12px solid #000; margin-bottom: 30px; }
        tr { page-break-inside: avoid; } /* 페이지 중간 잘림 방지 */
        th, td { border: 0.12px solid #000; padding: 12px 10px; font-size: 14px; line-height: 1.5; vertical-align: middle; }
        th { background: #f8fafc; color: var(--text-muted); font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-align: center; }

        .word-col { width: 25%; font-weight: 800; font-size: 15px; color: var(--primary); text-align: left; background: white !important; }
        .meaning-col { width: 40%; font-weight: 500; }
        .synonym-col { width: 35%; color: var(--text-muted); font-size: 13px; }
        
        .synonym-badge {
            display: inline-block; background: #f1f5f9; padding: 2px 6px; border-radius: 4px;
            font-size: 12px; margin: 1px; color: #475569; border: 0.12px solid #cbd5e1;
        }

        /* 학습 모드 특수 행 스타일 */
        .study-table tr.inner-row td:not(.word-col) { border-bottom: 0.12px solid transparent; padding-top: 4px; padding-bottom: 4px; }
        .study-table tr.last-row td { border-bottom: 0.12px solid #000; padding-bottom: 12px; }

        .num-bullet { color: var(--text-tertiary); font-size: 11px; margin-right: 6px; font-weight: 700; }
        .test-num { color: var(--text-muted); font-size: 11px; text-align: center; width: 30px; }
        .answer-key-text { color: #e11d48; font-weight: 700; }

        /* --- 빈 화면 로딩 등 --- */
        .empty-state { padding: 80px; text-align: center; color: var(--text-muted); }
        .overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; transition: 0.3s; }
        .overlay.active { display: flex; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid white; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- PDF 출력 시 최적화 오버라이드 --- */
        body.pdf-mode { background: white !important; }
        body.pdf-mode .header-wrapper { display: none !important; }
        body.pdf-mode #mainContent { width: 210mm !important; margin: 0 !important; padding: 0 !important; }
        body.pdf-mode .paper-content { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 15mm !important; }
        
        @media print {
            body { background: white; }
            .header-wrapper { display: none !important; }
            #mainContent { width: 100%; padding: 0; }
            .paper-content { box-shadow: none; padding: 15mm; width: 100%; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="overlay"><div class="spinner"></div><div style="font-weight: 600;">전문적인 단어장을 생성하고 있습니다...</div></div>

    <header class="header-wrapper">
        <div class="toolbar">
            <a href="https://www.v1ctorym1n.kro.kr/enged" class="btn-back">← 돌아가기</a>
            <label for="csvFileInput" class="btn btn-upload">파일 업로드</label>
            <input type="file" id="csvFileInput" accept=".csv" />
            <button class="btn btn-print" onclick="window.print()" id="printBtn">인쇄</button>
            <button class="btn btn-pdf" id="pdfBtn">PDF 다운로드</button>
        </div>

        <div class="control-panel" id="controlPanel">
            <div class="panel-section">
                <div class="section-header">💡 모드 설정</div>
                <div class="options-group">
                    <label class="radio-label"><input type="radio" name="viewMode" value="study" checked> 📖 학습용 단어장</label>
                    <label class="radio-label"><input type="radio" name="viewMode" value="test"> 📝 테스트 시험지</label>
                </div>
            </div>
            
            <div class="panel-section" id="testSettings" style="display: none;">
                <div class="section-header">⚙️ 출제 옵션</div>
                <div class="options-group">
                    <label class="check-label"><input type="checkbox" id="chkSynonyms"> 유의어 포함</label>
                    <label class="check-label"><input type="checkbox" id="chkShuffle" checked> 무작위 섞기</label>
                    <label class="check-label"><input type="checkbox" id="chkCombine"> 선택 Day 통합</label>
                    <div style="display: flex; align-items: center; gap: 8px; margin-left: 10px;">
                        <span style="font-size: 13px; font-weight: 700;">문항 수:</span>
                        <label class="radio-label"><input type="radio" name="qCount" value="10"> 10</label>
                        <label class="radio-label"><input type="radio" name="qCount" value="20"> 20</label>
                        <label class="radio-label"><input type="radio" name="qCount" value="30"> 30</label>
                        <label class="radio-label"><input type="radio" name="qCount" value="all" checked> 전체</label>
                    </div>
                </div>
            </div>

            <div class="panel-section" style="border-bottom: none;">
                <div class="section-header">📄 Day 선택</div>
                <div class="chip-container" id="dayChips"></div>
            </div>
        </div>
    </header>

    <main id="mainContent">
        <div class="empty-state">
            <div style="font-size: 40px; margin-bottom: 10px;">📁</div>
            <div style="font-size: 16px; font-weight: 600;">CSV 파일을 업로드하면 고품질 단어장이 생성됩니다.</div>
        </div>
    </main>

    <script>
        let rawVocabData = {};
        let selectedDays = new Set();

        // 1. 파일 핸들링
        document.getElementById('csvFileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            Papa.parse(file, {
                header: true, skipEmptyLines: true,
                complete: (results) => {
                    processCSV(results.data);
                }
            });
        };

        function processCSV(data) {
            rawVocabData = {};
            const daysFound = new Set();
            data.forEach(row => {
                const d = row['Day']?.trim();
                if (!d) return;
                daysFound.add(d);
                if (!rawVocabData[d]) rawVocabData[d] = [];

                const meanings = (row['Meaning (KR)'] || '').split(';').map(s => s.trim()).filter(Boolean);
                const synonyms = (row['Synonyms'] || '').split(';').map(s => s.trim()).filter(Boolean);
                const max = Math.max(meanings.length, synonyms.length, 1);
                
                const entries = [];
                for (let i = 0; i < max; i++) {
                    entries.push({ m: meanings[i] || '', s: synonyms[i] || '' });
                }
                rawVocabData[d].push({ word: row['Word']?.trim() || '', entries });
            });

            const sortedDays = [...daysFound].sort((a, b) => parseInt(a) - parseInt(b));
            selectedDays.clear();
            if (sortedDays.length > 0) selectedDays.add(sortedDays[0]);

            renderChips(sortedDays);
            document.getElementById('controlPanel').style.display = 'block';
            document.getElementById('printBtn').style.display = 'inline-flex';
            document.getElementById('pdfBtn').style.display = 'inline-flex';
            render();
        }

        function renderChips(days) {
            const box = document.getElementById('dayChips');
            box.innerHTML = '';
            days.forEach(d => {
                const c = document.createElement('div');
                c.className = `chip ${selectedDays.has(d) ? 'active' : ''}`;
                c.textContent = `Day ${d}`;
                c.onclick = () => {
                    if (selectedDays.has(d)) selectedDays.delete(d); else selectedDays.add(d);
                    render();
                    renderChips(days);
                };
                box.appendChild(c);
            });
        }

        // 2. 옵션 변경 감지
        document.querySelectorAll('input[name="viewMode"]').forEach(r => r.onchange = (e) => {
            document.getElementById('testSettings').style.display = e.target.value === 'test' ? 'block' : 'none';
            render();
        });
        document.getElementById('chkSynonyms').onchange = render;
        document.getElementById('chkShuffle').onchange = render;
        document.getElementById('chkCombine').onchange = render;
        document.querySelectorAll('input[name="qCount"]').forEach(r => r.onchange = render);

        // 3. 렌더링 핵심 로직
        function render() {
            const container = document.getElementById('mainContent');
            if (selectedDays.size === 0) { container.innerHTML = '<div class="empty-state">Day를 선택해 주세요.</div>'; return; }
            
            const mode = document.querySelector('input[name="viewMode"]:checked').value;
            const sorted = [...selectedDays].sort((a, b) => parseInt(a) - parseInt(b));
            let finalHtml = '';

            if (mode === 'study') {
                sorted.forEach(day => {
                    finalHtml += `<div class="paper-content">
                        <div class="page-header">
                            <div class="title-group">
                                <h1>VOCABULARY STUDY</h1>
                                <p>Essential Word List | Day ${day}</p>
                            </div>
                            <div class="header-meta">DATE<span class="input-line"></span></div>
                        </div>
                        <table class="study-table">
                            <thead><tr><th width="25%">WORD</th><th width="40%">MEANING</th><th width="35%">SYNONYMS</th></tr></thead>
                            <tbody>`;
                    
                    (rawVocabData[day] || []).forEach(item => {
                        item.entries.forEach((e, i) => {
                            const isFirst = i === 0;
                            const isLast = i === item.entries.length - 1;
                            const rowClass = isFirst ? (isLast ? '' : 'first-row') : (isLast ? 'last-row' : 'inner-row');
                            finalHtml += `<tr class="${rowClass}">`;
                            if (isFirst) finalHtml += `<td rowspan="${item.entries.length}" class="word-col">${item.word}</td>`;
                            finalHtml += `<td class="meaning-col">${e.m ? `<span class="num-bullet">${i+1}</span>` + e.m : ''}</td>`;
                            finalHtml += `<td class="synonym-col">${e.s.split(',').map(s => `<span class="synonym-badge">${s.trim()}</span>`).join('')}</td></tr>`;
                        });
                    });
                    finalHtml += `</tbody></table></div>`;
                });
            } else {
                // 테스트 시험지 로직
                const combine = document.getElementById('chkCombine').checked;
                const syn = document.getElementById('chkSynonyms').checked;
                const shuffle = document.getElementById('chkShuffle').checked;
                const limit = document.querySelector('input[name="qCount"]:checked').value;

                const buildTest = (days, title) => {
                    let pool = [];
                    days.forEach(d => (rawVocabData[d] || []).forEach(item => {
                        const ans = item.entries.map(e => e.m).join(', ');
                        pool.push({ q: item.word, a: ans });
                        if (syn) item.entries.forEach(e => e.s.split(',').forEach(s => { if(s.trim()) pool.push({ q: s.trim(), a: ans }); }));
                    }));
                    
                    let uniquePool = [];
                    const seen = new Set();
                    pool.forEach(x => { if(!seen.has(x.q.toLowerCase())) { seen.add(x.q.toLowerCase()); uniquePool.push(x); }});
                    if (shuffle) uniquePool.sort(() => Math.random() - 0.5);
                    if (limit !== 'all') uniquePool = uniquePool.slice(0, parseInt(limit));

                    // 문제지 렌더링
                    let testHtml = `<div class="paper-content">
                        <div class="page-header">
                            <div class="title-group">
                                <h1>VOCABULARY TEST</h1>
                                <p>${title}</p>
                            </div>
                            <div class="header-meta">SCORE<span class="input-line"></span></div>
                        </div>
                        <table><thead><tr><th width="35">NO</th><th>WORD</th><th>MEANING</th><th width="35">NO</th><th>WORD</th><th>MEANING</th></tr></thead><tbody>`;
                    
                    const half = Math.ceil(uniquePool.length / 2);
                    for (let i = 0; i < half; i++) {
                        const L = uniquePool[i], R = uniquePool[i+half];
                        testHtml += `<tr><td class="test-num">${i+1}</td><td style="font-weight:700;">${L.q}</td><td></td>`;
                        testHtml += `<td class="test-num">${R?i+half+1:''}</td><td style="font-weight:700;">${R?R.q:''}</td><td></td></tr>`;
                    }
                    testHtml += `</tbody></table></div>`;

                    // 답안지 렌더링
                    testHtml += `<div class="paper-content">
                        <div class="page-header">
                            <div class="title-group">
                                <h1 class="answer-key-text">ANSWER KEY</h1>
                                <p>${title}</p>
                            </div>
                        </div>
                        <table><thead><tr><th width="35">NO</th><th>WORD</th><th>ANSWER</th><th width="35">NO</th><th>WORD</th><th>ANSWER</th></tr></thead><tbody>`;
                    for (let i = 0; i < half; i++) {
                        const L = uniquePool[i], R = uniquePool[i+half];
                        testHtml += `<tr><td class="test-num">${i+1}</td><td style="font-weight:700;">${L.q}</td><td class="answer-key-text" style="font-size:12px;">${L.a}</td>`;
                        testHtml += `<td class="test-num">${R?i+half+1:''}</td><td style="font-weight:700;">${R?R.q:''}</td><td class="answer-key-text" style="font-size:12px;">${R?R.a:''}</td></tr>`;
                    }
                    testHtml += `</tbody></table></div>`;
                    return testHtml;
                };

                if (combine) finalHtml = buildTest(sorted, `Day ${sorted.join(', ')} Integrated`);
                else sorted.forEach(d => finalHtml += buildTest([d], `Day ${d} Individual Test`));
            }
            container.innerHTML = finalHtml;
        }

        // 4. PDF 저장 로직 (Continuous & High Quality)
        document.getElementById('pdfBtn').onclick = async function() {
            if (selectedDays.size === 0) return;
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.add('active');

            // 렌더링 좌표 고정 및 클래스 부여
            window.scrollTo(0,0);
            document.body.classList.add('pdf-mode');

            const mode = document.querySelector('input[name="viewMode"]:checked').value;
            const sorted = [...selectedDays].sort((a, b) => parseInt(a) - parseInt(b));
            let dayStr = sorted.length > 3 ? `${sorted[0]}_to_${sorted[sorted.length-1]}` : sorted.join('_');
            const filename = `Vocab_${mode.toUpperCase()}_Day_${dayStr}.pdf`;

            const opt = {
                margin: 0, // CSS 마진을 사용하기 위해 0 설정
                filename: filename,
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { 
                    scale: 3, // 초고화질
                    useCORS: true, 
                    windowWidth: 1200,
                    letterRendering: true
                },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['css', 'legacy'] } // CSS의 page-break-after/inside 준수
            };

            try {
                await html2pdf().set(opt).from(document.getElementById('mainContent')).save();
            } catch (e) {
                console.error(e);
                alert("PDF 생성 중 문제가 발생했습니다.");
            } finally {
                document.body.classList.remove('pdf-mode');
                overlay.classList.remove('active');
            }
        };
    </script>
</body>
</html>
