<!DOCTYPE html>
<html lang="ko" class="light">
<head>

    <title>영어과 논리 및 논술지도 단어장</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->

    <!-- Lucide Icons -->

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        stone: {
                            50: '#fafaf9',
                            100: '#f5f5f4',
                            200: '#e7e5e4',
                            300: '#d6d3d1',
                            600: '#57534e',
                            700: '#44403c',
                            800: '#292524',
                            850: '#1f1d1b',
                            900: '#1c1917',
                            950: '#0c0a09',
                        },
                        academy: {
                            blue: '#2563eb',
                            gold: '#d97706',
                            bg: '#fdfbf7',
                            darkBg: '#0c0a09'
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Serif KR', 'sans-serif'],
                        serif: ['Noto Serif KR', 'serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #d6d3d1; 
            border-radius: 3px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #44403c; 
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a29e; 
        }

        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        
        /* Chart Container for PC */
        .chart-container {
            position: relative;
            width: 100%;
            height: 250px; /* Fixed height for consistent layout */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body, div, nav, header, main, section, table, tr, td, th {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
    </style>
</head>
<body class="bg-academy-bg dark:bg-academy-darkBg text-stone-800 dark:text-stone-200 font-serif min-h-screen flex flex-col transition-colors duration-300">

    <!-- Header -->
    <header class="bg-white dark:bg-stone-900 shadow-sm border-b border-stone-200 dark:border-stone-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center">
            <div class="flex items-center space-x-3 mb-2 sm:mb-0 cursor-pointer group" onclick="location.reload()">
                <i data-lucide="book-open" class="h-8 w-8 text-academy-blue group-hover:scale-110 transition-transform"></i>
                <div>
                    <h1 class="text-xl font-bold text-stone-900 dark:text-stone-100 tracking-tight group-hover:text-academy-blue transition-colors">
                        <!-- Mobile Title -->
                        <span class="block sm:hidden">논리논술 단어장</span>
                        <!-- Desktop Title -->
                        <span class="hidden sm:block">영어과 논리 및 논술지도 단어장</span>
                    </h1>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                <button onclick="toggleDarkMode()" class="p-2 rounded-full hover:bg-stone-100 dark:hover:bg-stone-800 transition-colors" title="다크 모드 전환">
                    <i data-lucide="moon" class="w-5 h-5 text-stone-600 dark:text-stone-400 dark:hidden"></i>
                    <i data-lucide="sun" class="w-5 h-5 text-stone-400 hidden dark:block"></i>
                </button>
                
                <div class="text-right hidden sm:block">
                    <p class="text-xs font-medium text-stone-500 dark:text-stone-400">총 단어 수</p>
                    <p class="text-xl font-bold text-academy-blue" id="totalWordsHeader">0</p>
                </div>
                
                <button onclick="resetProgress()" class="text-xs text-stone-400 hover:text-red-500 dark:hover:text-red-400 underline transition-colors">
                    진행 초기화
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">

        <!-- 
           Grid Layout Optimized for Height Matching:
           Row 1: Flashcard (8) + Progress (4) -> matched height using h-full
           Row 2: Quiz (8) + Review (4) -> matched height using h-full
        -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Row 1 Left: Flashcard -->
            <div class="lg:col-span-8 flex flex-col h-full">
                <div class="bg-white dark:bg-stone-900 rounded-xl shadow-lg border border-stone-200 dark:border-stone-800 overflow-hidden flex flex-col h-full">
                    <div class="p-4 border-b border-stone-100 dark:border-stone-800 flex justify-between items-center bg-stone-50 dark:bg-stone-850">
                        <h3 class="font-bold text-stone-700 dark:text-stone-200 flex items-center">
                            <i data-lucide="layers" class="w-5 h-5 mr-2 text-academy-blue"></i>
                            플래시카드 학습
                        </h3>
                        <span class="text-xs font-mono bg-white dark:bg-stone-800 border border-stone-200 dark:border-stone-700 px-2 py-1 rounded text-stone-500 dark:text-stone-400" id="cardCounter">1 / 536</span>
                    </div>
                    
                    <div class="p-8 flex-grow flex flex-col items-center justify-center relative bg-stone-50/50 dark:bg-stone-950/50 min-h-[300px]">
                        <div class="perspective-1000 w-full max-w-lg h-64 cursor-pointer group" onclick="flipCard()">
                            <div id="flashcardInner" class="relative w-full h-full text-center transition-transform duration-500 transform-style-3d shadow-xl rounded-2xl">
                                <!-- Front -->
                                <div class="absolute w-full h-full backface-hidden bg-white dark:bg-stone-800 border-2 border-academy-blue/10 dark:border-academy-blue/20 rounded-2xl flex flex-col items-center justify-center p-6 hover:border-academy-blue/30 dark:hover:border-academy-blue/40 transition-colors">
                                    <span class="text-sm text-stone-400 mb-2 uppercase tracking-widest font-semibold">단어</span>
                                    <h2 id="cardWord" class="text-4xl font-bold text-stone-800 dark:text-stone-100 mb-4">abate</h2>
                                </div>
                                <!-- Back -->
                                <div class="absolute w-full h-full backface-hidden bg-academy-blue dark:bg-stone-700 rotate-y-180 rounded-2xl flex flex-col items-center justify-center p-6 text-white shadow-inner">
                                    <span class="text-sm text-blue-200 dark:text-stone-400 mb-2 uppercase tracking-widest font-semibold">뜻</span>
                                    <h2 id="cardMeaning" class="text-3xl font-bold">줄이다</h2>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 bg-white dark:bg-stone-900 border-t border-stone-100 dark:border-stone-800 flex justify-between items-center">
                        <div class="flex space-x-2">
                            <button onclick="prevCard()" class="p-2 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-400 transition-colors tooltip" title="이전 단어">
                                <i data-lucide="chevron-left" class="w-6 h-6"></i>
                            </button>
                            <button onclick="nextCard()" class="p-2 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-400 transition-colors tooltip" title="다음 단어">
                                <i data-lucide="chevron-right" class="w-6 h-6"></i>
                            </button>
                            <button onclick="randomCard()" class="p-2 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-800 text-stone-600 dark:text-stone-400 transition-colors tooltip" title="랜덤 섞기">
                                <i data-lucide="shuffle" class="w-6 h-6"></i>
                            </button>
                        </div>
                        <button onclick="markAsKnown()" id="btnKnown" class="flex items-center px-4 py-2 rounded-lg font-medium transition-colors border shadow-sm text-sm sm:text-base">
                            <!-- Icon injected by JS -->
                        </button>
                    </div>
                </div>
            </div>

            <!-- Row 1 Right: Progress -->
            <div class="lg:col-span-4 flex flex-col h-full">
                <div class="bg-white dark:bg-stone-900 rounded-xl shadow-sm border border-stone-200 dark:border-stone-800 p-6 flex flex-col justify-center h-full">
                    <h3 class="font-bold text-stone-700 dark:text-stone-200 mb-6 flex items-center self-start">
                        <i data-lucide="pie-chart" class="w-5 h-5 mr-2 text-academy-blue"></i>
                        학습 진행률
                    </h3>
                    
                    <!-- 1. PC: Doughnut Chart -->
                    <div class="chart-container hidden lg:flex">
                        <canvas id="progressChart"></canvas>
                    </div>

                    <!-- 2. Mobile: Bar Gauge -->
                    <div class="w-full mb-8 lg:hidden">
                        <div class="flex justify-between text-sm text-stone-600 dark:text-stone-300 mb-2 font-medium">
                            <span id="progressPercent" class="text-3xl font-bold text-academy-blue">0%</span>
                            <span class="text-xs text-stone-400 self-end">목표: 100%</span>
                        </div>
                        <div class="w-full bg-stone-100 dark:bg-stone-800 rounded-full h-4 overflow-hidden border border-stone-200 dark:border-stone-700">
                            <div id="progressBar" class="bg-gradient-to-r from-academy-blue to-cyan-500 h-4 rounded-full transition-all duration-700 ease-out shadow-[0_0_10px_rgba(37,99,235,0.3)]" style="width: 0%"></div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4 text-center mt-auto lg:mt-6 w-full">
                        <div class="bg-stone-50 dark:bg-stone-800 p-4 rounded-lg border border-stone-100 dark:border-stone-700">
                            <p class="text-xs text-stone-500 dark:text-stone-400 mb-1">암기 완료</p>
                            <p class="text-2xl font-bold text-emerald-600 dark:text-emerald-400" id="statKnown">0</p>
                        </div>
                        <div class="bg-stone-50 dark:bg-stone-800 p-4 rounded-lg border border-stone-100 dark:border-stone-700">
                            <p class="text-xs text-stone-500 dark:text-stone-400 mb-1">남은 단어</p>
                            <p class="text-2xl font-bold text-stone-600 dark:text-stone-300" id="statRemaining">536</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Row 2 Left: Quiz -->
            <div class="lg:col-span-8 flex flex-col h-full">
                <div class="bg-white dark:bg-stone-900 rounded-xl shadow-sm border border-stone-200 dark:border-stone-800 p-6 flex flex-col h-full">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-bold text-stone-700 dark:text-stone-200 flex items-center">
                            <i data-lucide="brain-circuit" class="w-5 h-5 mr-2 text-purple-600 dark:text-purple-400"></i>
                            퀴즈
                        </h3>
                        <span id="quizScore" class="text-sm font-bold text-purple-600 dark:text-purple-300 bg-purple-50 dark:bg-purple-900/30 px-3 py-1 rounded-full">점수: 0</span>
                    </div>
                    <div id="quizContainer" class="flex-grow flex flex-col justify-center">
                        <div class="text-center mb-12">
                            <span id="quizWord" class="font-bold text-4xl text-academy-blue dark:text-blue-400 inline-block transition-all duration-300 transform hover:scale-105">abate</span>
                        </div>
                        <div id="quizOptions" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <!-- Options generated by JS -->
                        </div>
                        <div id="quizFeedback" class="mt-2 text-center h-6 font-medium"></div>
                        <button onclick="initQuiz()" class="mt-2 w-full py-3 text-stone-400 dark:text-stone-500 text-sm hover:text-stone-700 dark:hover:text-stone-300 underline transition-colors">건너뛰기 / 다음 문제</button>
                    </div>
                </div>
            </div>

            <!-- Row 2 Right: Review Notes -->
            <div class="lg:col-span-4 flex flex-col h-full">
                <div class="bg-white dark:bg-stone-900 rounded-xl shadow-sm border border-stone-200 dark:border-stone-800 p-6 flex flex-col h-full">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-stone-700 dark:text-stone-200 flex items-center">
                            <i data-lucide="clipboard-list" class="w-5 h-5 mr-2 text-red-500"></i>
                            오답 노트
                        </h3>
                        <button onclick="clearReviewList()" class="text-xs text-stone-400 hover:text-red-500 transition-colors">전체 삭제</button>
                    </div>
                    <!-- h-full allows it to stretch to match the Quiz column's height -->
                    <div class="bg-stone-50 dark:bg-stone-850 rounded-lg border border-stone-100 dark:border-stone-800 flex-grow overflow-y-auto p-2 custom-scroll" id="reviewListContainer" style="min-height: 200px;">
                        <!-- Review Items -->
                        <div class="h-full flex flex-col items-center justify-center text-stone-400 text-xs text-center p-4">
                            <i data-lucide="check-circle-2" class="w-6 h-6 mb-2 opacity-20"></i>
                            <p>퀴즈에서 틀린 단어가<br>여기에 자동으로 추가됩니다.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- Dictionary Table Section -->
        <section class="bg-white dark:bg-stone-900 rounded-xl shadow-sm border border-stone-200 dark:border-stone-800 overflow-hidden">
            <div class="p-6 border-b border-stone-200 dark:border-stone-800 bg-stone-50 dark:bg-stone-850 flex flex-col md:flex-row justify-between items-center gap-4">
                <div>
                    <h3 class="font-bold text-stone-800 dark:text-stone-200 text-lg flex items-center">
                        <i data-lucide="list" class="w-5 h-5 mr-2 text-stone-600 dark:text-stone-400"></i>
                        전체 단어 목록
                    </h3>
                </div>
                <div class="relative w-full md:w-64">
                    <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 w-4 h-4 text-stone-400"></i>
                    <input type="text" id="searchInput" oninput="filterTable()" placeholder="단어 검색..." 
                        class="w-full pl-10 pr-4 py-2 border border-stone-300 dark:border-stone-700 bg-white dark:bg-stone-800 text-stone-900 dark:text-stone-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-academy-blue focus:border-transparent">
                </div>
            </div>
            
            <div class="w-full">
                <table class="w-full text-left border-collapse table-fixed">
                    <thead class="bg-stone-100 dark:bg-stone-800 sticky top-0 z-10 shadow-sm">
                        <tr>
                            <th class="p-4 text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider w-12 text-center">#</th>
                            <th class="p-4 text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider cursor-pointer hover:bg-stone-200 dark:hover:bg-stone-700 w-1/3" onclick="sortTable('word')">단어 <i data-lucide="arrow-up-down" class="inline w-3 h-3 ml-1"></i></th>
                            <th class="p-4 text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider w-1/3">뜻</th>
                            <th class="p-4 text-xs font-bold text-stone-500 dark:text-stone-400 uppercase tracking-wider w-20 text-center">상태</th>
                        </tr>
                    </thead>
                    <tbody id="vocabTableBody" class="divide-y divide-stone-100 dark:divide-stone-800">
                        <!-- Table Rows Generated by JS -->
                    </tbody>
                </table>
            </div>
            <div class="p-4 border-t border-stone-200 dark:border-stone-800 bg-stone-50 dark:bg-stone-850 text-center text-xs text-stone-500 dark:text-stone-400" id="tableFooter">
                Showing 536 words
            </div>
        </section>

    </main>

    <script>
        // --- Logic ---
        
        // State
        let vocabList = [];
        let knownIds = new Set();
        let quizScore = 0;
        let reviewList = []; 

        let currentFlashcardIndex = 0;
        let isFlipped = false;
        let quizCurrentWord = null;
        
        // Timer State - Removed completely
        
        // Charts
        let progressChart = null;

        // Persistence Keys
        const STORAGE_KEY_KNOWN = 'vocabMaster_knownIds';
        const STORAGE_KEY_SCORE = 'vocabMaster_quizScore';
        const STORAGE_KEY_REVIEW = 'vocabMaster_reviewList';
        const STORAGE_KEY_THEME = 'vocabMaster_theme';

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadState();
            initTheme();
            parseData();
            initCharts(); // Re-enabled
            updateStats();
            renderReviewList();
            initFlashcards();
            initQuiz();
            renderTable();
        });

        // 0. State Management (Persistence)
        function loadState() {
            // Load Known Words
            const savedKnown = localStorage.getItem(STORAGE_KEY_KNOWN);
            if (savedKnown) {
                try {
                    const parsed = JSON.parse(savedKnown);
                    knownIds = new Set(parsed);
                } catch(e) { console.error("Error loading known words", e); }
            }
            
            // Load Score
            const savedScore = localStorage.getItem(STORAGE_KEY_SCORE);
            if (savedScore) {
                quizScore = parseInt(savedScore, 10);
                document.getElementById('quizScore').textContent = `점수: ${quizScore}`;
            }

            // Load Review List
            const savedReview = localStorage.getItem(STORAGE_KEY_REVIEW);
            if (savedReview) {
                try {
                    reviewList = JSON.parse(savedReview);
                } catch(e) { console.error("Error loading review list", e); }
            }
        }

        function saveState() {
            localStorage.setItem(STORAGE_KEY_KNOWN, JSON.stringify([...knownIds]));
            localStorage.setItem(STORAGE_KEY_SCORE, quizScore);
            localStorage.setItem(STORAGE_KEY_REVIEW, JSON.stringify(reviewList));
        }

        // Theme Management
        function initTheme() {
            const savedTheme = localStorage.getItem(STORAGE_KEY_THEME);
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
        }

        // 1. Data Parsing
        function parseData() {
            const rawText = document.getElementById('rawData').textContent;
            const lines = rawText.trim().split('\n');
            const regex = /(\d+)\.\s*\*\*(.*?)\*\*:\s*(.*)/;

            vocabList = lines.map(line => {
                const match = line.match(regex);
                if (match) {
                    return {
                        id: parseInt(match[1]),
                        word: match[2].trim(),
                        meaning: match[3].trim()
                    };
                }
                return null;
            }).filter(item => item !== null);

            document.getElementById('totalWordsHeader').textContent = vocabList.length;
            document.getElementById('statRemaining').textContent = vocabList.length;
        }

        // 2. Charts (Doughnut Only)
        function initCharts() {
            const ctxP = document.getElementById('progressChart').getContext('2d');
            
            // Check if chart instance already exists and destroy it if so (prevents duplication bugs)
            if (progressChart) {
                progressChart.destroy();
            }

            progressChart = new Chart(ctxP, {
                type: 'doughnut',
                data: {
                    labels: ['암기 완료', '남은 단어'],
                    datasets: [{
                        data: [knownIds.size, vocabList.length - knownIds.size], // Initialize with current data
                        backgroundColor: ['#10b981', '#e7e5e4'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: true }
                    },
                    cutout: '70%'
                }
            });
        }

        function updateStats() {
            const knownCount = knownIds.size;
            const remaining = vocabList.length - knownCount;
            const percent = vocabList.length > 0 ? Math.round((knownCount / vocabList.length) * 100) : 0;
            
            // DOM Updates
            document.getElementById('statKnown').textContent = knownCount;
            document.getElementById('statRemaining').textContent = remaining;
            
            // Update Desktop Chart
            if (progressChart) {
                progressChart.data.datasets[0].data = [knownCount, remaining];
                progressChart.update();
            }

            // Update Mobile Progress Bar
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            if (progressBar && progressPercent) {
                progressBar.style.width = `${percent}%`;
                progressPercent.textContent = `${percent}%`;
            }
        }

        function resetProgress() {
            if(confirm('진행 상황을 초기화하시겠습니까? 모든 암기 기록이 삭제됩니다.')) {
                knownIds.clear();
                quizScore = 0;
                reviewList = [];
                saveState();
                updateStats();
                document.getElementById('quizScore').textContent = `점수: 0`;
                renderReviewList();
                renderTable(); 
                initFlashcards();
            }
        }

        // --- Review Notes Logic ---
        function addToReviewList(item) {
            // Avoid duplicates
            if (!reviewList.some(r => r.id === item.id)) {
                reviewList.unshift(item); // Add to top
                saveState();
                renderReviewList();
            }
        }

        function removeFromReviewList(id) {
            reviewList = reviewList.filter(item => item.id !== id);
            saveState();
            renderReviewList();
        }

        function clearReviewList() {
            if (reviewList.length === 0) return;
            if (confirm("오답 노트를 모두 삭제하시겠습니까?")) {
                reviewList = [];
                saveState();
                renderReviewList();
            }
        }

        function renderReviewList() {
            const container = document.getElementById('reviewListContainer');
            container.innerHTML = '';

            if (reviewList.length === 0) {
                container.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-stone-400 text-xs text-center p-4">
                        <i data-lucide="check-circle-2" class="w-6 h-6 mb-2 opacity-20"></i>
                        <p>퀴즈에서 틀린 단어가<br>여기에 자동으로 추가됩니다.</p>
                    </div>`;
            } else {
                reviewList.forEach(item => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center p-2 mb-2 bg-white dark:bg-stone-800 rounded border border-stone-100 dark:border-stone-700 shadow-sm text-sm";
                    div.innerHTML = `
                        <div>
                            <span class="font-bold text-stone-700 dark:text-stone-200 mr-2">${item.word}</span>
                            <span class="text-stone-500 dark:text-stone-400 text-xs">${item.meaning}</span>
                        </div>
                        <button onclick="removeFromReviewList(${item.id})" class="text-stone-400 hover:text-red-500 p-1">
                            <i data-lucide="x" class="w-3 h-3"></i>
                        </button>
                    `;
                    container.appendChild(div);
                });
            }
            lucide.createIcons();
        }

        // Flashcards
        function initFlashcards() {
            currentFlashcardIndex = 0; 
            renderCard();
        }

        function renderCard() {
            const item = vocabList[currentFlashcardIndex];
            if (!item) return;

            const cardInner = document.getElementById('flashcardInner');
            const btnKnown = document.getElementById('btnKnown');
            
            // Reset Flip
            isFlipped = false;
            cardInner.style.transform = 'rotateY(0deg)';

            // Content
            document.getElementById('cardWord').textContent = item.word;
            document.getElementById('cardMeaning').textContent = item.meaning;
            document.getElementById('cardCounter').textContent = `${currentFlashcardIndex + 1} / ${vocabList.length}`;

            // Button State
            if (knownIds.has(item.id)) {
                btnKnown.className = "flex items-center px-4 py-2 rounded-lg font-medium transition-colors border shadow-sm bg-emerald-600 border-emerald-700 text-white hover:bg-emerald-700";
                btnKnown.innerHTML = '<i data-lucide="check" class="w-4 h-4 mr-2"></i> 암기 됨';
            } else {
                btnKnown.className = "flex items-center px-4 py-2 rounded-lg font-medium transition-colors border shadow-sm bg-stone-50 dark:bg-stone-800 border-stone-200 dark:border-stone-700 text-stone-600 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-stone-700";
                btnKnown.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4 mr-2"></i> 암기 완료';
            }
            lucide.createIcons();
        }

        function flipCard() {
            const cardInner = document.getElementById('flashcardInner');
            isFlipped = !isFlipped;
            cardInner.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
        }

        function nextCard() {
            if (currentFlashcardIndex < vocabList.length - 1) {
                currentFlashcardIndex++;
                renderCard();
            }
        }

        function prevCard() {
            if (currentFlashcardIndex > 0) {
                currentFlashcardIndex--;
                renderCard();
            }
        }

        function randomCard() {
            currentFlashcardIndex = Math.floor(Math.random() * vocabList.length);
            renderCard();
        }

        function toggleKnown(id) {
            if (knownIds.has(id)) {
                knownIds.delete(id);
            } else {
                knownIds.add(id);
            }
            saveState();
            updateStats();
            
            if (vocabList[currentFlashcardIndex].id === id) {
                renderCard();
            }
            renderTable(document.getElementById('searchInput').value);
        }

        function markAsKnown() {
            toggleKnown(vocabList[currentFlashcardIndex].id);
        }

        // Quiz
        function initQuiz() {
            const targetIndex = Math.floor(Math.random() * vocabList.length);
            quizCurrentWord = vocabList[targetIndex];
            
            const options = [quizCurrentWord];
            while (options.length < 4) {
                const randIndex = Math.floor(Math.random() * vocabList.length);
                if (randIndex !== targetIndex && !options.includes(vocabList[randIndex])) {
                    options.push(vocabList[randIndex]);
                }
            }
            options.sort(() => Math.random() - 0.5);
            
            document.getElementById('quizWord').textContent = quizCurrentWord.word;
            const feedback = document.getElementById('quizFeedback');
            feedback.textContent = '';
            feedback.className = 'mt-2 text-center h-6 font-medium';
            
            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "w-full p-3 text-left bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-lg hover:bg-stone-100 dark:hover:bg-stone-700 transition-colors text-sm font-medium text-stone-700 dark:text-stone-300";
                btn.textContent = opt.meaning;
                btn.onclick = () => checkAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, btn) {
            const feedback = document.getElementById('quizFeedback');
            const allBtns = document.getElementById('quizOptions').children;
            
            for (let b of allBtns) b.disabled = true;

            if (selected.id === quizCurrentWord.id) {
                btn.classList.remove('bg-stone-50', 'dark:bg-stone-800', 'text-stone-700', 'dark:text-stone-300');
                btn.classList.add('bg-green-100', 'dark:bg-green-900/30', 'border-green-300', 'dark:border-green-800', 'text-green-800', 'dark:text-green-300');
                feedback.textContent = '정답입니다! 🎉';
                feedback.classList.add('text-green-600', 'dark:text-green-400');
                quizScore += 10;
                document.getElementById('quizScore').textContent = `점수: ${quizScore}`;
                saveState();
                setTimeout(initQuiz, 1500);
            } else {
                btn.classList.remove('bg-stone-50', 'dark:bg-stone-800', 'text-stone-700', 'dark:text-stone-300');
                btn.classList.add('bg-red-50', 'dark:bg-red-900/30', 'border-red-200', 'dark:border-red-800', 'text-red-700', 'dark:text-red-300');
                feedback.textContent = `오답입니다. 오답 노트에 추가되었습니다.`;
                feedback.classList.add('text-red-500', 'dark:text-red-400');
                
                addToReviewList(quizCurrentWord);
                
                for (let b of allBtns) {
                    if (b.textContent === quizCurrentWord.meaning) {
                        b.classList.add('bg-green-50', 'dark:bg-green-900/20', 'border-green-200', 'dark:border-green-800', 'text-green-700', 'dark:text-green-400');
                    }
                }
            }
        }

        // Table
        function renderTable(filterText = '') {
            const tbody = document.getElementById('vocabTableBody');
            tbody.innerHTML = '';
            
            const filtered = vocabList.filter(item => 
                item.word.toLowerCase().includes(filterText.toLowerCase()) || 
                item.meaning.includes(filterText)
            );

            const displayList = filtered; 

            displayList.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-stone-50 dark:hover:bg-stone-850 transition-colors border-b border-stone-100 dark:border-stone-800";
                
                const isKnown = knownIds.has(item.id);
                const statusButton = isKnown 
                    ? `<button onclick="toggleKnown(${item.id})" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-emerald-100 dark:bg-emerald-900/30 text-emerald-800 dark:text-emerald-300 hover:bg-emerald-200 dark:hover:bg-emerald-800 transition-colors cursor-pointer">암기완료</button>`
                    : `<button onclick="toggleKnown(${item.id})" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-stone-100 dark:bg-stone-800 text-stone-500 dark:text-stone-400 hover:bg-stone-200 dark:hover:bg-stone-700 transition-colors cursor-pointer">학습중</button>`;

                tr.innerHTML = `
                    <td class="p-4 text-center text-xs text-stone-400 font-mono break-words">${item.id}</td>
                    <td class="p-4 font-medium text-stone-800 dark:text-stone-200 font-serif break-words">${item.word}</td>
                    <td class="p-4 text-stone-600 dark:text-stone-400 break-words">${item.meaning}</td>
                    <td class="p-4 text-center">${statusButton}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('tableFooter').textContent = `총 ${vocabList.length}개 중 ${filtered.length}개 표시`;
        }

        function filterTable() {
            const text = document.getElementById('searchInput').value;
            renderTable(text);
        }

        let sortAsc = true;
        function sortTable(key) {
            sortAsc = !sortAsc;
            if (key === 'word') {
                vocabList.sort((a, b) => sortAsc ? a.word.localeCompare(b.word) : b.word.localeCompare(a.word));
            }
            filterTable();
        }

    </script>
</body>
</html>
